<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaConecta</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0b1120; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 10px; }
.phone { width: 100%; max-width: 420px; background: #0f172a; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #1e293b; }
.header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-icon { width: 38px; height: 38px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.header-title { color: white; font-weight: 700; font-size: 16px; }
.header-sub { color: #bfdbfe; font-size: 10px; }
.header-badge { padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; font-size: 11px; font-weight: 600; }
.mic-btn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; font-family: inherit; }
.mic-btn.active { background: #4ade80; border-color: #4ade80; animation: micPulse 1s infinite; }
@keyframes micPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); } }

.screen { padding: 16px; min-height: 350px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.device-card { border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; border: 2px solid; font-family: inherit; background: transparent; color: inherit; width: 100%; transition: all 0.3s; }
.device-card .emoji { font-size: 32px; margin-bottom: 8px; display: block; }
.device-card .label { font-weight: 700; font-size: 14px; }
.device-card .status { font-size: 11px; margin-top: 4px; }
.device-card.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.off .status { color: #64748b; }
.device-card.on { background: #1e3a8a; border-color: #3b82f6; color: #818cf8; }
.device-card.on .status { color: #4ade80; }

.routine-btn { padding: 16px; border-radius: 14px; border: 2px solid; cursor: pointer; text-align: center; font-family: inherit; background: transparent; transition: all 0.3s; }
.routine-btn .emoji { font-size: 28px; margin-bottom: 8px; display: block; }
.routine-btn .name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.routine-btn .desc { font-size: 11px; opacity: 0.8; }

.screen-title { color: white; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="phone">
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">🏠</div>
            <div><div class="header-title">CasaConecta</div><div class="header-sub">Accesible</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
            <div class="header-badge" id="micStatus">🔊</div>
        </div>
    </div>
    <div class="screen" id="screenContent"></div>
</div>

<script>
// Estados de los dispositivos
var devices = {
    luz_sala: false,
    luz_cocina: false,
    luz_dormitorio: false,
    puerta: false,
    puerta_traba: true,
    tv_sala: false,
    aire_sala: false
};

// Reconocimiento de voz
var recognition = null;
var micActive = false;
var vozDisponible = false;

// Función para hablar
function hablar(texto) {
    if (!texto || texto.trim() === '') return;
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    setTimeout(function() {
        var utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
        console.log('Dijo:', texto);
    }, 100);
}

// Toggle de dispositivo (función compartida por botón y voz)
function toggleDevice(device) {
    if (devices.hasOwnProperty(device)) {
        devices[device] = !devices[device];
        renderScreen();
        var estado = devices[device] ? 'encendido' : 'apagado';
        var nombre = device.replace(/_/g, ' ');
        hablar(nombre + ' ' + estado);
    }
}

// Activar luz (función compartida)
function encenderLuz(sala) {
    var key = 'luz_' + sala;
    if (devices.hasOwnProperty(key)) {
        devices[key] = true;
        renderScreen();
        hablar('Luz ' + sala + ' encendida');
    }
}

// Apagar luz (función compartida)
function apagarLuz(sala) {
    var key = 'luz_' + sala;
    if (devices.hasOwnProperty(key)) {
        devices[key] = false;
        renderScreen();
        hablar('Luz ' + sala + ' apagada');
    }
}

// Abrir puerta (función compartida)
function abrirPuerta() {
    devices.puerta = true;
    devices.puerta_traba = false;
    renderScreen();
    hablar('Puerta abierta');
}

// Cerrar puerta (función compartida)
function cerrarPuerta() {
    devices.puerta = false;
    devices.puerta_traba = true;
    renderScreen();
    hablar('Puerta cerrada');
}

// Inicializar reconocimiento de voz
function initVoice() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onresult = function(event) {
            var comando = event.results[0][0].transcript.toLowerCase().trim();
            console.log('Comando de voz:', comando);
            procesarComandoVoz(comando);
            stopMic();
        };
        
        recognition.onerror = function(event) {
            console.error('Error de voz:', event.error);
            stopMic();
        };
        
        recognition.onend = function() {
            console.log('Reconocimiento terminado');
            stopMic();
        };
        
        vozDisponible = true;
        console.log('Reconocimiento de voz inicializado');
    } else {
        console.warn('Reconocimiento de voz no disponible');
        vozDisponible = false;
    }
}

// Procesar comando de voz - USA LAS MISMAS FUNCIONES QUE LOS BOTONES
function procesarComandoVoz(comando) {
    console.log('Procesando:', comando);
    
    // Normalizar
    comando = comando.toLowerCase().trim();
    comando = comando.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    
    if (comando.length < 2) return;
    
    // Comandos de luces - usan las mismas funciones que los botones
    if (comando.includes('luz') && comando.includes('sala')) {
        toggleDevice('luz_sala');
    } else if (comando.includes('luz') && comando.includes('cocina')) {
        toggleDevice('luz_cocina');
    } else if (comando.includes('luz') && comando.includes('dormitorio')) {
        toggleDevice('luz_dormitorio');
    } else if (comando.includes('encender') && comando.includes('luz')) {
        encenderLuz('sala');
    } else if (comando.includes('apagar') && comando.includes('luz')) {
        apagarLuz('sala');
    }
    // Comandos de puerta - usan las mismas funciones que los botones
    else if (comando.includes('abrir') && comando.includes('puerta')) {
        abrirPuerta();
    } else if (comando.includes('cerrar') && comando.includes('puerta')) {
        cerrarPuerta();
    }
    // Comandos de TV - usan las mismas funciones que los botones
    else if (comando.includes('televisor') || comando.includes('tv')) {
        toggleDevice('tv_sala');
    }
    // Comandos de aire - usan las mismas funciones que los botones
    else if (comando.includes('aire') || comando.includes('climatizacion')) {
        toggleDevice('aire_sala');
    }
    else {
        hablar('No entendí el comando');
    }
}

// Activar micrófono
function startMic() {
    if (!vozDisponible || !recognition) {
        hablar('Reconocimiento de voz no disponible');
        return;
    }
    
    try {
        recognition.start();
        micActive = true;
        updateMicUI();
        console.log('Micrófono activado');
    } catch (e) {
        console.error('Error al activar micrófono:', e);
        micActive = false;
        updateMicUI();
    }
}

// Desactivar micrófono
function stopMic() {
    if (recognition) {
        try {
            recognition.stop();
        } catch (e) {
            console.log('Micrófono ya detenido');
        }
    }
    micActive = false;
    updateMicUI();
}

// Toggle micrófono
function toggleMic() {
    if (micActive) {
        stopMic();
        hablar('Micrófono desactivado');
    } else {
        startMic();
        hablar('Te escucho');
    }
}

// Actualizar UI del micrófono
function updateMicUI() {
    var btn = document.getElementById('micBtn');
    var status = document.getElementById('micStatus');
    
    if (micActive) {
        btn.classList.add('active');
        status.textContent = '🎤';
        status.style.background = '#4ade80';
    } else {
        btn.classList.remove('active');
        status.textContent = '🔊';
        status.style.background = 'rgba(255,255,255,0.2)';
    }
}

// Renderizar pantalla
function renderScreen() {
    var container = document.getElementById('screenContent');
    var html = '<div class="screen-title">🏠 Control de Casa</div>';
    
    // Botones de rutinas rápidas
    html += '<div class="grid-2" style="margin-bottom:16px;">';
    html += '<button class="routine-btn" style="border-color:#4ade80;background:#4ade8020;color:#4ade80;" onclick="ejecutarRutinaTodo()"><span class="emoji">🏠</span><div class="name">Llegué a casa</div><div class="desc">Encender todo</div></button>';
    html += '<button class="routine-btn" style="border-color:#ef4444;background:#ef444420;color:#ef4444;" onclick="ejecutarRutinaNada()"><span class="emoji">🚶</span><div class="name">Me voy</div><div class="desc">Apagar todo</div></button>';
    html += '</div>';
    
    // Dispositivos individuales
    html += '<div class="grid-2">';
    
    var items = [
        { key: 'luz_sala', icon: '💡', label: 'Luz Sala' },
        { key: 'luz_cocina', icon: '🍳', label: 'Luz Cocina' },
        { key: 'luz_dormitorio', icon: '🛏️', label: 'Luz Dormitorio' },
        { key: 'puerta', icon: '🚪', label: 'Puerta' },
        { key: 'tv_sala', icon: '📺', label: 'TV Sala' },
        { key: 'aire_sala', icon: '❄️', label: 'Aire Sala' }
    ];
    
    for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var isOn = devices[item.key] || false;
        var cls = isOn ? 'on' : 'off';
        var status = isOn ? '● ENCENDIDO' : '○ APAGADO';
        html += '<button class="device-card ' + cls + '" onclick="toggleDevice(\'' + item.key + '\')"><span class="emoji">' + item.icon + '</span><div class="label">' + item.label + '</div><div class="status">' + status + '</div></button>';
    }
    
    html += '</div>';
    
    // Ayuda de comandos de voz
    if (vozDisponible) {
        html += '<div style="margin-top:16px;background:#1e293b;border-radius:12px;padding:14px;border:2px solid #3b82f6;"><div style="color:#94a3b8;font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:8px;">🎤 Comandos de Voz</div><div style="color:#cbd5e1;font-size:12px;line-height:1.6;"><div style="margin-bottom:4px;">• "luz sala" - encender/apagar luz</div><div style="margin-bottom:4px;">• "abrir puerta" / "cerrar puerta"</div><div style="margin-bottom:4px;">• "televisor" - encender/apagar TV</div><div style="margin-bottom:4px;">• "aire" - encender/apagar aire</div><div>• "encender luz" / "apagar luz"</div></div></div>';
    }
    
    container.innerHTML = html;
}

// Rutinas
function ejecutarRutinaTodo() {
    devices.luz_sala = true;
    devices.luz_cocina = true;
    devices.luz_dormitorio = true;
    devices.puerta = true;
    devices.puerta_traba = false;
    renderScreen();
    hablar('Llegué a casa. Todo encendido');
}

function ejecutarRutinaNada() {
    devices.luz_sala = false;
    devices.luz_cocina = false;
    devices.luz_dormitorio = false;
    devices.puerta = false;
    devices.puerta_traba = true;
    devices.tv_sala = false;
    devices.aire_sala = false;
    renderScreen();
    hablar('Me voy de casa. Todo apagado');
}

// Inicialización
window.onload = function() {
    initVoice();
    renderScreen();
    
    // Activar micrófono automáticamente al inicio
    setTimeout(function() {
        if (vozDisponible) {
            startMic();
            setTimeout(function() {
                hablar('CasaConecta lista. Te escucho');
            }, 500);
        }
    }, 1000);
};

console.log('CasaConecta cargada');
</script>
</body>
</html>
