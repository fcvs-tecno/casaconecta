<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaConecta - Accesible</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0b1120; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 10px; }
.phone { width: 100%; max-width: 420px; background: #0f172a; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #1e293b; position: relative; }
.header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-icon { width: 38px; height: 38px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.header-title { color: white; font-weight: 700; font-size: 16px; }
.header-sub { color: #bfdbfe; font-size: 10px; }
.header-badge { padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; font-size: 11px; font-weight: 600; }
.nav { background: #1e293b; padding: 8px 12px; display: flex; gap: 5px; overflow-x: auto; border-bottom: 1px solid #334155; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn { padding: 6px 12px; border-radius: 8px; border: none; background: #334155; color: #94a3b8; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
.nav-btn.active { background: #3b82f6; color: white; }
.screen { padding: 16px; min-height: 350px; }

.profile-bar { padding: 0 16px 16px; }
.profile-box { background: #1e293b; border-radius: 14px; padding: 12px; }
.profile-label { color: #94a3b8; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.profile-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.profile-btn { flex: 1; min-width: 60px; padding: 8px 6px 8px 28px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #64748b; font-weight: 600; font-size: 11px; cursor: pointer; font-family: inherit; position: relative; transition: all 0.3s; }
.profile-btn .check-indicator { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid #64748b; border-radius: 4px; display: inline-block; transition: all 0.3s; }
.profile-btn.active .check-indicator { background: #3b82f6; border-color: #3b82f6; }
.profile-btn.active .check-indicator::after { content: '✓'; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
.profile-btn.active { border-color: #3b82f6; background: #1e293b; color: white; }

.welcome-card { border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid; }
.welcome-card.motriz { background: #1e1b4b40; border-color: #3949ab60; }
.welcome-card.auditiva { background: #1a2e0a40; border-color: #7cb34260; }
.welcome-card.visual { background: #2a1a0040; border-color: #fb8c0060; }
.welcome-card.mental { background: #2a0a2e40; border-color: #8e24aa60; }
.welcome-title { font-size: 20px; margin-bottom: 4px; }
.welcome-desc { font-size: 13px; opacity: 0.85; }
.welcome-hint { margin-top: 8px; padding: 6px 10px; background: #0f172a; border-radius: 8px; font-size: 11px; color: #94a3b8; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.device-card { border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; border: 2px solid; font-family: inherit; background: transparent; color: inherit; width: 100%; transition: all 0.3s; }
.device-card .emoji { font-size: 32px; margin-bottom: 4px; display: block; }
.device-card .label { font-weight: 700; font-size: 13px; }
.device-card .status { font-size: 10px; margin-top: 3px; }
.device-card .hint { font-size: 9px; margin-top: 3px; color: #64748b; }
.device-card.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.off .status { color: #64748b; }
.device-card.on-motriz { background: #1e1b4b; border-color: #3949ab; color: #818cf8; }
.device-card.on-motriz .status { color: #4ade80; }
.device-card.on-auditiva { background: #1a2e0a; border-color: #7cb342; color: #a5d6a7; }
.device-card.on-auditiva .status { color: #4ade80; }
.device-card.on-visual { background: #2a1a00; border-color: #fb8c00; color: #ffcc80; }
.device-card.on-visual .status { color: #4ade80; }
.device-card.on-mental { background: #2a0a2e; border-color: #8e24aa; color: #ce93d8; }
.device-card.on-motriz.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.on-auditiva.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.on-visual.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.on-mental.off { background: #1e293b; border-color: #334155; color: #94a3b8; }

/* ESTADO ACTIVO PARA MODOS */
.device-card.modo-activo {
    border-color: #4ade80 !important;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
    animation: modoPulse 2s infinite;
}
@keyframes modoPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); }
    50% { box-shadow: 0 0 40px rgba(74, 222, 128, 0.4); }
}

.temp-controls { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.temp-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; cursor: pointer; font-size: 16px; font-family: inherit; }

.routine-btn { padding: 14px 10px; border-radius: 14px; border: 2px solid; cursor: pointer; text-align: center; font-family: inherit; background: transparent; transition: all 0.3s; }
.routine-btn .emoji { font-size: 28px; margin-bottom: 4px; display: block; }
.routine-btn .name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.routine-btn .desc { font-size: 10px; opacity: 0.8; }
.routine-btn.modo-activo {
    border-color: #4ade80 !important;
    background: #4ade8020 !important;
    color: #4ade80 !important;
}

.device-row { background: #1e293b; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.device-row .emoji { font-size: 24px; width: 32px; text-align: center; }
.device-row .info { flex: 1; }
.device-row .name { font-weight: 600; font-size: 14px; }
.device-row .room { font-size: 11px; color: #64748b; }
.device-row .toggle { width: 48px; height: 26px; border-radius: 13px; border: none; cursor: pointer; position: relative; }
.device-row .toggle .knob { width: 22px; height: 22px; border-radius: 50%; background: white; position: absolute; top: 2px; transition: all 0.3s; }
.device-row .toggle.on .knob { right: 2px; }
.device-row .toggle.off .knob { left: 2px; }
.device-row .delete-btn { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-family: inherit; }
.device-row .delete-btn:hover { background: #ef444420; }

.add-device-area { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #334155; }
.add-device-area .title { color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-device-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-device-row input, .add-device-row select { flex: 1; min-width: 80px; padding: 10px 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 13px; }
.add-device-row input:focus, .add-device-row select:focus { border-color: #3b82f6; outline: none; }
.add-device-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-device-row button:hover { background: #2563eb; }

.medicamento-card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
.medicamento-card .header { display: flex; justify-content: space-between; align-items: center; padding: 0; background: transparent; }
.medicamento-card .nombre { font-size: 16px; font-weight: 700; color: white; }
.medicamento-card .dosis { font-size: 13px; color: #94a3b8; }
.medicamento-card .horario { font-size: 14px; color: #4ade80; font-weight: 600; }
.medicamento-card .estado { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.medicamento-card .estado.pendiente { background: #fbbf2420; color: #fbbf24; }
.medicamento-card .estado.tomado { background: #4ade8020; color: #4ade80; }
.medicamento-card .estado.faltado { background: #ef444420; color: #ef4444; }
.medicamento-card .acciones { display: flex; gap: 8px; margin-top: 8px; }
.medicamento-card .acciones button { padding: 6px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 12px; }
.medicamento-card .acciones .tomar-btn { background: #4ade80; color: #0f172a; }
.medicamento-card .acciones .tomar-btn:hover { background: #22c55e; }
.medicamento-card .acciones .eliminar-btn { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
.medicamento-card .acciones .eliminar-btn:hover { background: #ef444440; }

.add-med-area { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #8b5cf6; }
.add-med-area .title { color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-med-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-med-row input, .add-med-row select { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 13px; }
.add-med-row input:focus, .add-med-row select:focus { border-color: #8b5cf6; outline: none; }
.add-med-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #8b5cf6; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-med-row button:hover { background: #7c3aed; }

.contacto-card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #ef4444; }
.contacto-card .header { display: flex; justify-content: space-between; align-items: center; padding: 0; background: transparent; }
.contacto-card .nombre { font-size: 16px; font-weight: 700; color: white; }
.contacto-card .telefono { font-size: 14px; color: #94a3b8; }
.contacto-card .relacion { font-size: 12px; color: #4ade80; }
.contacto-card .acciones { display: flex; gap: 8px; margin-top: 8px; }
.contacto-card .acciones button { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; }
.contacto-card .acciones .llamar-btn { background: #22c55e; color: white; }
.contacto-card .acciones .llamar-btn:hover { background: #16a34a; }
.contacto-card .acciones .eliminar-btn { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
.contacto-card .acciones .eliminar-btn:hover { background: #ef444440; }

.add-contacto-area { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #ef4444; }
.add-contacto-area .title { color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-contacto-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-contacto-row input, .add-contacto-row select { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 13px; }
.add-contacto-row input:focus, .add-contacto-row select:focus { border-color: #ef4444; outline: none; }
.add-contacto-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #ef4444; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-contacto-row button:hover { background: #dc2626; }

.emergency-btn { width: 100%; padding: 20px; border-radius: 14px; border: 2px solid #ef4444; background: #ef444420; color: #ef4444; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
.emergency-btn .emoji { font-size: 28px; }

.setting-row { background: #1e293b; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.setting-row .emoji { font-size: 20px; width: 28px; text-align: center; }
.setting-row .label { flex: 1; color: #e2e8f0; font-weight: 500; font-size: 13px; }
.setting-row .value { color: #818cf8; font-size: 12px; font-weight: 600; }
.setting-toggle { width: 44px; height: 24px; border-radius: 12px; border: none; cursor: pointer; position: relative; }
.setting-toggle .knob { width: 18px; height: 18px; border-radius: 50%; background: white; position: absolute; top: 3px; transition: all 0.3s; }
.setting-toggle.on .knob { right: 3px; }
.setting-toggle.off .knob { left: 3px; }

.screen-title { color: white; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.history-box { margin-top: 14px; background: #1e293b; border-radius: 10px; padding: 14px; }
.history-title { color: #94a3b8; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.history-item { display: flex; justify-content: space-between; color: #cbd5e1; font-size: 12px; padding: 5px 0; border-bottom: 1px solid #334155; }
.history-item:last-child { border-bottom: none; }
.history-time { color: #64748b; }

.modo-scanning .device-card, .modo-scanning .routine-btn { cursor: pointer; transition: all 0.3s; }
.scanning-active { animation: scanningPulse 0.8s ease-in-out infinite; border-color: #3b82f6 !important; box-shadow: 0 0 30px rgba(59, 130, 246, 0.6) !important; transform: scale(1.05); z-index: 100; position: relative; }
@keyframes scanningPulse { 0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); } 50% { box-shadow: 0 0 60px rgba(59, 130, 246, 0.8); } }
.scanning-confirmado { animation: confirmPulse 0.5s ease; border-color: #4ade80 !important; box-shadow: 0 0 40px rgba(74, 222, 128, 0.6) !important; }
@keyframes confirmPulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
.control-scanning { padding: 12px 16px; background: #1e293b; border-radius: 12px; margin-bottom: 14px; border: 2px solid #3b82f6; }
.scanning-status { display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 12px; }
.scanning-status.inactivo { background: #7f1d1d; color: #fca5a5; }
.scanning-status.activo { background: #14532d; color: #86efac; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes alertPulse { 0%, 100% { background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; } 50% { background-color: rgba(239, 68, 68, 0.6); border-color: #fca5a5; } }
.fade-in { animation: fadeIn 0.25s ease; }

.bateria-alerta { position: fixed; top: 0; left: 0; right: 0; background: #7f1d1d; color: #fca5a5; padding: 12px 16px; text-align: center; font-weight: 700; font-size: 16px; z-index: 99999; animation: alertPulse 1s infinite; border-bottom: 3px solid #ef4444; display: flex; align-items: center; justify-content: center; gap: 12px; }
.bateria-alerta .icono { font-size: 24px; }
.bateria-alerta .cerrar { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px 8px; font-family: inherit; }
.bateria-alerta .cerrar:hover { background: rgba(255,255,255,0.1); border-radius: 4px; }

.recordatorio-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.3s ease; padding: 20px; }
.recordatorio-card { background: #1e293b; border-radius: 24px; padding: 30px 24px; max-width: 500px; width: 100%; text-align: center; border: 2px solid #3b82f6; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
.recordatorio-card .icono { font-size: 60px; margin-bottom: 12px; }
.recordatorio-card .titulo { color: white; font-size: 24px; margin-bottom: 8px; }
.recordatorio-card .mensaje { color: #cbd5e1; font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
.recordatorio-card .acciones { display: flex; flex-direction: column; gap: 10px; }
.recordatorio-card .accion-btn { padding: 16px 24px; border-radius: 12px; border: 2px solid; background: transparent; color: white; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-family: inherit; }
.recordatorio-card .accion-btn:hover { opacity: 0.8; transform: scale(1.02); }
.recordatorio-card .accion-btn.hecho { border-color: #4ade80; background: #4ade8020; color: #4ade80; }
.recordatorio-card .accion-btn.recordar { border-color: #fbbf24; background: #fbbf2420; color: #fbbf24; }
.recordatorio-card .timer { color: #64748b; font-size: 14px; margin-top: 12px; }

.notificacion-flotante { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 12px 24px; border-radius: 12px; border: 2px solid #4ade80; color: white; font-size: 16px; font-weight: 600; z-index: 10000; animation: slideDown 0.5s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.5); pointer-events: none; }
.notificacion-flotante.error { border-color: #ef4444; background: #7f1d1d; }
.notificacion-flotante.warning { border-color: #fbbf24; background: #78350f; }

.panel-cuidador-btn { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #8b5cf6; background: #8b5cf620; color: #c4b5fd; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 12px; transition: all 0.3s; }
.panel-cuidador-btn:hover { background: #8b5cf640; }

.panel-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s ease; }
.panel-modal-content { background: #0f172a; border-radius: 24px; padding: 24px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; border: 2px solid #8b5cf6; }
.panel-modal-content .close-btn { float: right; background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; font-family: inherit; }
.panel-modal-content h2 { color: white; margin-bottom: 12px; font-size: 20px; }
.panel-estado-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.panel-estado-item { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; border: 2px solid #334155; }
.panel-estado-item .icono { font-size: 24px; }
.panel-estado-item .nombre { font-size: 11px; color: #94a3b8; }
.panel-estado-item .valor { font-size: 14px; font-weight: 700; }
.panel-estado-item.on { border-color: #4ade80; }
.panel-estado-item.off { border-color: #ef4444; }

.config-control { display: flex; align-items: center; gap: 10px; }
.config-control input[type="range"] { flex: 1; accent-color: #3b82f6; }
.config-control select { background: #0f172a; color: white; border: 2px solid #334155; border-radius: 6px; padding: 6px 10px; font-family: inherit; font-size: 13px; }
.config-value { min-width: 45px; text-align: right; color: #818cf8; font-weight: 600; font-size: 13px; }

body.texto-normal { --text-base: 14px; --text-sm: 12px; --text-xs: 10px; --text-lg: 16px; --text-xl: 20px; }
body.texto-grande { --text-base: 17px; --text-sm: 14px; --text-xs: 12px; --text-lg: 20px; --text-xl: 24px; }
body.texto-muy-grande { --text-base: 20px; --text-sm: 16px; --text-xs: 14px; --text-lg: 24px; --text-xl: 28px; }
body.texto-normal .device-card .label, body.texto-grande .device-card .label, body.texto-muy-grande .device-card .label { font-size: var(--text-sm); }
body.texto-normal .device-card .status, body.texto-grande .device-card .status, body.texto-muy-grande .device-card .status { font-size: var(--text-xs); }
body.texto-normal .screen-title, body.texto-grande .screen-title, body.texto-muy-grande .screen-title { font-size: var(--text-lg); }
body.texto-normal .welcome-title, body.texto-grande .welcome-title, body.texto-muy-grande .welcome-title { font-size: var(--text-xl); }
body.texto-normal .welcome-desc, body.texto-grande .welcome-desc, body.texto-muy-grande .welcome-desc { font-size: var(--text-base); }
body.texto-normal .device-row .name, body.texto-grande .device-row .name, body.texto-muy-grande .device-row .name { font-size: var(--text-base); }

<body class="texto-normal">

<div class="phone">
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">🏠</div>
            <div><div class="header-title">CasaConecta</div><div class="header-sub">Accesible</div></div>
        </div>
        <div class="header-badge" id="header-badge">🔊</div>
    </div>
    <div class="nav">
        <button class="nav-btn active" onclick="navTo('home')" id="nav-home">🏠 Inicio</button>
        <button class="nav-btn" onclick="navTo('devices')" id="nav-devices">🔌 Disp.</button>
        <button class="nav-btn" onclick="navTo('routines')" id="nav-routines">⚡ Rutinas</button>
        <button class="nav-btn" onclick="navTo('medicamentos')" id="nav-medicamentos">💊 Meds</button>
        <button class="nav-btn" onclick="navTo('emergency')" id="nav-emergency">🆘 Contactos</button>
        <button class="nav-btn" onclick="navTo('settings')" id="nav-settings">⚙️</button>
    </div>
    <div class="screen" id="screen-content"></div>
    <div id="voice-transcript" class="voice-transcript"></div>
    <div id="voice-hint" class="voice-hint" style="display:none;"></div>
    <button id="voice-fab" class="voice-fab" onclick="toggleVozEscucha()" aria-label="Activar comando de voz" title="Comando de voz">🎤</button>
    <div class="profile-bar">
        <div class="profile-box">
            <div class="profile-label">Perfil de Accesibilidad (múltiple)</div>
            <div class="profile-btns">
                <button class="profile-btn active" data-perfil="motriz" onclick="togglePerfil('motriz')">🦽 Motriz <span class="check-indicator"></span></button>
                <button class="profile-btn" data-perfil="auditiva" onclick="togglePerfil('auditiva')">👂 Auditiva <span class="check-indicator"></span></button>
                <button class="profile-btn" data-perfil="visual" onclick="togglePerfil('visual')">👁️ Visual <span class="check-indicator"></span></button>
                <button class="profile-btn" data-perfil="mental" onclick="togglePerfil('mental')">🧠 Cognitiva <span class="check-indicator"></span></button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 1. ESTADO GLOBAL
// ============================================================
var deviceStates = { 
    luz_sala: true, luz_cocina: false, luz_dormitorio: true, 
    luz_dormitorio2: false, luz_dormitorio3: false, luz_bano: false,
    luz_comedor: false, luz_estudio: false, luz_pasillo: false, luz_patio: false,
    puerta: false, termostato: 22, cortinas: 50, 
    alarma: false, camara: true,
    tv_sala: false, tv_dormitorio: false,
    aire_sala: false, aire_dormitorio: false,
    ventilador_sala: false, ventilador_dormitorio: false,
    puerta_traba: true,
    modo_tv: false,
    modo_fresco: false,
    modo_cine: false
};

var config = {
    volumenVoz: 80,
    vibracionActiva: true,
    alertasLuminosas: true,
    contrasteAlto: false,
    tamanoTexto: 'normal',
    manosLibres: false
};

var dispositivosPersonalizados = [];
var medicamentos = [];
var contactosEmergencia = [];
var zonasDisponibles = ['Sala', 'Cocina', 'Dormitorio 1', 'Dormitorio 2', 'Dormitorio 3', 'Patio', 'Pasillo', 'Baño', 'Comedor', 'Estudio'];
var iconosDisponibles = ['💡', '🔌', '📺', '❄️', '🌀', '📻', '🎵', '🖥️', '☕', '🚪', '🔒', '📹', '🚨'];
var currentScreen = 'home';
var perfilesActivos = new Set(['motriz']);
var modoScanningActivo = false;
var scanningTimer = null;
var scanningIndice = 0;
var scanningElementos = [];
var velocidadScanning = 1500;

// ============================================================
// 2. AUDIO (SPEECH SYNTHESIS)
// ============================================================
function hablar(texto, alTerminar) {
    if (!texto || texto.trim() === '') { if (alTerminar) alTerminar(); return; }
    if (!window.speechSynthesis) { if (alTerminar) alTerminar(); return; }

    window.speechSynthesis.cancel();

    // Si el micrófono está escuchando, lo pausamos mientras la app habla:
    // si no, el propio audio de la respuesta se vuelve a captar como si fuera una orden nueva.
    var debiaEstarEscuchando = (typeof escuchandoVoz !== 'undefined') && escuchandoVoz;
    if (debiaEstarEscuchando && typeof reconocimientoVoz !== 'undefined' && reconocimientoVoz) {
        bloqueadoPorHabla = true;
        try { reconocimientoVoz.stop(); } catch (e) {}
    }

    setTimeout(function() {
        var utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.85;
        utterance.pitch = 1;
        utterance.volume = config.volumenVoz / 100;

        var yaResuelto = false;
        var finalizar = function() {
            if (yaResuelto) return;
            yaResuelto = true;
            if (debiaEstarEscuchando && typeof manosLibres !== 'undefined' && manosLibres) {
                bloqueadoPorHabla = false;
                setTimeout(function() { if (manosLibres && !escuchandoVoz) iniciarEscuchaVoz(); }, 350);
            }
            if (alTerminar) alTerminar();
        };
        utterance.onend = finalizar;
        utterance.onerror = finalizar;
        // red de seguridad por si el navegador nunca dispara onend
        setTimeout(finalizar, Math.min(8000, 600 + texto.length * 90));

        window.speechSynthesis.speak(utterance);
        console.log('🗣️ Dijo:', texto);
    }, 100);
}

// ============================================================
// 3. CARGA Y GUARDADO
// ============================================================
function cargarDatos() {
    try {
        var perfiles = localStorage.getItem('perfilesActivos');
        if (perfiles) {
            var arr = JSON.parse(perfiles);
            if (arr.length > 0) perfilesActivos = new Set(arr);
        }
        var personalizados = localStorage.getItem('dispositivosPersonalizados');
        if (personalizados) dispositivosPersonalizados = JSON.parse(personalizados);
        var meds = localStorage.getItem('medicamentos');
        if (meds) medicamentos = JSON.parse(meds);
        var contactos = localStorage.getItem('contactosEmergencia');
        if (contactos) contactosEmergencia = JSON.parse(contactos);
        var estados = localStorage.getItem('deviceStates');
        if (estados) {
            var parsed = JSON.parse(estados);
            deviceStates = { ...deviceStates, ...parsed };
        }
        var cfg = localStorage.getItem('configCasaConecta');
        if (cfg) {
            var parsedCfg = JSON.parse(cfg);
            config = { ...config, ...parsedCfg };
        }
    } catch(e) { console.error('Error cargando datos:', e); }
}

function guardarDatos() {
    localStorage.setItem('perfilesActivos', JSON.stringify([...perfilesActivos]));
    localStorage.setItem('dispositivosPersonalizados', JSON.stringify(dispositivosPersonalizados));
    localStorage.setItem('medicamentos', JSON.stringify(medicamentos));
    localStorage.setItem('contactosEmergencia', JSON.stringify(contactosEmergencia));
    localStorage.setItem('deviceStates', JSON.stringify(deviceStates));
    localStorage.setItem('configCasaConecta', JSON.stringify(config));
}

// ============================================================
// 4. PERFILES
// ============================================================
function togglePerfil(perfil) {
    if (perfilesActivos.has(perfil)) {
        perfilesActivos.delete(perfil);
        if (perfilesActivos.size === 0) perfilesActivos.add('motriz');
    } else {
        perfilesActivos.add(perfil);
    }
    aplicarPerfiles();
    renderScreen();
    guardarDatos();
}

function aplicarPerfiles() {
    document.body.className = '';
    document.body.classList.add('texto-' + config.tamanoTexto);
    if (config.contrasteAlto) document.body.classList.add('contraste-alto');
    perfilesActivos.forEach(function(p) { document.body.classList.add('perfil-' + p); });
    document.querySelectorAll('.profile-btn').forEach(function(btn) {
        var p = btn.dataset.perfil;
        btn.classList.toggle('active', perfilesActivos.has(p));
    });
}

function tienePerfil(p) { return perfilesActivos.has(p); }

// ============================================================
// 5. NAVEGACIÓN
// ============================================================
function navTo(screen) {
    detenerScanning();
    currentScreen = screen;
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
    var btn = document.getElementById('nav-' + screen);
    if (btn) btn.classList.add('active');
    renderScreen();
    hablar('Pantalla ' + screen);
}

// ============================================================
// 6. DISPOSITIVOS
// ============================================================
function toggleDevice(key) {
    if (key in deviceStates) {
        deviceStates[key] = !deviceStates[key];
        renderScreen();
        guardarDatos();
        var estado = deviceStates[key] ? 'encendido' : 'apagado';
        var nombre = key.replace(/_/g, ' ');
        hablar(estado + ' ' + nombre);
    }
}

function togglePersonalizado(id) {
    var idx = dispositivosPersonalizados.findIndex(function(d) { return d.id === id; });
    if (idx !== -1) {
        var key = 'custom_' + id;
        deviceStates[key] = !deviceStates[key];
        renderScreen();
        guardarDatos();
        var estado = deviceStates[key] ? 'encendido' : 'apagado';
        hablar(estado + ' ' + dispositivosPersonalizados[idx].nombre);
    }
}

function eliminarPersonalizado(id) {
    if (confirm('¿Eliminar este dispositivo?')) {
        var idx = dispositivosPersonalizados.findIndex(function(d) { return d.id === id; });
        if (idx !== -1) {
            var key = 'custom_' + id;
            delete deviceStates[key];
            dispositivosPersonalizados.splice(idx, 1);
            guardarDatos();
            renderScreen();
            hablar('Dispositivo eliminado');
        }
    }
}

function agregarDispositivo() {
    var nombre = document.getElementById('input-nombre')?.value.trim();
    var zona = document.getElementById('input-zona')?.value;
    var icono = document.getElementById('input-icono')?.value;
    if (!nombre || !zona) {
        hablar('Por favor completa todos los campos');
        return;
    }
    var id = Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
    dispositivosPersonalizados.push({ id: id, nombre: nombre, zona: zona, icono: icono || '🔌', fecha: new Date().toISOString() });
    deviceStates['custom_' + id] = false;
    guardarDatos();
    renderScreen();
    hablar('Dispositivo ' + nombre + ' agregado en ' + zona);
    document.getElementById('input-nombre').value = '';
    document.getElementById('input-icono').value = '🔌';
}

function adjustTemp(delta) {
    deviceStates.termostato = Math.max(10, Math.min(35, deviceStates.termostato + delta));
    renderScreen();
    guardarDatos();
    hablar('Temperatura ajustada a ' + deviceStates.termostato + ' grados');
}

function adjustCortinas(delta) {
    deviceStates.cortinas = Math.max(0, Math.min(100, deviceStates.cortinas + delta));
    renderScreen();
    guardarDatos();
    hablar('Cortinas al ' + deviceStates.cortinas + ' por ciento');
}

// ============================================================
// 7. MEDICAMENTOS
// ============================================================
function agregarMedicamento() {
    var nombre = document.getElementById('med-nombre')?.value.trim();
    var dosis = document.getElementById('med-dosis')?.value.trim();
    var hora = document.getElementById('med-hora')?.value;
    var minutos = document.getElementById('med-minutos')?.value;
    var frecuencia = document.getElementById('med-frecuencia')?.value;
    if (!nombre || !dosis || hora === '' || minutos === '') {
        hablar('Por favor completa todos los campos del medicamento');
        return;
    }
    var horario = parseInt(hora).toString().padStart(2, '0') + ':' + parseInt(minutos).toString().padStart(2, '0');
    medicamentos.push({
        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
        nombre: nombre, dosis: dosis, horario: horario, frecuencia: frecuencia || 'diario',
        activo: true, ultimaToma: null, historial: [], creado: new Date().toISOString()
    });
    guardarDatos();
    renderScreen();
    hablar('Medicamento ' + nombre + ' agregado para las ' + horario);
    document.getElementById('med-nombre').value = '';
    document.getElementById('med-dosis').value = '';
}

function eliminarMedicamento(id) {
    if (confirm('¿Eliminar este medicamento?')) {
        medicamentos = medicamentos.filter(function(m) { return m.id !== id; });
        guardarDatos();
        renderScreen();
        hablar('Medicamento eliminado');
    }
}

function tomarMedicamento(id) {
    var med = medicamentos.find(function(m) { return m.id === id; });
    if (!med) return;
    var ahora = new Date();
    med.historial.push({ fecha: ahora.toISOString(), hora: ahora.toLocaleTimeString(), tomado: true });
    med.ultimaToma = ahora.toISOString();
    guardarDatos();
    renderScreen();
    hablar('Has tomado ' + med.nombre);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
}

function verificarMedicamentosPendientes() {
    var ahora = new Date();
    var tiempoActual = ahora.getHours() * 60 + ahora.getMinutes();
    for (var i = 0; i < medicamentos.length; i++) {
        var med = medicamentos[i];
        if (!med.activo) continue;
        var partes = med.horario.split(':');
        var h = parseInt(partes[0]);
        var m = parseInt(partes[1]);
        var tiempoMed = h * 60 + m;
        var diff = tiempoActual - tiempoMed;
        if (diff >= 0 && diff <= 5) {
            var ultima = med.ultimaToma ? new Date(med.ultimaToma) : null;
            if (!ultima || ultima.getDate() !== ahora.getDate()) {
                mostrarRecordatorioMedicamento(med);
            }
        }
    }
}

function mostrarRecordatorioMedicamento(med) {
    if (document.querySelector('.recordatorio-overlay[data-med-id="' + med.id + '"]')) return;
    var overlay = document.createElement('div');
    overlay.className = 'recordatorio-overlay';
    overlay.dataset.medId = med.id;
    overlay.innerHTML = '<div class="recordatorio-card" style="border-color:#8b5cf6;"><div class="icono">💊</div><div class="titulo">⏰ Hora de tomar ' + med.nombre + '</div><div class="mensaje"><strong>Dosis:</strong> ' + med.dosis + '<br><strong>Horario:</strong> ' + med.horario + '</div><div class="acciones"><button class="accion-btn hecho" onclick="tomarMedicamento(\'' + med.id + '\'); this.closest(\'.recordatorio-overlay\').remove();">✅ Ya lo tomé</button><button class="accion-btn recordar" onclick="this.closest(\'.recordatorio-overlay\').remove(); setTimeout(function() { mostrarRecordatorioMedicamento(medicamentos.find(function(m) { return m.id === \'' + med.id + '\'; })); }, 10 * 60 * 1000);">⏰ Recordar después</button></div><div class="timer">⏰ Recordatorio de medicación</div></div>';
    document.body.appendChild(overlay);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
    if (config.alertasLuminosas) overlay.style.animation = 'alertPulse 1s infinite';
    hablar('Hora de tomar ' + med.nombre + '. Dosis: ' + med.dosis);
}
setInterval(verificarMedicamentosPendientes, 60000);

// ============================================================
// 8. CONTACTOS
// ============================================================
function agregarContacto() {
    var nombre = document.getElementById('contacto-nombre')?.value.trim();
    var telefono = document.getElementById('contacto-telefono')?.value.trim();
    var relacion = document.getElementById('contacto-relacion')?.value;
    if (!nombre || !telefono || !relacion) {
        hablar('Por favor completa todos los campos del contacto');
        return;
    }
    contactosEmergencia.push({
        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
        nombre: nombre, telefono: telefono, relacion: relacion, fecha: new Date().toISOString()
    });
    guardarDatos();
    renderScreen();
    hablar('Contacto ' + nombre + ' agregado');
    document.getElementById('contacto-nombre').value = '';
    document.getElementById('contacto-telefono').value = '';
    document.getElementById('contacto-relacion').value = '';
}

function eliminarContacto(id) {
    if (confirm('¿Eliminar este contacto?')) {
        contactosEmergencia = contactosEmergencia.filter(function(c) { return c.id !== id; });
        guardarDatos();
        renderScreen();
        hablar('Contacto eliminado');
    }
}

function llamarContacto(id) {
    var contacto = contactosEmergencia.find(function(c) { return c.id === id; });
    if (!contacto) return;
    var mensaje = 'Llamando a ' + contacto.nombre + '. Teléfono: ' + contacto.telefono;
    hablar(mensaje);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 50]);
    console.log('📞 Llamando a:', contacto.nombre, contacto.telefono);
}

// ============================================================
// 9. BATERÍA
// ============================================================
function verificarBateria() {
    if ('getBattery' in navigator) {
        navigator.getBattery().then(function(battery) {
            var nivel = battery.level * 100;
            var cargando = battery.charging;
            if (nivel <= 15 && !cargando && !alertaBateriaMostrada) {
                mostrarAlertaBateria(nivel);
            } else if (cargando || nivel > 15) {
                ocultarAlertaBateria();
            }
            battery.onlevelchange = function() {
                var nuevoNivel = battery.level * 100;
                if (nuevoNivel <= 15 && !battery.charging && !alertaBateriaMostrada) {
                    mostrarAlertaBateria(nuevoNivel);
                } else if (battery.charging || nuevoNivel > 15) {
                    ocultarAlertaBateria();
                }
            };
            battery.onchargingchange = function() {
                if (battery.charging) {
                    ocultarAlertaBateria();
                } else if (battery.level * 100 <= 15) {
                    mostrarAlertaBateria(battery.level * 100);
                }
            };
        }).catch(function() {});
    }
}

function mostrarAlertaBateria(nivel) {
    alertaBateriaMostrada = true;
    ocultarAlertaBateria();
    var alerta = document.createElement('div');
    alerta.className = 'bateria-alerta';
    alerta.id = 'alerta-bateria';
    alerta.innerHTML = '<span class="icono">🔋</span><span>⚠️ Batería baja: ' + Math.round(nivel) + '% - Conecta el cargador</span><button class="cerrar" onclick="ocultarAlertaBateria()">✕</button>';
    document.body.prepend(alerta);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
    hablar('Alerta de batería baja. Nivel: ' + Math.round(nivel) + ' por ciento. Conecta el cargador.');
}

var alertaBateriaMostrada = false;

function ocultarAlertaBateria() {
    alertaBateriaMostrada = false;
    var alerta = document.getElementById('alerta-bateria');
    if (alerta) alerta.remove();
}

function renderScreen() {
    var container = document.getElementById('screen-content');
    var html = '<div class="fade-in">';
    if (currentScreen === 'home') html += renderHome();
    else if (currentScreen === 'devices') html += renderDevices();
    else if (currentScreen === 'routines') html += renderRoutines();
    else if (currentScreen === 'medicamentos') html += renderMedicamentos();
    else if (currentScreen === 'emergency') html += renderEmergency();
    else if (currentScreen === 'settings') html += renderSettings();
    html += '</div>';
    container.innerHTML = html;
    if (modoScanningActivo) setTimeout(iniciarScanning, 300);
}

function renderMedicamentos() {
    var html = '<div class="screen-title">💊 Gestión de Medicamentos</div>';
    if (medicamentos.length === 0) {
        html += '<div style="background:#1e293b;border-radius:12px;padding:20px;text-align:center;color:#94a3b8;margin-bottom:12px;"><div style="font-size:48px;margin-bottom:8px;">💊</div><p>No tienes medicamentos configurados</p></div>';
    } else {
        html += '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;"><button onclick="filtrarMedicamentos(\'todos\')" style="padding:6px 14px;border-radius:8px;border:2px solid #3b82f6;background:#3b82f620;color:#3b82f6;cursor:pointer;font-family:inherit;font-weight:600;">Todos</button><button onclick="filtrarMedicamentos(\'pendientes\')" style="padding:6px 14px;border-radius:8px;border:2px solid #fbbf24;background:#fbbf2420;color:#fbbf24;cursor:pointer;font-family:inherit;font-weight:600;">Pendientes</button><button onclick="filtrarMedicamentos(\'tomados\')" style="padding:6px 14px;border-radius:8px;border:2px solid #4ade80;background:#4ade8020;color:#4ade80;cursor:pointer;font-family:inherit;font-weight:600;">Tomados hoy</button></div>';
        for (var i = 0; i < medicamentos.length; i++) {
            var med = medicamentos[i];
            var ahora = new Date();
            var ultima = med.ultimaToma ? new Date(med.ultimaToma) : null;
            var tomadoHoy = ultima && ultima.getDate() === ahora.getDate();
            var partes = med.horario.split(':');
            var h = parseInt(partes[0]);
            var m = parseInt(partes[1]);
            var horaMed = h * 60 + m;
            var horaAct = ahora.getHours() * 60 + ahora.getMinutes();
            var pendiente = !tomadoHoy && horaAct >= horaMed;
            var estado = tomadoHoy ? 'tomado' : (pendiente ? 'pendiente' : 'esperando');
            var estadoLabel = tomadoHoy ? '✅ Tomado' : (pendiente ? '⏰ Pendiente' : '⏳ Esperando');
            var estadoClass = tomadoHoy ? 'tomado' : (pendiente ? 'pendiente' : '');
            html += '<div class="medicamento-card" data-med-id="' + med.id + '" data-estado="' + estado + '"><div class="header"><div><div class="nombre">' + med.nombre + '</div><div class="dosis">' + med.dosis + ' • ' + (med.frecuencia || 'diario') + '</div></div><div><span class="estado ' + estadoClass + '">' + estadoLabel + '</span></div></div><div style="margin:4px 0;"><span class="horario">🕐 ' + med.horario + '</span>' + (ultima ? '<span style="color:#64748b;font-size:12px;margin-left:12px;">Última: ' + ultima.toLocaleTimeString() + '</span>' : '') + '</div><div class="acciones">' + (!tomadoHoy ? '<button class="tomar-btn" onclick="tomarMedicamento(\'' + med.id + '\')">💊 Tomar ahora</button>' : '') + '<button class="eliminar-btn" onclick="eliminarMedicamento(\'' + med.id + '\')">🗑️ Eliminar</button></div>' + (med.historial.length > 0 ? '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #334155;font-size:11px;color:#64748b;">📋 Historial: ' + med.historial.slice(-3).reverse().map(function(h) { return h.hora; }).join(' • ') + '</div>' : '') + '</div>';
        }
    }
    html += '<div class="add-med-area"><div class="title">💊 Agregar nuevo medicamento</div><div class="add-med-row"><input type="text" id="med-nombre" placeholder="Nombre" style="flex:2;"><input type="text" id="med-dosis" placeholder="Dosis" style="flex:1;"><select id="med-hora" style="flex:0.8;">';
    for (var hora = 0; hora < 24; hora++) {
        html += '<option value="' + hora + '">' + hora.toString().padStart(2, '0') + '</option>';
    }
    html += '</select><select id="med-minutos" style="flex:0.8;">';
    for (var minuto = 0; minuto < 12; minuto++) {
        var val = minuto * 5;
        html += '<option value="' + val + '">' + val.toString().padStart(2, '0') + '</option>';
    }
    html += '</select><select id="med-frecuencia" style="flex:1;"><option value="diario">Diario</option><option value="cada 8h">Cada 8h</option><option value="cada 12h">Cada 12h</option><option value="semanal">Semanal</option></select><button onclick="agregarMedicamento()">💊 Agregar</button></div></div>';
    return html;
}

function filtrarMedicamentos(filtro) {
    document.querySelectorAll('.medicamento-card').forEach(function(card) {
        var estado = card.dataset.estado;
        card.style.display = filtro === 'todos' ? 'block' : (filtro === 'pendientes' ? (estado === 'pendiente' ? 'block' : 'none') : (estado === 'tomado' ? 'block' : 'none'));
    });
}

// 11. SCANNING
// ============================================================
function toggleScanning() {
    modoScanningActivo = !modoScanningActivo;
    if (modoScanningActivo) iniciarScanning();
    else detenerScanning();
    renderScreen();
}

function iniciarScanning() {
    detenerScanning();
    if (!modoScanningActivo) return;
    scanningElementos = document.querySelectorAll('.device-card, .routine-btn, .emergency-btn, .call-btn, .toggle, .tomar-btn, .eliminar-btn, .llamar-btn, .panel-cuidador-btn');
    if (scanningElementos.length === 0) { setTimeout(iniciarScanning, 500); return; }
    scanningIndice = 0;
    avanzarScanning();
    scanningTimer = setInterval(avanzarScanning, velocidadScanning);
}

function detenerScanning() {
    if (scanningTimer) { clearInterval(scanningTimer); scanningTimer = null; }
    document.querySelectorAll('.scanning-active').forEach(function(el) { el.classList.remove('scanning-active'); });
}

function avanzarScanning() {
    document.querySelectorAll('.scanning-active').forEach(function(el) { el.classList.remove('scanning-active'); });
    if (scanningElementos.length === 0) return;
    var encontrado = false, intentos = 0;
    while (!encontrado && intentos < scanningElementos.length) {
        var el = scanningElementos[scanningIndice];
        if (el && el.offsetParent !== null && !el.disabled) {
            encontrado = true;
            el.classList.add('scanning-active');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate(10);
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        scanningIndice = (scanningIndice + 1) % scanningElementos.length;
        intentos++;
    }
}

document.addEventListener('click', function(e) {
    if (modoScanningActivo) {
        var el = e.target.closest('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(function() { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

document.addEventListener('keydown', function(e) {
    if ((e.key === ' ' || e.key === 'Enter') && modoScanningActivo) {
        e.preventDefault();
        var el = document.querySelector('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(function() { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

function ejecutarRutina(nombre) {
    var mensaje = '';
    switch(nombre) {
        case 'Llegué a casa':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.luz_dormitorio = true;
            deviceStates.luz_dormitorio2 = true; deviceStates.luz_dormitorio3 = true;
            deviceStates.luz_bano = true; deviceStates.luz_comedor = true; deviceStates.luz_estudio = true;
            deviceStates.luz_pasillo = true; deviceStates.luz_patio = true;
            deviceStates.puerta = true; deviceStates.puerta_traba = false;
            deviceStates.termostato = 22; deviceStates.cortinas = 60;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            for (var r = 0; r < dispositivosPersonalizados.length; r++) deviceStates['custom_' + dispositivosPersonalizados[r].id] = true;
            mensaje = 'Bienvenido. Luces encendidas, puerta abierta';
            break;
        case 'Me voy de casa':
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k.startsWith('custom_') || k === 'tv_sala' || k === 'tv_dormitorio' || k === 'aire_sala' || k === 'aire_dormitorio' || k === 'ventilador_sala' || k === 'ventilador_dormitorio') {
                    deviceStates[k] = false;
                }
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Casa asegurada, todo apagado';
            break;
        case 'Buenos Días':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.cortinas = 80; deviceStates.termostato = 22;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Buenos días. Luces y cortinas abiertas';
            break;
        case 'Buenas Noches':
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k === 'tv_sala' || k === 'tv_dormitorio' || k.startsWith('custom_')) {
                    deviceStates[k] = false;
                }
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0; deviceStates.alarma = true;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Buenas noches. Casa segura';
            break;
        case 'Modo TV':
            deviceStates.modo_tv = !deviceStates.modo_tv;
            if (deviceStates.modo_tv) {
                deviceStates.tv_sala = true;
                deviceStates.luz_sala = true;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 30;
                mensaje = 'Modo TV activado';
            } else {
                deviceStates.tv_sala = false;
                deviceStates.luz_sala = false;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 50;
                mensaje = 'Modo TV desactivado';
            }
            break;
        case 'Modo Fresco':
            deviceStates.modo_fresco = !deviceStates.modo_fresco;
            if (deviceStates.modo_fresco) {
                deviceStates.aire_sala = true;
                deviceStates.ventilador_sala = true;
                deviceStates.termostato = 18;
                mensaje = 'Modo fresco activado';
            } else {
                deviceStates.aire_sala = false;
                deviceStates.ventilador_sala = false;
                deviceStates.termostato = 22;
                mensaje = 'Modo fresco desactivado';
            }
            break;
        case 'Modo Cine':
            deviceStates.modo_cine = !deviceStates.modo_cine;
            if (deviceStates.modo_cine) {
                deviceStates.tv_sala = true;
                deviceStates.luz_sala = false;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 0;
                mensaje = 'Modo cine activado';
            } else {
                deviceStates.tv_sala = false;
                deviceStates.luz_sala = true;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 50;
                mensaje = 'Modo cine desactivado';
            }
            break;
        default:
            mensaje = 'Rutina ejecutada: ' + nombre;
    }
    guardarDatos();
    renderScreen();
    if (mensaje) hablar(mensaje);
}

// 16. COMANDOS DE VOZ (escucha continua, manos libres)
// ============================================================
var reconocimientoVoz = null;
var escuchandoVoz = false;
var vozSoportada = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
var contextoSeguro = (window.isSecureContext !== false); // false en la mayoría de navegadores si se abre como archivo local (file://)
var manosLibres = false; // true = el micrófono queda escuchando todo el tiempo, sin volver a tocar el botón
var bloqueadoPorHabla = false; // true mientras la app está hablando, para no captar su propia voz como orden
var ultimoFallbackHablado = 0;

function normalizarTexto(t) {
    return (t || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[¿?¡!.,]/g, '')
        .trim();
}

function initReconocimientoVoz() {
    if (!vozSoportada) return;
    try {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimientoVoz = new SR();
        reconocimientoVoz.lang = 'es-ES';
        reconocimientoVoz.continuous = true;      // se queda escuchando en vez de cerrarse tras una frase
        reconocimientoVoz.interimResults = false;
        reconocimientoVoz.maxAlternatives = 1;
    } catch (e) {
        console.error('🎤 No se pudo crear el reconocedor de voz:', e);
        reconocimientoVoz = null;
        mostrarTranscript('⚠️ No se pudo inicializar el micrófono (' + (e && e.message ? e.message : 'error desconocido') + ')');
        ocultarTranscriptDelay(4000);
        return;
    }

    reconocimientoVoz.onstart = function() {
        escuchandoVoz = true;
        actualizarUIVoz();
        mostrarTranscript(manosLibres ? '🎤 Escucha continua activada. Decime una orden.' : '🎤 Escuchando...');
        ocultarTranscriptDelay(2500);
    };

    reconocimientoVoz.onresult = function(event) {
        // en modo continuo pueden llegar varios resultados; procesamos solo los nuevos
        for (var i = event.resultIndex; i < event.results.length; i++) {
            if (!event.results[i].isFinal) continue;
            var texto = event.results[i][0].transcript;
            mostrarTranscript('🗣️ "' + texto + '"');
            procesarComandoVoz(texto);
        }
    };

    reconocimientoVoz.onerror = function(event) {
        escuchandoVoz = false;
        actualizarUIVoz();
        console.error('🎤 Error de reconocimiento de voz:', event.error);
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            manosLibres = false;
            cambiarConfig('manosLibres', false);
            if (!contextoSeguro) {
                mostrarTranscript('⚠️ El micrófono está bloqueado porque la app se abrió como archivo local. Necesitás abrirla desde una dirección https:// (ver instrucciones en Configuración).');
                ocultarTranscriptDelay(6000);
            } else {
                hablar('No tengo permiso para usar el micrófono');
                mostrarTranscript('⚠️ Permiso de micrófono denegado. Habilitalo en los ajustes del navegador para este sitio.');
                ocultarTranscriptDelay(4500);
            }
        } else if (event.error === 'network') {
            mostrarTranscript('⚠️ Sin conexión al servicio de voz. El reconocimiento necesita internet.');
            ocultarTranscriptDelay(3500);
        } else if (event.error === 'no-speech') {
            // normal en escucha continua: simplemente no se dijo nada, se reintenta solo
            ocultarTranscriptDelay(800);
        } else if (event.error !== 'aborted') {
            mostrarTranscript('⚠️ Error de voz: ' + event.error);
            ocultarTranscriptDelay(3000);
        } else {
            ocultarTranscriptDelay(800);
        }
    };

    reconocimientoVoz.onend = function() {
        escuchandoVoz = false;
        actualizarUIVoz();
        // en escucha continua, el navegador puede cortar el reconocimiento solo (silencio largo, límite de tiempo, etc.)
        // lo reiniciamos automáticamente mientras el modo manos libres siga activo,
        // salvo que lo hayamos parado nosotros para hablar (en ese caso reanuda hablar() al terminar)
        if (manosLibres && !bloqueadoPorHabla) {
            setTimeout(function() { if (manosLibres && !bloqueadoPorHabla) iniciarEscuchaVoz(); }, 400);
        }
    };
}

function actualizarUIVoz() {
    var fab = document.getElementById('voice-fab');
    if (!fab) return;
    fab.classList.toggle('listening', escuchandoVoz);
    fab.textContent = escuchandoVoz ? '🔴' : '🎤';
    fab.setAttribute('aria-label', escuchandoVoz ? 'Escucha continua activa, tocá para detener' : 'Activar comando de voz continuo');

    var hint = document.getElementById('voice-hint');
    if (hint) {
        if (manosLibres) {
            hint.style.display = 'block';
            iniciarRotacionHints();
        } else {
            hint.style.display = 'none';
            detenerRotacionHints();
        }
    }
}

var HINTS_VOZ = [
    'Decí, por ej: "luz sala" · "puerta" · "emergencia"',
    'Decí: "buenos días" · "modo tv" · "casa"',
    'Decí: "llama a" + nombre · "tomé" + medicamento',
    'Decí: "silencio" para apagar el micrófono'
];
var indiceHint = 0;
var rotacionHintTimer = null;
function iniciarRotacionHints() {
    if (rotacionHintTimer) return;
    var hint = document.getElementById('voice-hint');
    if (hint) hint.textContent = HINTS_VOZ[indiceHint];
    rotacionHintTimer = setInterval(function() {
        indiceHint = (indiceHint + 1) % HINTS_VOZ.length;
        var h = document.getElementById('voice-hint');
        if (h) h.textContent = HINTS_VOZ[indiceHint];
    }, 4500);
}
function detenerRotacionHints() {
    if (rotacionHintTimer) { clearInterval(rotacionHintTimer); rotacionHintTimer = null; }
}

function mostrarTranscript(texto) {
    var el = document.getElementById('voice-transcript');
    if (!el) return;
    el.textContent = texto;
    el.style.display = 'block';
}

function ocultarTranscriptDelay(ms) {
    setTimeout(function() {
        var el = document.getElementById('voice-transcript');
        if (el && !escuchandoVoz) el.style.display = 'none';
    }, ms || 1800);
}

// El botón de micrófono ahora es un interruptor: un toque activa la escucha
// continua (queda funcionando sin volver a tocarlo), otro toque la apaga.
function toggleVozEscucha() {
    try {
        if (config.vibracionActiva && navigator.vibrate) navigator.vibrate(30);
        if (!vozSoportada) {
            mostrarTranscript('⚠️ El comando de voz no está disponible en este navegador. Probá con Chrome en Android.');
            ocultarTranscriptDelay(4000);
            return;
        }
        if (!contextoSeguro) {
            mostrarTranscript('⚠️ Esta página se abrió como archivo local (file://). Los navegadores bloquean el micrófono en ese caso. Subí la app a un hosting con https:// (ver Configuración) y volvé a intentar.');
            ocultarTranscriptDelay(6000);
            return;
        }
        if (manosLibres) {
            detenerEscuchaVoz();
        } else {
            activarEscuchaContinua();
        }
    } catch (e) {
        console.error('🎤 Error inesperado en toggleVozEscucha:', e);
        mostrarTranscript('⚠️ Error inesperado: ' + (e && e.message ? e.message : e));
        ocultarTranscriptDelay(4000);
    }
}

function activarEscuchaContinua() {
    manosLibres = true;
    cambiarConfigSilencioso('manosLibres', true);
    renderScreen();
    hablar('Escucha continua activada', function() { iniciarEscuchaVoz(); });
}

function detenerEscuchaVoz() {
    manosLibres = false;
    cambiarConfigSilencioso('manosLibres', false);
    if (reconocimientoVoz && escuchandoVoz) {
        try { reconocimientoVoz.stop(); } catch (e) {}
    }
    hablar('Escucha detenida');
    mostrarTranscript('🎤 Micrófono apagado');
    ocultarTranscriptDelay(1500);
    renderScreen();
}

// Igual que cambiarConfig pero sin anunciar por voz (para no interrumpir con "manos libres activado" feo)
function cambiarConfigSilencioso(clave, valor) {
    config[clave] = valor;
    guardarDatos();
}

function iniciarEscuchaVoz() {
    if (!reconocimientoVoz) initReconocimientoVoz();
    if (!reconocimientoVoz) return;
    try {
        window.speechSynthesis.cancel();
        reconocimientoVoz.start();
    } catch(e) {
        // "already started" ocurre a veces en reinicios rápidos: no es un error real
        if (e && e.name === 'InvalidStateError') return;
        console.error('🎤 No se pudo iniciar el reconocimiento:', e);
        escuchandoVoz = false;
        actualizarUIVoz();
        mostrarTranscript('⚠️ No se pudo activar el micrófono (' + (e && e.message ? e.message : 'error desconocido') + ')');
        ocultarTranscriptDelay(3500);
    }
}

};

function buscarDispositivoPorTexto(texto) {
    for (var i = 0; i < dispositivosPersonalizados.length; i++) {
        var nombreNorm = normalizarTexto(dispositivosPersonalizados[i].nombre);
        if (nombreNorm && texto.indexOf(nombreNorm) !== -1) {
            return 'custom_' + dispositivosPersonalizados[i].id;
        }
    }
    var candidatos = [];
    for (var j = 0; j < VOICE_DEVICES.length; j++) {
        var dev = VOICE_DEVICES[j];
        for (var k = 0; k < dev.frases.length; k++) {
            var frase = normalizarTexto(dev.frases[k]);
            if (texto.indexOf(frase) !== -1) {
                candidatos.push({ key: dev.key, largo: frase.length });
            }
        }
    }
    if (candidatos.length === 0) return null;
    candidatos.sort(function(a, b) { return b.largo - a.largo; });
    return candidatos[0].key;
}

function nombreLegibleDispositivo(key) {
    var idx = dispositivosPersonalizados.findIndex(function(d) { return 'custom_' + d.id === key; });
    if (idx !== -1) return dispositivosPersonalizados[idx].nombre;
    return NOMBRES_LEGIBLES[key] || key.replace(/_/g, ' ');
}

function establecerDispositivo(key, estado) {
    deviceStates[key] = estado;
    renderScreen();
    guardarDatos();
    hablar((estado ? 'Encendido ' : 'Apagado ') + nombreLegibleDispositivo(key));
}

function alternarDispositivoVoz(key) {
    establecerDispositivo(key, !deviceStates[key]);
}

function procesarComandoVoz(textoOriginal) {
    var texto = normalizarTexto(textoOriginal);
    if (!texto) return;

    // --- Detener la escucha continua con la voz misma ---
    if (/^(silencio|dejar de escuchar|para de escuchar|apagate|dejá de escuchar|pausa)$/.test(texto)) {
        if (manosLibres) { detenerEscuchaVoz(); } else { hablar('Listo'); }
        return;
    }

    if (/^(cancelar|nada|olvidalo|listo|ok)$/.test(texto)) {
        return; // no hace ni dice nada, evita ruido en escucha continua
    }

    // --- Emergencia (palabra suelta, la más corta de todas) ---
    if (/\b(emergencia|socorro|auxilio|necesito ayuda|ayuda)\b/.test(texto)) {
        activarEmergencia();
        return;
    }

    // --- Rutinas: alias cortos de una sola palabra + frases completas ---
    if (/\b(casa|llegue|llegué|llegada)\b/.test(texto) || /lleg(u|ue)e? a casa|llegando a casa/.test(texto)) { ejecutarRutina('Llegué a casa'); return; }
    if (/\b(afuera|salgo|salida)\b/.test(texto) || /me voy( de casa)?|salgo de casa/.test(texto)) { ejecutarRutina('Me voy de casa'); return; }
    if (/\b(dia|buendia)\b/.test(texto) || /buenos dias/.test(texto)) { ejecutarRutina('Buenos Días'); return; }
    if (/\b(noche|buenanoche)\b/.test(texto) || /buenas noches/.test(texto)) { ejecutarRutina('Buenas Noches'); return; }
    if (/modo tv|modo television/.test(texto)) { ejecutarRutina('Modo TV'); return; }
    if (/modo fresco/.test(texto)) { ejecutarRutina('Modo Fresco'); return; }
    if (/modo cine/.test(texto)) { ejecutarRutina('Modo Cine'); return; }

    // --- Navegación (alias cortos) ---
    if (/^inicio$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (el )?inicio/.test(texto)) { navTo('home'); return; }
    if (/^dispositivos$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (los |mis )?dispositivos/.test(texto)) { navTo('devices'); return; }
    if (/^rutinas$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (las )?rutinas/.test(texto)) { navTo('routines'); return; }
    if (/^medicamentos$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (los |mis )?medicamentos/.test(texto)) { navTo('medicamentos'); return; }
    if (/^contactos$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (los )?contactos/.test(texto) || /(ir a|ve a) emergencia/.test(texto)) { navTo('emergency'); return; }
    if (/^(configuracion|ajustes)$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (la )?configuracion/.test(texto)) { navTo('settings'); return; }
    if (/panel del cuidador|panel cuidador/.test(texto)) { abrirPanelCuidador(); return; }

    var matchTemp = texto.match(/(sube|subir|aumenta|aumentar|baja|bajar|disminuye|disminuir) (la )?temperatura( (\d+) grados?)?/);
    if (matchTemp) {
        var subir = /sube|subir|aumenta|aumentar/.test(matchTemp[1]);
        var grados = matchTemp[4] ? parseInt(matchTemp[4], 10) : 1;
        adjustTemp(subir ? grados : -grados);
        return;
    }
    if (/mas calor|mas caliente/.test(texto)) { adjustTemp(1); return; }
    if (/mas frio|mas fresco/.test(texto)) { adjustTemp(-1); return; }

    if (/(abre|abrir|sube|subir) (las )?cortinas/.test(texto)) { adjustCortinas(25); return; }
    if (/(cierra|cerrar|baja|bajar) (las )?cortinas/.test(texto)) { adjustCortinas(-25); return; }

    if (/(abre|abrir) la puerta/.test(texto)) { establecerDispositivo('puerta', true); return; }
    if (/(cierra|cerrar) la puerta/.test(texto)) { establecerDispositivo('puerta', false); return; }
    if (/(traba|cierra con llave|asegura) la puerta/.test(texto)) { establecerDispositivo('puerta_traba', true); return; }
    if (/(destraba|abre la traba|quita el seguro)/.test(texto)) { establecerDispositivo('puerta_traba', false); return; }

    var matchLlamar = texto.match(/llama(r)? a (.+)/);
    if (matchLlamar) {
        var nombreBuscado = matchLlamar[2].trim();
        var contacto = contactosEmergencia.find(function(c) { return normalizarTexto(c.nombre).indexOf(nombreBuscado) !== -1 || nombreBuscado.indexOf(normalizarTexto(c.nombre)) !== -1; });
        if (contacto) { llamarContacto(contacto.id); }
        else { hablar('No encontré un contacto llamado ' + nombreBuscado); }
        return;
    }

    var matchMed = texto.match(/(ya )?tom[ée] (el |la )?(.+)/);
    if (matchMed) {
        var nombreMed = matchMed[3].trim();
        var med = medicamentos.find(function(m) { return normalizarTexto(m.nombre).indexOf(nombreMed) !== -1 || nombreMed.indexOf(normalizarTexto(m.nombre)) !== -1; });
        if (med) { tomarMedicamento(med.id); }
        else { hablar('No encontré el medicamento ' + nombreMed); }
        return;
    }

    var esEncender = /^(enciende|prende|activa|conecta)/.test(texto);
    var esApagar = /^(apaga|desactiva|desconecta)/.test(texto);
    if (esEncender || esApagar) {
        var key = buscarDispositivoPorTexto(texto);
        if (key) { establecerDispositivo(key, esEncender); return; }
    }

    var keySolo = buscarDispositivoPorTexto(texto);
    if (keySolo && texto.split(' ').length <= 5) {
        alternarDispositivoVoz(keySolo);
        return;
    }

    // Palabras sueltas muy cortas (ruido de fondo, tos, etc.) no generan ni cartel ni voz
    if (texto.length < 3) return;

    mostrarTranscript('❓ No entendí: "' + textoOriginal + '"');
    ocultarTranscriptDelay(3000);
    // En escucha continua evitamos hablar "no entendí" todo el tiempo (sería muy molesto);
    // avisamos como máximo una vez cada 12 segundos.
    var ahora = Date.now();
    if (!manosLibres || (ahora - ultimoFallbackHablado > 12000)) {
        ultimoFallbackHablado = ahora;
        hablar(manosLibres ? 'No entendí' : 'No entendí el comando. Tocá el signo de pregunta en configuración para ver ejemplos');
    }
}
