.medicamento-card .acciones .eliminar-btn:hover { background: #ef444440; }

.add-med-area { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #8b5cf6; }
.add-med-area .title { color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-med-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-med-row input, .add-med-row select { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 13px; }
.add-med-row input:focus, .add-med-row select:focus { border-color: #8b5cf6; outline: none; }

.contacto-card .acciones .eliminar-btn:hover { background: #ef444440; }

.add-contacto-area { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #ef4444; }
.add-contacto-area .title { color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-contacto-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-contacto-row input, .add-contacto-row select { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 13px; }
.add-contacto-row input:focus, .add-contacto-row select:focus { border-color: #ef4444; outline: none; }
.add-contacto-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #ef4444; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-contacto-row button:hover { background: #dc2626; }

.emergency-btn { width: 100%; padding: 20px; border-radius: 14px; border: 2px solid #ef4444; background: #ef444420; color: #ef4444; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
.emergency-btn .emoji { font-size: 28px; }

.setting-row { background: #1e293b; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.setting-row .emoji { font-size: 20px; width: 28px; text-align: center; }
.setting-row .label { flex: 1; color: #e2e8f0; font-weight: 500; font-size: 13px; }
.setting-row .value { color: #818cf8; font-size: 12px; font-weight: 600; }
.setting-toggle { width: 44px; height: 24px; border-radius: 12px; border: none; cursor: pointer; position: relative; }
.setting-toggle .knob { width: 18px; height: 18px; border-radius: 50%; background: white; position: absolute; top: 3px; transition: all 0.3s; }
.setting-toggle.on .knob { right: 3px; }
.setting-toggle.off .knob { left: 3px; }

.screen-title { color: white; font-size: 16px; font-weight: 700; margin-bottom: 14px; }

.history-box { margin-top: 14px; background: #1e293b; border-radius: 10px; padding: 14px; }
.history-title { color: #94a3b8; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.history-item { display: flex; justify-content: space-between; color: #cbd5e1; font-size: 12px; padding: 5px 0; border-bottom: 1px solid #334155; }
.history-item:last-child { border-bottom: none; }
.history-time { color: #64748b; }

.modo-scanning .device-card, .modo-scanning .routine-btn { cursor: pointer; transition: all 0.3s; }
.scanning-active { animation: scanningPulse 0.8s ease-in-out infinite; border-color: #3b82f6 !important; box-shadow: 0 0 30px rgba(59, 130, 246, 0.6) !important; transform: scale(1.05); z-index: 100; position: relative; }
@keyframes scanningPulse { 0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); } 50% { box-shadow: 0 0 60px rgba(59, 130, 246, 0.8); } }
.scanning-confirmado { animation: confirmPulse 0.5s ease; border-color: #4ade80 !important; box-shadow: 0 0 40px rgba(74, 222, 128, 0.6) !important; }
@keyframes confirmPulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
.control-scanning { padding: 12px 16px; background: #1e293b; border-radius: 12px; margin-bottom: 14px; border: 2px solid #3b82f6; }
.scanning-status { display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 12px; }
.scanning-status.inactivo { background: #7f1d1d; color: #fca5a5; }
.scanning-status.activo { background: #14532d; color: #86efac; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes alertPulse { 0%, 100% { background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; } 50% { background-color: rgba(239, 68, 68, 0.6); border-color: #fca5a5; } }
.fade-in { animation: fadeIn 0.25s ease; }

/* ===== INDICADOR DE VOZ ===== */
.voz-indicador {
    position: fixed;
    bottom: 80px; right: 16px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #64748b;
    border: 3px solid #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: all 0.3s;
    cursor: pointer;
    color: white;
}
.voz-indicador.escuchando { background: #22c55e; border-color: #4ade80; animation: vozEscuchando 1.5s infinite; }
.voz-indicador.procesando { background: #fbbf24; border-color: #fcd34d; animation: vozProcesando 0.5s infinite; }
.voz-indicador.error { background: #ef4444; border-color: #fca5a5; animation: vozError 0.8s infinite; }
.voz-indicador.inactivo { background: #64748b; border-color: #94a3b8; }
@keyframes vozEscuchando { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); } }
@keyframes vozProcesando { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(10deg); } }
@keyframes vozError { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); } 50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(239, 68, 68, 0.6); } }

.voz-ondas { display: flex; align-items: center; justify-content: center; gap: 3px; height: 20px; }
.voz-ondas span { display: inline-block; width: 4px; background: white; border-radius: 2px; animation: onda 0.8s infinite ease-in-out; }
.voz-ondas span:nth-child(1) { animation-delay: 0s; height: 8px; }
.voz-ondas span:nth-child(2) { animation-delay: 0.2s; height: 14px; }
.voz-ondas span:nth-child(3) { animation-delay: 0.4s; height: 18px; }
.voz-ondas span:nth-child(4) { animation-delay: 0.6s; height: 14px; }
.voz-ondas span:nth-child(5) { animation-delay: 0.8s; height: 8px; }
@keyframes onda { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }

.bateria-alerta { position: fixed; top: 0; left: 0; right: 0; background: #7f1d1d; color: #fca5a5; padding: 12px 16px; text-align: center; font-weight: 700; font-size: 16px; z-index: 99999; animation: alertPulse 1s infinite; border-bottom: 3px solid #ef4444; display: flex; align-items: center; justify-content: center; gap: 12px; }

@media (max-width: 400px) {
    .profile-btn { font-size: 10px; padding: 6px 4px 6px 24px; min-width: 50px; }
    .profile-btn .check-indicator { width: 14px; height: 14px; left: 5px; }
    .device-card .emoji { font-size: 24px; }
    .device-card .label { font-size: 11px; }
    .recordatorio-card { padding: 20px 16px; }
    .panel-estado-grid { grid-template-columns: 1fr 1fr; }
    .add-device-row input, .add-device-row select { min-width: 60px; font-size: 11px; padding: 8px; }
    .add-med-row input, .add-med-row select { min-width: 60px; font-size: 11px; padding: 8px; }
    .add-contacto-row input, .add-contacto-row select { min-width: 60px; font-size: 11px; padding: 8px; }
}

.btn-activar-voz {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 16px 36px;
    border-radius: 16px;
    border: 2px solid #3b82f6;
    background: #1e293b;
    color: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    z-index: 999;
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    transition: all 0.3s;
    min-width: 200px;
}
.btn-activar-voz:hover { background: #3b82f6; transform: translateX(-50%) scale(1.02); }
.btn-activar-voz.activo { border-color: #ef4444; background: #ef444420; color: #ef4444; }
.btn-activar-voz.activo:hover { background: #ef4444; color: white; }
.btn-activar-voz:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<div class="phone">
    <!-- HEADER -->
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">🏠</div>
            <div><div class="header-title">CasaConecta</div><div class="header-sub">Voz Total</div></div>
        </div>
        <div class="header-badge" id="header-badge">🎤</div>
    </div>

    <!-- NAVEGACIÓN -->
    <div class="nav">
        <button class="nav-btn active" onclick="navTo('home')" id="nav-home">🏠 Inicio</button>
        <button class="nav-btn" onclick="navTo('devices')" id="nav-devices">🔌 Disp.</button>
        <button class="nav-btn" onclick="navTo('routines')" id="nav-routines">⚡ Rutinas</button>
        <button class="nav-btn" onclick="navTo('medicamentos')" id="nav-medicamentos">💊 Meds</button>
        <button class="nav-btn" onclick="navTo('emergency')" id="nav-emergency">🆘 SOS</button>
        <button class="nav-btn" onclick="navTo('settings')" id="nav-settings">⚙️</button>
    </div>

    <!-- PANTALLA -->
    <div class="screen" id="screen-content"></div>

    <!-- PERFIL BAR -->
    <div class="profile-bar">
        <div class="profile-box">
            <div class="profile-label">Perfil de Accesibilidad (múltiple)</div>
            <div class="profile-btns">
                <button class="profile-btn active" data-perfil="motriz" onclick="togglePerfil('motriz')">
                    🦽 Motriz <span class="check-indicator"></span>
                </button>
                <button class="profile-btn" data-perfil="auditiva" onclick="togglePerfil('auditiva')">
                    👂 Auditiva <span class="check-indicator"></span>
                </button>
                <button class="profile-btn" data-perfil="visual" onclick="togglePerfil('visual')">
                    👁️ Visual <span class="check-indicator"></span>
                </button>
                <button class="profile-btn" data-perfil="mental" onclick="togglePerfil('mental')">
                    🧠 Cognitiva <span class="check-indicator"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- INDICADOR DE VOZ -->
    <div class="voz-indicador inactivo" id="voz-indicador" onclick="iniciarVozManual()" title="Toca para activar el micrófono">
        <div class="voz-ondas">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <!-- BOTÓN DE ACTIVACIÓN DE VOZ -->
    <button class="btn-activar-voz" id="btn-activar-voz" onclick="iniciarVozManual()">
        🎤 Activar Micrófono
    </button>
</div>

<script>
// ============================================================
// 1. ESTADO GLOBAL
// ============================================================
var deviceStates = { 
    luz_sala: true, luz_cocina: false, luz_dormitorio: true, 
    puerta: false, termostato: 22, cortinas: 50, 
    alarma: false, camara: true,
    tv_sala: false, tv_dormitorio: false,
    aire_sala: false, aire_dormitorio: false,
    ventilador_sala: false, ventilador_dormitorio: false,
    puerta_traba: true
};

var dispositivosPersonalizados = [];
var medicamentos = [];
var contactosEmergencia = [];
var zonasDisponibles = ['Sala', 'Cocina', 'Dormitorio 1', 'Dormitorio 2', 'Dormitorio 3', 'Patio', 'Pasillo', 'Baño', 'Comedor', 'Estudio'];
var iconosDisponibles = ['💡', '🔌', '📺', '❄️', '🌀', '📻', '🎵', '🖥️', '☕', '🚪', '🔒', '📹', '🚨'];
var currentScreen = 'home';
var perfilesActivos = new Set(['motriz']);
var modoScanningActivo = false;
var scanningTimer = null;
var scanningIndice = 0;
var scanningElementos = [];
var velocidadScanning = 1500;
var vozActiva = false;
var reconocimientoVoz = null;
var saludoInicialRealizado = false;

// ===== CONTROL DE REPETICIONES =====
var ultimoComandoProcesado = '';
var tiempoUltimoComando = 0;
var notificacionActiva = null;
var procesandoComando = false;

// ============================================================
// 2. CARGA DE DATOS
// ============================================================
function cargarDatos() {
    try {
        const perfiles = localStorage.getItem('perfilesActivos');
        if (perfiles) {
            const arr = JSON.parse(perfiles);
            if (arr.length > 0) perfilesActivos = new Set(arr);
        }
        const personalizados = localStorage.getItem('dispositivosPersonalizados');
        if (personalizados) dispositivosPersonalizados = JSON.parse(personalizados);
        const meds = localStorage.getItem('medicamentos');
        if (meds) medicamentos = JSON.parse(meds);
        const contactos = localStorage.getItem('contactosEmergencia');
        if (contactos) contactosEmergencia = JSON.parse(contactos);
        const estados = localStorage.getItem('deviceStates');
        if (estados) {
            const parsed = JSON.parse(estados);
            deviceStates = { ...deviceStates, ...parsed };
        }
    } catch(e) {}
}

function guardarDatos() {
    localStorage.setItem('perfilesActivos', JSON.stringify([...perfilesActivos]));
    localStorage.setItem('dispositivosPersonalizados', JSON.stringify(dispositivosPersonalizados));
    localStorage.setItem('medicamentos', JSON.stringify(medicamentos));
    localStorage.setItem('contactosEmergencia', JSON.stringify(contactosEmergencia));
    localStorage.setItem('deviceStates', JSON.stringify(deviceStates));
}

// ============================================================
// 3. PERFILES
// ============================================================
function togglePerfil(perfil) {
    if (perfilesActivos.has(perfil)) {
        perfilesActivos.delete(perfil);
        if (perfilesActivos.size === 0) perfilesActivos.add('motriz');
    } else {
        perfilesActivos.add(perfil);
    }
    aplicarPerfiles();
    renderScreen();
    guardarDatos();
}

function aplicarPerfiles() {
    document.body.className = '';
    perfilesActivos.forEach(p => document.body.classList.add('perfil-' + p));
    document.querySelectorAll('.profile-btn').forEach(btn => {
        const p = btn.dataset.perfil;
        btn.classList.toggle('active', perfilesActivos.has(p));
    });
}

function tienePerfil(p) { return perfilesActivos.has(p); }

// ============================================================
// 4. NAVEGACIÓN
// ============================================================
function navTo(screen) {
    currentScreen = screen;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + screen);
    if (btn) btn.classList.add('active');
    renderScreen();
    hablarUnaVez('Pantalla ' + screen);
}

// ============================================================
// 5. FUNCIONES DE DISPOSITIVOS (resumidas)
// ============================================================
function toggleDevice(key) {
    if (key in deviceStates) {
        deviceStates[key] = !deviceStates[key];
        renderScreen();
        guardarDatos();
        const estado = deviceStates[key] ? 'encendido' : 'apagado';
        const nombre = key.replace('_', ' ');
        hablarUnaVez(estado + ' ' + nombre);
    }
}

function togglePersonalizado(id) {
    const idx = dispositivosPersonalizados.findIndex(d => d.id === id);
    if (idx !== -1) {
        const key = 'custom_' + id;
        deviceStates[key] = !deviceStates[key];
        renderScreen();
        guardarDatos();
        const estado = deviceStates[key] ? 'encendido' : 'apagado';
        hablarUnaVez(estado + ' ' + dispositivosPersonalizados[idx].nombre);
    }
}

function eliminarPersonalizado(id) {
    if (confirm('¿Eliminar este dispositivo?')) {
        const idx = dispositivosPersonalizados.findIndex(d => d.id === id);
        if (idx !== -1) {
            const key = 'custom_' + id;
            delete deviceStates[key];
            dispositivosPersonalizados.splice(idx, 1);
            guardarDatos();
            renderScreen();
            hablarUnaVez('Dispositivo eliminado');
        }
    }
}

function agregarDispositivo() {
    const nombre = document.getElementById('input-nombre')?.value.trim();
    const zona = document.getElementById('input-zona')?.value;
    const icono = document.getElementById('input-icono')?.value;
    if (!nombre || !zona) {
        hablarUnaVez('Por favor completa todos los campos');
        return;
    }
    const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
    dispositivosPersonalizados.push({ id, nombre, zona, icono: icono || '🔌', fecha: new Date().toISOString() });
    deviceStates['custom_' + id] = false;
    guardarDatos();
    renderScreen();
    hablarUnaVez('Dispositivo ' + nombre + ' agregado en ' + zona);
    document.getElementById('input-nombre').value = '';
    document.getElementById('input-icono').value = '🔌';
}

function adjustTemp(delta) {
    deviceStates.termostato = Math.max(10, Math.min(35, deviceStates.termostato + delta));
    renderScreen();
    guardarDatos();
    hablarUnaVez('Temperatura ajustada a ' + deviceStates.termostato + ' grados');
}

function adjustCortinas(delta) {
    deviceStates.cortinas = Math.max(0, Math.min(100, deviceStates.cortinas + delta));
    renderScreen();
    guardarDatos();
    hablarUnaVez('Cortinas al ' + deviceStates.cortinas + ' por ciento');
}

// ============================================================
// 6. MEDICAMENTOS (resumidos)
// ============================================================
function agregarMedicamento() {
    const nombre = document.getElementById('med-nombre')?.value.trim();
    const dosis = document.getElementById('med-dosis')?.value.trim();
    const hora = document.getElementById('med-hora')?.value;
    const minutos = document.getElementById('med-minutos')?.value;
    const frecuencia = document.getElementById('med-frecuencia')?.value;
    if (!nombre || !dosis || !hora || !minutos) {
        hablarUnaVez('Por favor completa todos los campos del medicamento');
        return;
    }
    const horario = hora.padStart(2, '0') + ':' + minutos.padStart(2, '0');
    medicamentos.push({
        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
        nombre, dosis, horario, frecuencia: frecuencia || 'diario',
        activo: true, ultimaToma: null, historial: [], creado: new Date().toISOString()
    });
    guardarDatos();
    renderScreen();
    hablarUnaVez('Medicamento ' + nombre + ' agregado para las ' + horario);
    document.getElementById('med-nombre').value = '';
    document.getElementById('med-dosis').value = '';
}

function eliminarMedicamento(id) {
    if (confirm('¿Eliminar este medicamento?')) {
        medicamentos = medicamentos.filter(m => m.id !== id);
        guardarDatos();
        renderScreen();
        hablarUnaVez('Medicamento eliminado');
    }
}

function tomarMedicamento(id) {
    const med = medicamentos.find(m => m.id === id);
    if (!med) return;
    const ahora = new Date();
    med.historial.push({ fecha: ahora.toISOString(), hora: ahora.toLocaleTimeString(), tomado: true });
    med.ultimaToma = ahora.toISOString();
    guardarDatos();
    renderScreen();
    hablarUnaVez('Has tomado ' + med.nombre);
    if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
}

function verificarMedicamentosPendientes() {
    const ahora = new Date();
    const tiempoActual = ahora.getHours() * 60 + ahora.getMinutes();
    for (const med of medicamentos) {
        if (!med.activo) continue;
        const [h, m] = med.horario.split(':').map(Number);
        const tiempoMed = h * 60 + m;
        const diff = tiempoActual - tiempoMed;
        if (diff >= 0 && diff <= 5) {
            const ultima = med.ultimaToma ? new Date(med.ultimaToma) : null;
            if (!ultima || ultima.getDate() !== ahora.getDate()) {
                mostrarRecordatorioMedicamento(med);
            }
        }
    }
}

function mostrarRecordatorioMedicamento(med) {
    if (document.querySelector(`[data-med-id="${med.id}"]`)) return;
    const overlay = document.createElement('div');
    overlay.className = 'recordatorio-overlay';
    overlay.dataset.medId = med.id;
    overlay.innerHTML = `
        <div class="recordatorio-card" style="border-color:#8b5cf6;">
            <div class="icono">💊</div>
            <div class="titulo">⏰ Hora de tomar ${med.nombre}</div>
            <div class="mensaje"><strong>Dosis:</strong> ${med.dosis}<br><strong>Horario:</strong> ${med.horario}</div>
            <div class="acciones">
                <button class="accion-btn hecho" onclick="tomarMedicamento('${med.id}'); this.closest('.recordatorio-overlay').remove();">✅ Ya lo tomé</button>
                <button class="accion-btn recordar" onclick="this.closest('.recordatorio-overlay').remove(); mostrarNotificacion('⏰ Te recordaré en 10 minutos', 'warning'); setTimeout(() => { mostrarRecordatorioMedicamento(medicamentos.find(m => m.id === '${med.id}')); }, 10 * 60 * 1000);">⏰ Recordar después</button>
            </div>
            <div class="timer">⏰ Recordatorio de medicación</div>
        </div>
    `;
    document.body.appendChild(overlay);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
    hablarUnaVez('Hora de tomar ' + med.nombre + '. Dosis: ' + med.dosis);
    notificarCuidador('💊 Recordatorio: ' + med.nombre, 'Hora de tomar ' + med.dosis);
}
setInterval(verificarMedicamentosPendientes, 60000);

// ============================================================
// 7. CONTACTOS DE EMERGENCIA (resumidos)
// ============================================================
function agregarContacto() {
    const nombre = document.getElementById('contacto-nombre')?.value.trim();
    const telefono = document.getElementById('contacto-telefono')?.value.trim();
    const relacion = document.getElementById('contacto-relacion')?.value;
    if (!nombre || !telefono || !relacion) {
        hablarUnaVez('Por favor completa todos los campos del contacto');
        return;
    }
    contactosEmergencia.push({
        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
        nombre, telefono, relacion, fecha: new Date().toISOString()
    });
    guardarDatos();
    renderScreen();
    hablarUnaVez('Contacto ' + nombre + ' agregado');
    document.getElementById('contacto-nombre').value = '';
    document.getElementById('contacto-telefono').value = '';
    document.getElementById('contacto-relacion').value = '';
}

function eliminarContacto(id) {
    if (confirm('¿Eliminar este contacto?')) {
        contactosEmergencia = contactosEmergencia.filter(c => c.id !== id);
        guardarDatos();
        renderScreen();
        hablarUnaVez('Contacto eliminado');
    }
}

function llamarContacto(id) {
    const contacto = contactosEmergencia.find(c => c.id === id);
    if (!contacto) return;
    const mensaje = 'Llamando a ' + contacto.nombre + '. Teléfono: ' + contacto.telefono;
    mostrarNotificacion('📞 ' + mensaje, '');
    if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 50]);
    hablarUnaVez(mensaje);
    console.log('📞 Llamando a:', contacto.nombre, contacto.telefono);
}

// ============================================================
// 8. BATERÍA (resumida)
// ============================================================
function verificarBateria() {
    if ('getBattery' in navigator) {
        navigator.getBattery().then(function(battery) {
            const nivel = battery.level * 100;
            const cargando = battery.charging;
            if (nivel <= 15 && !cargando && !alertaBateriaMostrada) {
                mostrarAlertaBateria(nivel);
            } else if (cargando || nivel > 15) {
                ocultarAlertaBateria();
            }
            battery.onlevelchange = function() {
                const nuevoNivel = battery.level * 100;
                if (nuevoNivel <= 15 && !battery.charging && !alertaBateriaMostrada) {
                    mostrarAlertaBateria(nuevoNivel);
                } else if (battery.charging || nuevoNivel > 15) {
                    ocultarAlertaBateria();
                }
            };
            battery.onchargingchange = function() {
                if (battery.charging) {
                    ocultarAlertaBateria();
                } else if (battery.level * 100 <= 15) {
                    mostrarAlertaBateria(battery.level * 100);
                }
            };
        }).catch(function() {});
    }
}

function mostrarAlertaBateria(nivel) {
    alertaBateriaMostrada = true;
    ocultarAlertaBateria();
    const alerta = document.createElement('div');
    alerta.className = 'bateria-alerta';
    alerta.id = 'alerta-bateria';
    alerta.innerHTML = `
        <span class="icono">🔋</span>
        <span>⚠️ Batería baja: ${Math.round(nivel)}% - Conecta el cargador</span>
        <button class="cerrar" onclick="ocultarAlertaBateria()">✕</button>
    `;
    document.body.prepend(alerta);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
    hablarUnaVez('Alerta de batería baja. Nivel: ' + Math.round(nivel) + ' por ciento. Conecta el cargador.');
    notificarCuidador('🔋 Batería baja', 'Batería al ' + Math.round(nivel) + '%');
}

var alertaBateriaMostrada = false;

function ocultarAlertaBateria() {
    alertaBateriaMostrada = false;
    const alerta = document.getElementById('alerta-bateria');
    if (alerta) alerta.remove();
}

// ============================================================
// 9. RENDERIZADO (resumido)
// ============================================================
function renderScreen() {
    const container = document.getElementById('screen-content');
    let html = '<div class="fade-in">';
    if (currentScreen === 'home') html += renderHome();
    else if (currentScreen === 'devices') html += renderDevices();
    else if (currentScreen === 'routines') html += renderRoutines();
    else if (currentScreen === 'medicamentos') html += renderMedicamentos();
    else if (currentScreen === 'emergency') html += renderEmergency();
    else if (currentScreen === 'settings') html += renderSettings();
    html += '</div>';
    container.innerHTML = html;
    if (modoScanningActivo) setTimeout(iniciarScanning, 300);
}

function getPerfilInfo() {
    const p = [...perfilesActivos][0] || 'motriz';
    const profiles = {
        motriz: { color: '#818cf8', border: '#3949ab', label: '🦽 Motriz', desc: 'Control por voz, botones grandes, switches' },
        auditiva: { color: '#a5d6a7', border: '#7cb342', label: '👂 Auditiva', desc: 'Alertas visuales, vibraciones, luces' },
        visual: { color: '#ffcc80', border: '#fb8c00', label: '👁️ Visual', desc: 'Lector de pantalla, audio descriptivo' },
        mental: { color: '#ce93d8', border: '#8e24aa', label: '🧠 Cognitiva', desc: 'Rutinas 1 toque, iconos, sin menús' }
    };
    return profiles[p] || profiles.motriz;
}

function renderHome() {
    const p = [...perfilesActivos][0] || 'motriz';
    const prof = getPerfilInfo();
    const pendientes = medicamentos.filter(m => m.activo).length;
    const contactos = contactosEmergencia.length;
    let html = `
        <div class="welcome-card ${p}">
            <div class="welcome-title">👋 ¡Hola!</div>
            <div class="welcome-desc">${prof.desc}</div>
            <div class="welcome-hint">${vozActiva ? '🎤 Estoy escuchando. Di lo que necesitas.' : '🔇 Toca el botón "Activar Micrófono" abajo.'}</div>
            ${pendientes > 0 ? `<div class="welcome-hint" style="background:#8b5cf620;color:#c4b5fd;">💊 ${pendientes} medicamento(s) configurado(s)</div>` : ''}
            ${contactos > 0 ? `<div class="welcome-hint" style="background:#ef444420;color:#fca5a5;">🆘 ${contactos} contacto(s) de emergencia</div>` : ''}
        </div>
        <div class="grid-2" style="margin-bottom:12px;">
            <button class="device-card ${deviceStates.luz_sala ? 'on-' + p : 'off'}" onclick="ejecutarRutina('Llegué a casa')" style="border-color:#4ade80;background:#4ade8020;color:#4ade80;">
                <span class="emoji">🏠</span><div class="label">Llegué a casa</div>
                <div class="status">Encender luces + abrir</div>
            </button>
            <button class="device-card off" onclick="ejecutarRutina('Me voy de casa')" style="border-color:#ef4444;background:#ef444420;color:#ef4444;">
                <span class="emoji">🚶</span><div class="label">Me voy de casa</div>
                <div class="status">Apagar todo + cerrar</div>
            </button>
        </div>
        <div class="grid-2">
    `;
    const items = [
        { key: 'luz_sala', icon: '💡', label: 'Luz Sala' },
        { key: 'luz_cocina', icon: '🍳', label: 'Luz Cocina' },
        { key: 'puerta', icon: '🚪', label: 'Puerta' },
        { key: 'puerta_traba', icon: '🔒', label: 'Traba Puerta' },
        { key: 'tv_sala', icon: '📺', label: 'TV Sala' },
        { key: 'aire_sala', icon: '❄️', label: 'Aire Sala' },
        { key: 'ventilador_sala', icon: '🌀', label: 'Ventilador' },
        { key: 'termostato', icon: '🌡️', label: 'Temp: ' + deviceStates.termostato + '°C', special: 'temp' }
    ];
    for (const item of items) {
        if (item.special === 'temp') {
            html += `<div class="device-card off"><span class="emoji">${item.icon}</span><div class="label">${item.label}</div><div class="temp-controls"><button class="temp-btn" onclick="adjustTemp(-1)">−</button><button class="temp-btn" onclick="adjustTemp(1)">+</button></div></div>`;
        } else {
            const isOn = deviceStates[item.key] || false;
            const cls = isOn ? 'on-' + p : 'off';
            const status = isOn ? '● ENCENDIDO' : '○ APAGADO';
            html += `<button class="device-card ${cls}" onclick="toggleDevice('${item.key}')"><span class="emoji">${item.icon}</span><div class="label">${item.label}</div><div class="status">${status}</div></button>`;
        }
    }
    html += '</div>';
    if (dispositivosPersonalizados.length > 0) {
        html += `<div style="margin-top:14px;"><div style="color:#94a3b8;font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:8px;">📌 Mis dispositivos</div><div class="grid-2">`;
        for (const d of dispositivosPersonalizados) {
            const key = 'custom_' + d.id;
            const isOn = deviceStates[key] || false;
            const cls = isOn ? 'on-' + p : 'off';

// ============================================================
// 10. SCANNING (resumido)
// ============================================================
function toggleScanning() {
    modoScanningActivo = !modoScanningActivo;
    if (modoScanningActivo) iniciarScanning();
    else detenerScanning();
    renderScreen();
}

function iniciarScanning() {
    detenerScanning();
    if (!modoScanningActivo) return;
    scanningElementos = document.querySelectorAll('.device-card, .routine-btn, .emergency-btn, .call-btn, .toggle, .tomar-btn, .eliminar-btn, .llamar-btn');
    if (scanningElementos.length === 0) { setTimeout(iniciarScanning, 500); return; }
    scanningIndice = 0;
    avanzarScanning();
    scanningTimer = setInterval(avanzarScanning, velocidadScanning);
}

function detenerScanning() {
    if (scanningTimer) { clearInterval(scanningTimer); scanningTimer = null; }
    document.querySelectorAll('.scanning-active').forEach(el => el.classList.remove('scanning-active'));
}

function avanzarScanning() {
    document.querySelectorAll('.scanning-active').forEach(el => el.classList.remove('scanning-active'));
    if (scanningElementos.length === 0) return;
    let encontrado = false, intentos = 0;
    while (!encontrado && intentos < scanningElementos.length) {
        const el = scanningElementos[scanningIndice];
        if (el && el.offsetParent !== null && !el.disabled) {
            encontrado = true;
            el.classList.add('scanning-active');
            if (navigator.vibrate) navigator.vibrate(10);
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        scanningIndice = (scanningIndice + 1) % scanningElementos.length;
        intentos++;
    }
}

document.addEventListener('click', function(e) {
    if (modoScanningActivo) {
        const el = e.target.closest('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(() => { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

document.addEventListener('keydown', function(e) {
    if ((e.key === ' ' || e.key === 'Enter') && modoScanningActivo) {
        e.preventDefault();
        const el = document.querySelector('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(() => { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

// ============================================================
// 11. VOZ - CORREGIDO (SIN REPETICIONES)
// ============================================================
function iniciarVozManual() {
    if (vozActiva) {
        detenerVoz();
        return;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        mostrarNotificacion('❌ Tu navegador no soporta reconocimiento de voz', 'error');
        return;
    }
    
    const btn = document.getElementById('btn-activar-voz');
    btn.disabled = true;
    btn.textContent = '⏳ Solicitando permiso...';
    document.getElementById('voz-indicador').classList.remove('inactivo');
    document.getElementById('voz-indicador').classList.add('procesando');
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
            stream.getTracks().forEach(track => track.stop());
            iniciarReconocimiento();
            btn.disabled = false;
        })
        .catch(function(err) {
            console.error('Error de micrófono:', err);
            btn.disabled = false;
            btn.textContent = '❌ Permiso denegado - Toca para reintentar';
            document.getElementById('voz-indicador').classList.remove('procesando');
            document.getElementById('voz-indicador').classList.add('error');
            
            let mensaje = '❌ Permiso de micrófono denegado. ';
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                mensaje += 'Activa el micrófono en la configuración del navegador.';
            } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                mensaje += 'No se detecta ningún micrófono conectado.';
            } else {
                mensaje += 'Error: ' + (err.message || err.name);
            }
            mostrarNotificacion(mensaje, 'error');
        });
}

function iniciarReconocimiento() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;
    
    try {
        reconocimientoVoz = new SpeechRecognition();
        reconocimientoVoz.lang = 'es-ES';
        reconocimientoVoz.continuous = true;
        reconocimientoVoz.interimResults = true;
        reconocimientoVoz.maxAlternatives = 5;
        
        reconocimientoVoz.onstart = function() {
            vozActiva = true;
            document.getElementById('voz-indicador').classList.remove('error', 'procesando');
            document.getElementById('voz-indicador').classList.add('escuchando');
            const btn = document.getElementById('btn-activar-voz');
            btn.textContent = '🔇 Desactivar Micrófono';
            btn.classList.add('activo');
            btn.disabled = false;
            
            if (!saludoInicialRealizado) {
                saludoInicialRealizado = true;
                setTimeout(function() {
                    hablarUnaVez('Bienvenido a CasaConecta. Estoy escuchando, ¿qué necesitas?');
                }, 500);
            }
            mostrarNotificacion('🎤 Micrófono activado', '');
        };
        
        reconocimientoVoz.onresult = function(event) {
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    const texto = event.results[i][0].transcript.toLowerCase().trim();
                    if (texto.length > 0 && !procesandoComando) {
                        procesarComandoVoz(texto);
                    }
                }
            }
        };
        
        reconocimientoVoz.onerror = function(event) {
            console.warn('Error de voz:', event.error);
            if (event.error === 'not-allowed') {
                document.getElementById('voz-indicador').classList.remove('escuchando');
                document.getElementById('voz-indicador').classList.add('error');
                const btn = document.getElementById('btn-activar-voz');
                btn.textContent = '❌ Permiso denegado';
                btn.disabled = false;
                mostrarNotificacion('❌ Permiso de micrófono denegado', 'error');
                vozActiva = false;
            } else if (event.error === 'no-speech') {
                // Silencio - no hacer nada
            } else {
                if (vozActiva) {
                    try { reconocimientoVoz.stop(); } catch(e) {}
                    setTimeout(function() {
                        try { reconocimientoVoz.start(); } catch(e) {}
                    }, 1000);
                }
            }
        };
        
        reconocimientoVoz.onend = function() {
            if (vozActiva) {
                setTimeout(function() {
                    try { reconocimientoVoz.start(); } catch(e) {
                        setTimeout(function() {
                            try { reconocimientoVoz.start(); } catch(e2) {}
                        }, 1000);
                    }
                }, 500);
            } else {
                document.getElementById('voz-indicador').classList.remove('escuchando');
                document.getElementById('voz-indicador').classList.add('inactivo');
                const btn = document.getElementById('btn-activar-voz');
                btn.textContent = '🎤 Activar Micrófono';
                btn.classList.remove('activo');
                btn.disabled = false;
            }
        };
        
        reconocimientoVoz.start();
        
    } catch(e) {
        console.error('Error al iniciar voz:', e);
        document.getElementById('voz-indicador').classList.remove('procesando');
        document.getElementById('voz-indicador').classList.add('error');
        const btn = document.getElementById('btn-activar-voz');
        btn.textContent = '❌ Error - Toca para reintentar';
        btn.disabled = false;
        mostrarNotificacion('❌ Error al iniciar el micrófono', 'error');
    }
}

function detenerVoz() {
    vozActiva = false;
    procesandoComando = false;
    if (reconocimientoVoz) {
        try { reconocimientoVoz.stop(); } catch(e) {}
    }
    document.getElementById('voz-indicador').classList.remove('escuchando', 'procesando', 'error');
    document.getElementById('voz-indicador').classList.add('inactivo');
    const btn = document.getElementById('btn-activar-voz');
    btn.textContent = '🎤 Activar Micrófono';
    btn.classList.remove('activo');
    btn.disabled = false;
    mostrarNotificacion('🔇 Micrófono desactivado', 'warning');
}

// ===== FUNCIÓN PARA HABLAR UNA SOLA VEZ =====
function hablarUnaVez(texto) {
    if (!texto || texto.trim() === '') return;
    
    // Cancelar cualquier voz anterior
    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
    
    // Esperar un momento y luego hablar
    setTimeout(function() {
        if (window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            window.speechSynthesis.speak(utterance);
            console.log('🗣️', texto);
        }
    }, 100);
}

// ===== MOSTRAR NOTIFICACIÓN UNA SOLA VEZ =====
function mostrarNotificacion(mensaje, tipo = '') {
    // Eliminar notificación anterior si existe
    if (notificacionActiva) {
        notificacionActiva.remove();
        notificacionActiva = null;
    }
    
    const div = document.createElement('div');
    div.className = 'notificacion-flotante';
    if (tipo === 'error') div.classList.add('error');
    if (tipo === 'warning') div.classList.add('warning');
    div.textContent = mensaje;
    document.body.appendChild(div);
    notificacionActiva = div;
    
    setTimeout(() => {
        if (div.parentElement) {
            div.style.animation = 'fadeOut 0.3s ease';
            setTimeout(() => {
                if (div.parentElement) {
                    div.remove();
                    if (notificacionActiva === div) notificacionActiva = null;
                }
            }, 300);
        }
    }, 4000);
}

// ============================================================
// 11b. PROCESAMIENTO DE COMANDOS - CORREGIDO (SIN REPETICIONES)
// ============================================================
function procesarComandoVoz(texto) {
    // Evitar procesar el mismo comando repetido
    const ahora = Date.now();
    if (texto === ultimoComandoProcesado && (ahora - tiempoUltimoComando) < 3000) {
        console.log('⏭️ Comando duplicado ignorado:', texto);
        return;
    }
    
    // Evitar procesar si ya estamos procesando
    if (procesandoComando) {
        console.log('⏳ Ya procesando un comando, ignorando:', texto);
        return;
    }
    
    procesandoComando = true;
    ultimoComandoProcesado = texto;
    tiempoUltimoComando = ahora;
    
    console.log('🎤 Comando recibido:', texto);
    document.getElementById('voz-indicador').classList.remove('escuchando');
    document.getElementById('voz-indicador').classList.add('procesando');
    
    // Normalizar
    let cmd = texto.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/^(oye|hey|hola|disculpa|por favor|puedes|quiero|necesito|vamos a|vamos|dime|sabes|verdad|eh|ah|mm|bueno|entonces|mira|escucha|atención)/i, '')
        .replace(/(por favor|gracias|ok|vale|dime|sabes|verdad|no|si|ahora|ya|entonces)$/i, '')
        .trim();
    
    if (cmd.length < 2) {
        procesandoComando = false;
        document.getElementById('voz-indicador').classList.remove('procesando');
        if (vozActiva) document.getElementById('voz-indicador').classList.add('escuchando');
        return;
    }
    
    console.log('📝 Comando normalizado:', cmd);
    
    // ============================================================
    // RUTINAS
    // ============================================================
    if (cmd.includes('llegue a casa') || cmd.includes('llegar a casa') || 
        cmd.includes('llegue') && cmd.includes('casa') || cmd.includes('estoy en casa') || cmd.includes('ya llegue')) {
        ejecutarRutina('Llegué a casa');
        terminarProcesamiento();
        return;
    }
    
    if (cmd.includes('me voy de casa') || cmd.includes('me voy') && cmd.includes('casa') || 
        cmd.includes('salir de casa') || cmd.includes('salgo') && cmd.includes('casa')) {
        ejecutarRutina('Me voy de casa');
        terminarProcesamiento();
        return;
    }
    
    if (cmd.includes('buenos dias') || cmd.includes('buen dia') || cmd.includes('buendia') ||
        cmd.includes('buen día') || cmd.includes('buenosdias')) {
        ejecutarRutina('Buenos Días');
        terminarProcesamiento();
        return;
    }
    
    if (cmd.includes('buenas noches') || cmd.includes('buena noche') || cmd.includes('buenoche') ||
        cmd.includes('buenasnoches')) {
        ejecutarRutina('Buenas Noches');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // NAVEGACIÓN
    // ============================================================
    if (cmd.includes('inicio') || cmd === 'inicio' || cmd.includes('principal') || cmd.includes('volver')) {
        navTo('home');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('dispositivo') || cmd.includes('dispositivos')) {
        navTo('devices');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('rutina') || cmd.includes('rutinas')) {
        navTo('routines');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('medicamento') || cmd.includes('medicamentos') || cmd.includes('meds')) {
        navTo('medicamentos');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('emergencia') || cmd.includes('sos') || cmd.includes('ayuda') || cmd.includes('socorro')) {
        navTo('emergency');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('configuracion') || cmd.includes('configuración') || cmd.includes('ajustes')) {
        navTo('settings');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // OTRAS RUTINAS
    // ============================================================
    if (cmd.includes('modo tv') || cmd.includes('ver tv') || cmd.includes('encender tv') || cmd.includes('television')) {
        ejecutarRutina('Modo TV');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('modo fresco') || cmd.includes('fresco') || cmd.includes('enfriar') || cmd.includes('aire')) {
        ejecutarRutina('Modo Fresco');
        terminarProcesamiento();
        return;
    }
    if (cmd.includes('modo cine') || cmd.includes('cine') || cmd.includes('pelicula') || cmd.includes('película')) {
        ejecutarRutina('Modo Cine');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // EMERGENCIA
    // ============================================================
    if (cmd.includes('emergencia') || cmd.includes('ayuda') || cmd.includes('socorro') || cmd.includes('auxilio')) {
        activarEmergencia();
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // MEDICAMENTOS
    // ============================================================
    if (cmd.includes('tomar') && (cmd.includes('medicamento') || cmd.includes('pastilla') || cmd.includes('meds'))) {
        const nombre = cmd.replace(/tomar|medicamento|meds|pastilla|la|el|las|los/g, '').trim();
        if (nombre) {
            const med = medicamentos.find(m => m.nombre.toLowerCase().includes(nombre) || nombre.includes(m.nombre.toLowerCase()));
            if (med) {
                tomarMedicamento(med.id);
                terminarProcesamiento();
                return;
            }
        }
        hablarUnaVez('¿Qué medicamento quieres tomar?');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // CONTACTOS
    // ============================================================
    if (cmd.includes('llamar a') || cmd.includes('llamar')) {
        const nombre = cmd.replace(/llamar a|llamar|por favor|ahora/g, '').trim();
        if (nombre) {
            const contacto = contactosEmergencia.find(c => c.nombre.toLowerCase().includes(nombre) || nombre.includes(c.nombre.toLowerCase()));
            if (contacto) {
                llamarContacto(contacto.id);
                terminarProcesamiento();
                return;
            }
        }
        hablarUnaVez('¿A quién quieres llamar?');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // DISPOSITIVOS
    // ============================================================
    let accion = null;
    let objeto = null;
    let valor = null;
    
    if (cmd.includes('encender') || cmd.includes('prender') || cmd.includes('enciende') || cmd.includes('prende')) {
        accion = 'encender';
    } else if (cmd.includes('apagar') || cmd.includes('pagal') || cmd.includes('apaga')) {
        accion = 'apagar';
    } else if (cmd.includes('subir')) {
        accion = 'subir';
    } else if (cmd.includes('bajar')) {
        accion = 'bajar';
    } else if (cmd.includes('abrir')) {
        accion = 'abrir';
    } else if (cmd.includes('cerrar')) {
        accion = 'cerrar';
    }
    
    if (accion) {
        const objetos = ['sala', 'cocina', 'dormitorio', 'tv', 'tele', 'television', 'televisor', 'aire', 'ventilador', 'puerta', 'cortinas', 'temperatura', 'temp', 'termostato', 'alarma', 'camara'];
        for (const obj of objetos) {
            if (cmd.includes(obj)) { objeto = obj; break; }
        }
        if (!objeto) {
            if (cmd.includes('luz') && cmd.includes('sala')) objeto = 'sala';
            else if (cmd.includes('luz') && cmd.includes('cocina')) objeto = 'cocina';
            else if (cmd.includes('luz') && cmd.includes('dormitorio')) objeto = 'dormitorio';
        }
        const numeros = cmd.match(/\d+/);
        if (numeros) valor = parseInt(numeros[0]);
        
        if (objeto) {
            ejecutarComandoVoz(accion, objeto, valor);
            terminarProcesamiento();
            return;
        } else {
            if (accion === 'encender' && cmd.includes('todo')) {
                deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.luz_dormitorio = true;
                renderScreen(); guardarDatos(); hablarUnaVez('Encendido todo');
                terminarProcesamiento();
                return;
            }
            if (accion === 'apagar' && cmd.includes('todo')) {
                deviceStates.luz_sala = false; deviceStates.luz_cocina = false; deviceStates.luz_dormitorio = false;
                renderScreen(); guardarDatos(); hablarUnaVez('Apagado todo');
                terminarProcesamiento();
                return;
            }
        }
    }
    
    // ============================================================
    // AGREGAR DISPOSITIVO POR VOZ
    // ============================================================
    if (cmd.includes('agregar dispositivo') || cmd.includes('añadir dispositivo')) {
        const match = cmd.match(/agregar dispositivo\s+([a-zA-Záéíóúñ\s]+?)(?:\s+en\s+([a-zA-Záéíóúñ\s]+))?/i);
        if (match) {
            const nombre = match[1].trim();
            let zona = match[2]?.trim() || 'Sala';
            const zonaEncontrada = zonasDisponibles.find(z => z.toLowerCase().includes(zona.toLowerCase()) || zona.toLowerCase().includes(z.toLowerCase()));
            if (zonaEncontrada) zona = zonaEncontrada;
            const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
            dispositivosPersonalizados.push({ id, nombre, zona, icono: '🔌', fecha: new Date().toISOString() });
            deviceStates['custom_' + id] = false;
            guardarDatos();
            renderScreen();
            hablarUnaVez('Dispositivo ' + nombre + ' agregado en ' + zona);
            terminarProcesamiento();
            return;
        }
        hablarUnaVez('Di "agregar dispositivo [nombre] en [zona]"');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // AGREGAR MEDICAMENTO POR VOZ
    // ============================================================
    if (cmd.includes('agregar medicamento') || cmd.includes('añadir medicamento')) {
        const match = cmd.match(/agregar medicamento\s+([a-zA-Záéíóúñ\s]+?)\s+([\d]+mg|[\d]+ml|[\d]+g|[\d]+mcg|[\d]+)\s+(?:a las|a la|a)\s+([\d]{1,2})/i);
        if (match) {
            const nombre = match[1].trim();
            const dosis = match[2].trim();
            let hora = parseInt(match[3]);
            if (hora < 0 || hora > 23) hora = 8;
            const minutos = '00';
            const horario = hora.toString().padStart(2, '0') + ':' + minutos;
            medicamentos.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                nombre, dosis, horario, frecuencia: 'diario',
                activo: true, ultimaToma: null, historial: [], creado: new Date().toISOString()
            });
            guardarDatos();
            renderScreen();
            hablarUnaVez('Medicamento ' + nombre + ' agregado para las ' + horario);
            terminarProcesamiento();
            return;
        }
        hablarUnaVez('No entendí el medicamento. Di "agregar medicamento [nombre] [dosis] a las [hora]"');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // AGREGAR CONTACTO POR VOZ
    // ============================================================
    if (cmd.includes('agregar contacto') || cmd.includes('añadir contacto')) {
        const match = cmd.match(/agregar contacto\s+([a-zA-Záéíóúñ\s]+?)\s+([\d\s\-]+)/i);
        if (match) {
            const nombre = match[1].trim();
            const telefono = match[2].trim().replace(/\s/g, '');
            contactosEmergencia.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                nombre, telefono, relacion: 'Contacto', fecha: new Date().toISOString()
            });
            guardarDatos();
            renderScreen();
            hablarUnaVez('Contacto ' + nombre + ' agregado');
            terminarProcesamiento();
            return;
        }
        hablarUnaVez('No entendí el contacto. Di "agregar contacto [nombre] [teléfono]"');
        terminarProcesamiento();
        return;
    }
    
    // ============================================================
    // NO ENTENDIDO
    // ============================================================
    if (cmd.length > 2) {
        hablarUnaVez('No entendí: ' + texto);
    }
    
    terminarProcesamiento();
}

function terminarProcesamiento() {
    setTimeout(function() {
        procesandoComando = false;
        document.getElementById('voz-indicador').classList.remove('procesando');
        if (vozActiva) {
            document.getElementById('voz-indicador').classList.add('escuchando');
        }
    }, 500);
}

function ejecutarComandoVoz(accion, objeto, valor) {
    const mapObjeto = {
        'sala': 'luz_sala', 'cocina': 'luz_cocina', 'dormitorio': 'luz_dormitorio',
        'tv': 'tv_sala', 'tele': 'tv_sala', 'television': 'tv_sala', 'televisor': 'tv_sala',
        'aire': 'aire_sala', 'ventilador': 'ventilador_sala',
        'puerta': 'puerta', 'cortinas': 'cortinas',
        'alarma': 'alarma', 'camara': 'camara',
        'temperatura': 'termostato', 'temp': 'termostato', 'termostato': 'termostato'
    };
    
    const key = mapObjeto[objeto];
    if (key === 'termostato') {
        if (valor && valor >= 10 && valor <= 35) {
            deviceStates.termostato = valor;
            renderScreen();
            guardarDatos();
            hablarUnaVez('Temperatura ajustada a ' + valor + ' grados');
        } else {
            hablarUnaVez('Dime un número entre 10 y 35');
        }
        return;
    }
    
    if (key === 'cortinas') {
        if (accion === 'subir') { adjustCortinas(25); hablarUnaVez('Subiendo cortinas'); }
        else if (accion === 'bajar') { adjustCortinas(-25); hablarUnaVez('Bajando cortinas'); }
        else if (accion === 'abrir') { deviceStates.cortinas = 100; renderScreen(); guardarDatos(); hablarUnaVez('Cortinas abiertas'); }
        else if (accion === 'cerrar') { deviceStates.cortinas = 0; renderScreen(); guardarDatos(); hablarUnaVez('Cortinas cerradas'); }
        return;
    }
    
    if (key === 'puerta') {
        if (accion === 'abrir' || accion === 'encender') {
            deviceStates.puerta = true;
            deviceStates.puerta_traba = false;
            renderScreen(); guardarDatos(); hablarUnaVez('Puerta abierta');
        } else if (accion === 'cerrar' || accion === 'apagar') {
            deviceStates.puerta = false;
            deviceStates.puerta_traba = true;
            renderScreen(); guardarDatos(); hablarUnaVez('Puerta cerrada y trabada');
        }
        return;
    }
    
    if (key && key in deviceStates) {
        if (accion === 'encender' || accion === 'abrir' || accion === 'subir') {
            deviceStates[key] = true;
            renderScreen(); guardarDatos();
            const nombre = key.replace('_', ' ');
            hablarUnaVez('Encendido ' + nombre);
        } else if (accion === 'apagar' || accion === 'cerrar' || accion === 'bajar') {
            deviceStates[key] = false;
            renderScreen(); guardarDatos();
            const nombre = key.replace('_', ' ');
            hablarUnaVez('Apagado ' + nombre);
        }
        return;
    }
    
    for (const d of dispositivosPersonalizados) {
        if (objeto.includes(d.nombre.toLowerCase()) || d.nombre.toLowerCase().includes(objeto)) {
            const key = 'custom_' + d.id;
            if (accion === 'encender' || accion === 'abrir') {
                deviceStates[key] = true;
                renderScreen(); guardarDatos();
                hablarUnaVez('Encendido ' + d.nombre);
            } else if (accion === 'apagar' || accion === 'cerrar') {
                deviceStates[key] = false;
                renderScreen(); guardarDatos();
                hablarUnaVez('Apagado ' + d.nombre);
            }
            return;
        }
    }
    
    hablarUnaVez('No encontré ' + objeto);
}

// ============================================================
// 12. RUTINAS
// ============================================================
function ejecutarRutina(nombre) {
    let mensaje = '';
    switch(nombre) {
        case 'Llegué a casa':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.luz_dormitorio = true;
            deviceStates.puerta = true; deviceStates.puerta_traba = false;
            deviceStates.termostato = 22; deviceStates.cortinas = 60;
            for (const d of dispositivosPersonalizados) deviceStates['custom_' + d.id] = true;
            mensaje = 'Bienvenido. Luces encendidas, puerta abierta';
            break;
        case 'Me voy de casa':
            Object.keys(deviceStates).forEach(k => {
                if (k.startsWith('luz_') || k.startsWith('custom_') || k === 'tv_sala' || k === 'tv_dormitorio' || k === 'aire_sala' || k === 'aire_dormitorio' || k === 'ventilador_sala' || k === 'ventilador_dormitorio') {
                    deviceStates[k] = false;
                }
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0;
            mensaje = 'Casa asegurada, todo apagado';
            break;
        case 'Buenos Días':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.cortinas = 80; deviceStates.termostato = 22;
            mensaje = 'Buenos días. Luces y cortinas abiertas';
            break;
        case 'Buenas Noches':
            Object.keys(deviceStates).forEach(k => {
                if (k.startsWith('luz_') || k === 'tv_sala' || k === 'tv_dormitorio' || k.startsWith('custom_')) {
                    deviceStates[k] = false;
                }
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0; deviceStates.alarma = true;
            mensaje = 'Buenas noches. Casa segura';
            break;
        case 'Modo TV':
            deviceStates.tv_sala = true; deviceStates.luz_sala = true; deviceStates.luz_cocina = false; deviceStates.cortinas = 30;
            mensaje = 'Modo TV activado';
            break;
        case 'Modo Fresco':
            deviceStates.aire_sala = true; deviceStates.ventilador_sala = true; deviceStates.termostato = 18;
            mensaje = 'Modo fresco activado';
            break;
        case 'Modo Cine':
            deviceStates.tv_sala = true; deviceStates.luz_sala = false; deviceStates.luz_cocina = false; deviceStates.cortinas = 0;
            mensaje = 'Modo cine activado';
            break;
        default:
            mensaje = 'Rutina ejecutada: ' + nombre;
    }
    guardarDatos();
    renderScreen();
    hablarUnaVez(mensaje);
}

function abrirPanelCuidador() {
    const modal = document.createElement('div');
    modal.className = 'panel-modal';
    modal.id = 'panel-cuidador-modal';
    modal.innerHTML = `
        <div class="panel-modal-content">
            <button class="close-btn" onclick="document.getElementById('panel-cuidador-modal').remove()">✕</button>
            <h2>👨‍👩‍👧‍👦 Panel del Cuidador</h2>
            <div style="color:#94a3b8;font-size:14px;margin-bottom:12px;">Estado en tiempo real</div>
            <div class="panel-estado-grid" id="panel-estado-grid">${generarPanelEstado()}</div>
            <div style="margin-top:12px;"><button onclick="activarEmergencia()" style="width:100%;padding:12px;border-radius:10px;border:2px solid #ef4444;background:#ef444420;color:#ef4444;font-weight:700;cursor:pointer;font-family:inherit;">🚨 ACTIVAR EMERGENCIA REMOTA</button></div>
            <div style="margin-top:12px;max-height:150px;overflow-y:auto;"><div style="color:#94a3b8;font-size:12px;margin-bottom:8px;">📋 Historial</div><div id="panel-historial">${generarHistorialPanel()}</div></div>
        </div>
    `;
    document.body.appendChild(modal);
}

function generarPanelEstado() {
    const dispositivos = [
        { key: 'luz_sala', icono: '💡', nombre: 'Luz Sala' },
        { key: 'luz_cocina', icono: '💡', nombre: 'Luz Cocina' },
        { key: 'puerta', icono: '🚪', nombre: 'Puerta' },
        { key: 'puerta_traba', icono: '🔒', nombre: 'Traba' },
        { key: 'tv_sala', icono: '📺', nombre: 'TV Sala' },
        { key: 'aire_sala', icono: '❄️', nombre: 'Aire' },
        { key: 'ventilador_sala', icono: '🌀', nombre: 'Ventilador' },
        { key: 'alarma', icono: '🚨', nombre: 'Alarma' }
    ];
    for (const d of dispositivosPersonalizados) dispositivos.push({ key: 'custom_' + d.id, icono: d.icono || '🔌', nombre: d.nombre });
    let html = '';
    for (const d of dispositivos) {
        const estado = deviceStates[d.key] || false;
        html += `<div class="panel-estado-item ${estado ? 'on' : 'off'}"><div class="icono">${d.icono}</div><div class="nombre">${d.nombre}</div><div class="valor">${estado ? '✅' : '❌'}</div></div>`;
    }
    html += `<div class="panel-estado-item ${deviceStates.termostato > 20 ? 'on' : 'off'}"><div class="icono">🌡️</div><div class="nombre">Temp</div><div class="valor">${deviceStates.termostato}°</div></div>`;
    html += `<div class="panel-estado-item ${deviceStates.cortinas > 30 ? 'on' : 'off'}"><div class="icono">🪟</div><div class="nombre">Cortinas</div><div class="valor">${deviceStates.cortinas}%</div></div>`;
    return html;
}

function generarHistorialPanel() {
    const historial = JSON.parse(localStorage.getItem('historialCuidador') || '[]');
    if (historial.length === 0) return '<div style="color:#64748b;font-size:13px;padding:4px 0;">No hay actividad</div>';
    return historial.slice(-5).reverse().map(h => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155;font-size:12px;color:#cbd5e1;"><span>${h.titulo || 'Actividad'}</span><span style="color:#64748b;font-size:10px;">${new Date(h.timestamp).toLocaleTimeString()}</span></div>`).join('');
}

function notificarCuidador(titulo, mensaje) {
    const historial = JSON.parse(localStorage.getItem('historialCuidador') || '[]');
    historial.push({ titulo, mensaje, timestamp: new Date().toISOString() });
    localStorage.setItem('historialCuidador', JSON.stringify(historial));
}
