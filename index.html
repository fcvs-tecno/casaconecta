<body class="texto-normal">

<div class="phone" role="application" aria-label="CasaConecta, aplicación de domótica accesible">
    <div class="header" role="banner">

            <div class="header-icon" aria-hidden="true">🏠</div>
            <div><div class="header-title" id="app-title">CasaConecta</div><div class="header-sub" id="app-subtitle">Accesible con Voz Total</div></div>
        </div>
        <div class="header-controls">
            <button class="mic-button" id="mic-button" onclick="toggleEscuchaVoz()" title="Activar reconocimiento de voz" aria-label="Activar o desactivar micrófono. Comandos de voz disponibles" aria-pressed="false">🎤</button>
            <div class="header-badge" id="header-badge" aria-live="polite" aria-atomic="true">🔊</div>
        </div>
    </div>
    <nav class="nav" role="navigation" aria-label="Navegación principal">
        <button class="nav-btn active" onclick="navTo('home')" id="nav-home" aria-label="Pantalla de inicio" role="tab" aria-selected="true">🏠 Inicio</button>
        <button class="nav-btn" onclick="navTo('devices')" id="nav-devices" aria-label="Pantalla de dispositivos" role="tab" aria-selected="false">🔌 Disp.</button>
        <button class="nav-btn" onclick="navTo('routines')" id="nav-routines" aria-label="Pantalla de rutinas" role="tab" aria-selected="false">⚡ Rutinas</button>
        <button class="nav-btn" onclick="navTo('medicamentos')" id="nav-medicamentos" aria-label="Pantalla de medicamentos" role="tab" aria-selected="false">💊 Meds</button>
        <button class="nav-btn" onclick="navTo('emergency')" id="nav-emergency" aria-label="Pantalla de emergencia" role="tab" aria-selected="false">🆘 SOS</button>
        <button class="nav-btn" onclick="navTo('settings')" id="nav-settings" aria-label="Pantalla de configuración" role="tab" aria-selected="false">⚙️</button>
    </nav>
    <main class="screen" id="screen-content" role="main" aria-live="polite" aria-atomic="false"></main>
    <div class="profile-bar" role="region" aria-label="Perfiles de accesibilidad">
        <div class="profile-box">
            <div class="profile-label">Perfil de Accesibilidad (múltiple)</div>
            <div class="profile-btns">
                <button class="profile-btn active" data-perfil="motriz" onclick="togglePerfil('motriz')" aria-pressed="true" aria-label="Perfil motriz activo">🦽 Motriz <span class="check-indicator" aria-hidden="true"></span></button>
                <button class="profile-btn" data-perfil="auditiva" onclick="togglePerfil('auditiva')" aria-pressed="false" aria-label="Perfil auditiva">👂 Auditiva <span class="check-indicator" aria-hidden="true"></span></button>
                <button class="profile-btn" data-perfil="visual" onclick="togglePerfil('visual')" aria-pressed="false" aria-label="Perfil visual">👁️ Visual <span class="check-indicator" aria-hidden="true"></span></button>
                <button class="profile-btn" data-perfil="mental" onclick="togglePerfil('mental')" aria-pressed="false" aria-label="Perfil cognitiva">🧠 Cognitiva <span class="check-indicator" aria-hidden="true"></span></button>
            </div>
        </div>
    </div>
</div>

<script>
// ================== ESTADO GLOBAL ==================
var deviceStates = { 
    luz_sala: true, luz_cocina: false, luz_dormitorio: true, 
    luz_dormitorio2: false, luz_dormitorio3: false, luz_bano: false,
    luz_comedor: false, luz_estudio: false, luz_pasillo: false, luz_patio: false,
    puerta: false, termostato: 22, cortinas: 50, 
    alarma: false, camara: true,
    tv_sala: false, tv_dormitorio: false,
    aire_sala: false, aire_dormitorio: false,
    ventilador_sala: false, ventilador_dormitorio: false,
    puerta_traba: true,
    modo_tv: false,
    modo_fresco: false,
    modo_cine: false
};
var config = {
    volumenVoz: 80,
    vibracionActiva: true,
    alertasLuminosas: true,
    contrasteAlto: false,
    tamanoTexto: 'normal'
};
var dispositivosPersonalizados = [];
var medicamentos = [];
var contactosEmergencia = [];
var zonasDisponibles = ['Sala','Cocina','Dormitorio 1','Dormitorio 2','Dormitorio 3','Patio','Pasillo','Baño','Comedor','Estudio'];
var iconosDisponibles = ['💡','🔌','📺','❄️','🌀','📻','🎵','🖥️','☕','🚪','🔒','📹','🚨'];
var currentScreen = 'home';
var perfilesActivos = new Set(['motriz']);
var modoScanningActivo = false;
var scanningTimer = null;
var scanningIndice = 0;
var scanningElementos = [];
var velocidadScanning = 1500;
var esperandoRespuesta = false;
var contextoVoz = null;
var bufferComandoVoz = {};

// ================== AUDIO ==================
function hablar(texto) {
    if (!texto || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    setTimeout(function() {
        var u = new SpeechSynthesisUtterance(texto);
        u.lang = 'es-ES'; u.rate = 0.85; u.pitch = 1; u.volume = config.volumenVoz / 100;
        window.speechSynthesis.speak(u);
    }, 100);
}
function hablarInmediato(texto) {
    if (!texto || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES'; u.rate = 0.9; u.pitch = 1; u.volume = config.volumenVoz / 100;
    window.speechSynthesis.speak(u);
}

// ================== RECONOCIMIENTO DE VOZ ==================
var recognition = null;
var escuchaActiva = false;
var modoEscuchaContinua = true;
window.reconocimientoDisponible = false;

function inicializarReconocimientoVoz() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = modoEscuchaContinua;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onresult = function(event) {
            var comando = event.results[0][0].transcript.toLowerCase().trim();
            procesarComandoVoz(comando);
            if (!modoEscuchaContinua) mostrarIndicadorEscucha(false);
        };
        recognition.onerror = function(event) {
            if (event.error !== 'no-speech' && event.error !== 'aborted') hablar('Error en reconocimiento');
            if (modoEscuchaContinua && escuchaActiva && event.error !== 'not-allowed') {
                setTimeout(function() { if (escuchaActiva) try { recognition.start(); } catch(e) {} }, 500);
            } else { mostrarIndicadorEscucha(false); }
        };
        recognition.onend = function() {
            if (modoEscuchaContinua && escuchaActiva) {
                setTimeout(function() { if (escuchaActiva) try { recognition.start(); } catch(e) { escuchaActiva = false; mostrarIndicadorEscucha(false); } }, 300);
            } else { mostrarIndicadorEscucha(false); }
        };
        window.reconocimientoDisponible = true;
    } else { window.reconocimientoDisponible = false; }
}

function toggleEscuchaVoz() {
    if (!window.reconocimientoDisponible) { hablar('Reconocimiento de voz no disponible'); return; }
    if (escuchaActiva) { detenerEscuchaVoz(); hablar('Micrófono apagado'); }
    else { iniciarEscuchaVoz(); hablar(modoEscuchaContinua ? 'Escuchando siempre' : 'Te escucho'); }
}
function iniciarEscuchaVoz() {
    if (!recognition) return;
    try { recognition.continuous = modoEscuchaContinua; recognition.start(); escuchaActiva = true; mostrarIndicadorEscucha(true); }
    catch (e) { escuchaActiva = false; }
}
function detenerEscuchaVoz() {
    if (recognition) try { recognition.stop(); } catch(e) {}
    escuchaActiva = false; mostrarIndicadorEscucha(false);
}
function toggleModoEscuchaContinua() {
    modoEscuchaContinua = !modoEscuchaContinua; guardarDatos();
    if (recognition) recognition.continuous = modoEscuchaContinua;
    if (escuchaActiva) { detenerEscuchaVoz(); setTimeout(iniciarEscuchaVoz, 200); }
    renderScreen(); hablar(modoEscuchaContinua ? 'Modo continuo' : 'Modo único');
}
function mostrarIndicadorEscucha(activo) {
    var badge = document.getElementById('header-badge');
    var micBtn = document.getElementById('mic-button');
    if (activo) {
        if (badge) { badge.textContent = modoEscuchaContinua ? '🎤🔄' : '🎤'; badge.style.background = modoEscuchaContinua ? '#3b82f6' : '#4ade80'; }
        if (micBtn) { micBtn.classList.add('escuchando'); micBtn.setAttribute('aria-pressed','true'); if (modoEscuchaContinua) micBtn.classList.add('continuo'); }
    } else {
        if (badge) { badge.textContent = '🔊'; badge.style.background = 'rgba(255,255,255,0.2)'; }
        if (micBtn) { micBtn.classList.remove('escuchando'); micBtn.classList.remove('continuo'); micBtn.setAttribute('aria-pressed','false'); }
    }
}
function mostrarNotificacion(mensaje, tipo) {
    var notif = document.createElement('div');
    notif.className = 'notificacion-flotante ' + (tipo || '');
    notif.textContent = mensaje; notif.setAttribute('role','status'); notif.setAttribute('aria-live','polite');
    document.body.appendChild(notif); setTimeout(function() { notif.remove(); }, 3000);
}

// ================== COMANDOS DE VOZ COMPLETOS ==================
function procesarComandoVoz(comando) {
    comando = comando.toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g, '');
    console.log('🎤', comando);
    var ok = false;

    if (esperandoRespuesta && contextoVoz) {
        ok = procesarContextoConversacional(comando);
        if (ok) return;
    }

    // AYUDA Y DESCRIPCIONES (ACCESIBILIDAD VISUAL)
    if (comando.includes('que hay') || comando.includes('que veo') || comando.includes('describir') || comando.includes('leer pantalla') || comando.includes('contenido')) {
        describirPantallaActual(); ok = true;
    } else if (comando.includes('donde estoy') || comando.includes('que pantalla')) {
        hablar('Estás en ' + getNombrePantalla(currentScreen)); ok = true;
    } else if (comando.includes('comandos') || comando.includes('que puedo decir') || (comando.includes('ayuda') && !comando.includes('emergencia'))) {
        hablarAyuda(); ok = true;
    } else if (comando.includes('estado general') || comando.includes('como esta todo') || comando.includes('resumen')) {
        describirEstadoGeneral(); ok = true;
    }

    // NAVEGACIÓN
    if (!ok) {
        if (comando.includes('inicio') || comando.includes('home') || comando.includes('principal')) { navTo('home'); ok = true; }
        else if (comando.includes('dispositivo') || comando.includes('disp')) { navTo('devices'); ok = true; }
        else if (comando.includes('rutina') || comando.includes('escenas')) { navTo('routines'); ok = true; }
        else if (comando.includes('medicamento') || comando.includes('meds') || comando.includes('medicacion')) { navTo('medicamentos'); ok = true; }
        else if (comando.includes('emergencia') || comando.includes('sos')) { navTo('emergency'); ok = true; }
        else if (comando.includes('configuracion') || comando.includes('ajustes') || comando.includes('settings')) { navTo('settings'); ok = true; }
        else if (comando.includes('atras') || comando.includes('volver') || comando.includes('retroceder')) { navTo('home'); ok = true; }
    }

    // PERFILES
    if (!ok) {
        if (comando.includes('perfil motriz') || comando.includes('modo motriz')) { setPerfilUnico('motriz'); ok = true; }
        else if (comando.includes('perfil auditiv') || comando.includes('modo auditiv')) { setPerfilUnico('auditiva'); ok = true; }
        else if (comando.includes('perfil visual') || comando.includes('modo visual')) { setPerfilUnico('visual'); ok = true; }
        else if (comando.includes('perfil cognitiv') || comando.includes('modo cognitiv') || comando.includes('perfil mental')) { setPerfilUnico('mental'); ok = true; }
        else if (comando.includes('todos los perfiles') || comando.includes('activar todo perfil')) {
            perfilesActivos = new Set(['motriz','auditiva','visual','mental']);
            aplicarPerfiles(); renderScreen(); guardarDatos(); hablar('Todos los perfiles activados'); ok = true;
        }
    }

    // LUCES
    if (!ok) {
        var mapaLuces = {
            'luz sala':'luz_sala','luz de la sala':'luz_sala','luz cocina':'luz_cocina','luz de la cocina':'luz_cocina',
            'luz dormitorio':'luz_dormitorio','luz del dormitorio':'luz_dormitorio','luz habitacion':'luz_dormitorio',
            'luz dormitorio dos':'luz_dormitorio2','luz dormitorio 2':'luz_dormitorio2',
            'luz dormitorio tres':'luz_dormitorio3','luz dormitorio 3':'luz_dormitorio3',
            'luz bano':'luz_bano','luz del bano':'luz_bano','luz baño':'luz_bano',
            'luz comedor':'luz_comedor','luz del comedor':'luz_comedor',
            'luz estudio':'luz_estudio','luz del estudio':'luz_estudio',
            'luz pasillo':'luz_pasillo','luz del pasillo':'luz_pasillo',
            'luz patio':'luz_patio','luz del patio':'luz_patio'
        };
        for (var frase in mapaLuces) {
            if (comando.includes(frase)) {
                if (comando.includes('encender')||comando.includes('prender')||comando.includes('activar')) deviceStates[mapaLuces[frase]] = true;
                else if (comando.includes('apagar')||comando.includes('desactivar')) deviceStates[mapaLuces[frase]] = false;
                else { toggleDevice(mapaLuces[frase]); ok = true; break; }
                renderScreen(); guardarDatos();
                hablar((deviceStates[mapaLuces[frase]]?'Encendida':'Apagada')+' '+frase);
                ok = true; break;
            }
        }
        if (!ok && (comando.includes('encender luz')||comando.includes('prender luz')) && (comando.includes('todas')||comando.includes('todo'))) {
            Object.keys(deviceStates).forEach(function(k){ if(k.startsWith('luz_')) deviceStates[k]=true; });
            renderScreen(); guardarDatos(); hablar('Todas las luces encendidas'); ok = true;
        }
        if (!ok && comando.includes('apagar luz') && (comando.includes('todas')||comando.includes('todo'))) {
            Object.keys(deviceStates).forEach(function(k){ if(k.startsWith('luz_')) deviceStates[k]=false; });
            renderScreen(); guardarDatos(); hablar('Todas las luces apagadas'); ok = true;
        }
    }

    // PUERTA Y SEGURIDAD
    if (!ok) {
        if (comando.includes('abrir puerta')||comando.includes('abrir la puerta')) {
            deviceStates.puerta=true; deviceStates.puerta_traba=false; renderScreen(); guardarDatos(); hablar('Puerta abierta'); ok = true;
        } else if (comando.includes('cerrar puerta')||comando.includes('cerrar la puerta')) {
            deviceStates.puerta=false; deviceStates.puerta_traba=true; renderScreen(); guardarDatos(); hablar('Puerta cerrada con seguridad'); ok = true;
        } else if (comando.includes('traba')||comando.includes('cerradura')||comando.includes('seguro')) {
            if (comando.includes('activar')||comando.includes('poner')||comando.includes('cerrar')||comando.includes('echar')) {
                deviceStates.puerta_traba=true; renderScreen(); guardarDatos(); hablar('Traba activada'); ok = true;
            } else if (comando.includes('desactivar')||comando.includes('quitar')||comando.includes('abrir')||comando.includes('sacar')) {
                deviceStates.puerta_traba=false; renderScreen(); guardarDatos(); hablar('Traba desactivada'); ok = true;
            } else { toggleDevice('puerta_traba'); ok = true; }
        } else if (comando.includes('alarma')) {
            if (comando.includes('activar')||comando.includes('encender')||comando.includes('prender')) { deviceStates.alarma=true; renderScreen(); guardarDatos(); hablar('Alarma activada'); ok = true; }
            else if (comando.includes('desactivar')||comando.includes('apagar')) { deviceStates.alarma=false; renderScreen(); guardarDatos(); hablar('Alarma desactivada'); ok = true; }
            else { toggleDevice('alarma'); ok = true; }
        } else if (comando.includes('camara')||comando.includes('cámara')) { toggleDevice('camara'); ok = true; }
    }

    // CLIMA
    if (!ok) {
        var tm = comando.match(/(\d+)/);
        if ((comando.includes('temperatura')||comando.includes('grados')||comando.includes('termostato')) && tm) {
            var nt = parseInt(tm[0]);
            if (nt>=10 && nt<=35) { deviceStates.termostato=nt; renderScreen(); guardarDatos(); hablar('Temperatura '+nt+' grados'); ok = true; }
        } else if (comando.includes('subir temperatura')||comando.includes('mas caliente')||comando.includes('aumentar temperatura')) { adjustTemp(1); ok = true; }
        else if (comando.includes('bajar temperatura')||comando.includes('mas frio')||comando.includes('disminuir temperatura')||comando.includes('más frío')) { adjustTemp(-1); ok = true; }
        else if (comando.includes('aire')||comando.includes('aire acondicionado')) {
            if (comando.includes('sala')) { toggleDevice('aire_sala'); ok = true; }
            else if (comando.includes('dormitorio')) { toggleDevice('aire_dormitorio'); ok = true; }
            else { toggleDevice('aire_sala'); ok = true; }
        } else if (comando.includes('ventilador')) {
            if (comando.includes('sala')) { toggleDevice('ventilador_sala'); ok = true; }
            else if (comando.includes('dormitorio')) { toggleDevice('ventilador_dormitorio'); ok = true; }
            else { toggleDevice('ventilador_sala'); ok = true; }
        }
    }

    // CORTINAS
    if (!ok && (comando.includes('cortina')||comando.includes('cortinas'))) {
        if (comando.includes('abrir')||comando.includes('subir')) { deviceStates.cortinas=100; renderScreen(); guardarDatos(); hablar('Cortinas abiertas'); ok = true; }
        else if (comando.includes('cerrar')||comando.includes('bajar')) { deviceStates.cortinas=0; renderScreen(); guardarDatos(); hablar('Cortinas cerradas'); ok = true; }
        else if (comando.includes('mitad')||comando.includes('media')) { deviceStates.cortinas=50; renderScreen(); guardarDatos(); hablar('Cortinas al cincuenta por ciento'); ok = true; }
        else { hablar('Cortinas al '+deviceStates.cortinas+' por ciento'); ok = true; }
    }

    // TV
    if (!ok && (comando.includes('tele')||comando.includes('tv')||comando.includes('television'))) {
        if (comando.includes('sala')) { toggleDevice('tv_sala'); ok = true; }
        else if (comando.includes('dormitorio')||comando.includes('habitacion')) { toggleDevice('tv_dormitorio'); ok = true; }
        else { toggleDevice('tv_sala'); ok = true; }
    }

    // RUTINAS
    if (!ok) {
        if (comando.includes('llegue a casa')||comando.includes('llegue')||comando.includes('estoy en casa')||comando.includes('bienvenido')) { ejecutarRutina('Llegué a casa'); ok = true; }
        else if (comando.includes('me voy')||comando.includes('saliendo')||comando.includes('adios casa')||comando.includes('chao casa')) { ejecutarRutina('Me voy de casa'); ok = true; }
        else if (comando.includes('buenos dias')||comando.includes('buen dia')||comando.includes('despertar')) { ejecutarRutina('Buenos Días'); ok = true; }
        else if (comando.includes('buenas noches')||comando.includes('dormir')||comando.includes('ir a dormir')) { ejecutarRutina('Buenas Noches'); ok = true; }
        else if (comando.includes('modo tv')||comando.includes('modo tele')||comando.includes('ver tele')) { ejecutarRutina('Modo TV'); ok = true; }
        else if (comando.includes('modo fresco')||comando.includes('refrescar')||comando.includes('enfriar')) { ejecutarRutina('Modo Fresco'); ok = true; }
        else if (comando.includes('modo cine')||comando.includes('ver pelicula')||comando.includes('pelicula')) { ejecutarRutina('Modo Cine'); ok = true; }
    }

    // MEDICAMENTOS POR VOZ - CRUD
    if (!ok) {
        if (comando.includes('tomar medicamento')||comando.includes('tome medicamento')||comando.includes('medicamento tomado')) {
            if (medicamentos.length>0) {
                var medPendiente = medicamentos.find(function(m) {
                    var ultima = m.ultimaToma ? new Date(m.ultimaToma) : null;
                    var ahora = new Date();
                    return !ultima || ultima.getDate() !== ahora.getDate();
                });
                if (medPendiente) { tomarMedicamento(medPendiente.id); ok = true; }
                else { hablar('No hay medicamentos pendientes'); ok = true; }
            } else { hablar('No hay medicamentos configurados'); ok = true; }
        } else if (comando.includes('agregar medicamento')||comando.includes('nuevo medicamento')||comando.includes('crear medicamento')) {
            iniciarAgregarMedicamentoVoz(); ok = true;
        } else if (comando.includes('eliminar medicamento')) {
            iniciarEliminarMedicamentoVoz(comando); ok = true;
        } else if (comando.includes('ver medicamentos')||comando.includes('mis medicamentos')||comando.includes('listar medicamentos')) {
            navTo('medicamentos'); describirMedicamentos(); ok = true;
        } else if (comando.includes('filtrar pendientes')||comando.includes('mostrar pendientes')) {
            navTo('medicamentos'); setTimeout(function() { filtrarMedicamentos('pendientes'); hablar('Mostrando medicamentos pendientes'); }, 300); ok = true;
        } else if (comando.includes('filtrar tomados')||comando.includes('mostrar tomados')) {
            navTo('medicamentos'); setTimeout(function() { filtrarMedicamentos('tomados'); hablar('Mostrando medicamentos tomados hoy'); }, 300); ok = true;
        } else if (comando.includes('filtrar todos')||comando.includes('mostrar todos medicamentos')) {
            navTo('medicamentos'); setTimeout(function() { filtrarMedicamentos('todos'); hablar('Mostrando todos los medicamentos'); }, 300); ok = true;
        }
    }

    // CONTACTOS POR VOZ - CRUD
    if (!ok) {
        if (comando.includes('agregar contacto')||comando.includes('nuevo contacto')||comando.includes('crear contacto')) {
            iniciarAgregarContactoVoz(); ok = true;
        } else if (comando.includes('eliminar contacto')) {
            iniciarEliminarContactoVoz(comando); ok = true;
        } else if (comando.includes('llamar contacto')||comando.includes('llamar a')) {
            iniciarLlamarContactoVoz(comando); ok = true;
        } else if (comando.includes('ver contactos')||comando.includes('mis contactos')||comando.includes('listar contactos')) {
            navTo('emergency'); describirContactos(); ok = true;
        } else if (comando.includes('llamar emergencia')||comando.includes('llamar primer contacto')) {
            if (contactosEmergencia.length>0) { llamarContacto(contactosEmergencia[0].id); ok = true; }
            else { hablar('No hay contactos configurados'); ok = true; }
        }
    }

    // DISPOSITIVOS PERSONALIZADOS POR VOZ
    if (!ok) {
        if (comando.includes('agregar dispositivo')||comando.includes('nuevo dispositivo')||comando.includes('crear dispositivo')) {
            iniciarAgregarDispositivoVoz(); ok = true;
        } else if (comando.includes('eliminar dispositivo')) {
            iniciarEliminarDispositivoVoz(comando); ok = true;
        } else if (comando.includes('encender dispositivo')||comando.includes('apagar dispositivo')) {
            iniciarToggleDispositivoVoz(comando); ok = true;
        } else if (comando.includes('listar dispositivos')||comando.includes('ver dispositivos')||comando.includes('mis dispositivos')) {
            navTo('devices'); describirDispositivos(); ok = true;
        }
    }

    // EMERGENCIA
    if (!ok) {
        if ((comando.includes('emergencia')||comando.includes('socorro')||comando.includes('auxilio')) && !comando.includes('contacto')) {
            if (comando.includes('activar')||comando.includes('boton')) { activarEmergencia(); ok = true; }
            else { navTo('emergency'); ok = true; }
        } else if (comando.includes('panel cuidador')||comando.includes('panel del cuidador')) {
            abrirPanelCuidador(); hablar('Panel del cuidador abierto'); ok = true;
        }
    }

    // SCANNING
    if (!ok) {
        if (comando.includes('scanning')||comando.includes('escaneo')) {
            if (comando.includes('activar')||comando.includes('encender')) { if(!modoScanningActivo) toggleScanning(); ok = true; }
            else if (comando.includes('desactivar')||comando.includes('apagar')) { if(modoScanningActivo) toggleScanning(); ok = true; }
            else { toggleScanning(); ok = true; }
        } else if (comando.includes('mas lento')||comando.includes('disminuir velocidad')) {
            velocidadScanning = Math.min(4000, velocidadScanning + 500); renderScreen(); hablar('Velocidad de scanning reducida'); ok = true;
        } else if (comando.includes('mas rapido')||comando.includes('aumentar velocidad')) {
            velocidadScanning = Math.max(500, velocidadScanning - 500); renderScreen(); hablar('Velocidad de scanning aumentada'); ok = true;
        }
    }

    // CONFIGURACIÓN
    if (!ok) {
        if (comando.includes('volumen')) {
            var vm = comando.match(/(\d+)/);
            if (vm) { var nv = parseInt(vm[0]); if(nv>=0&&nv<=100){ config.volumenVoz=nv; guardarDatos(); hablar('Volumen al '+nv+' por ciento'); ok = true; }}
            else if (comando.includes('subir')||comando.includes('aumentar')) { config.volumenVoz=Math.min(100,config.volumenVoz+10); guardarDatos(); hablar('Volumen al '+config.volumenVoz); ok = true; }
            else if (comando.includes('bajar')||comando.includes('disminuir')) { config.volumenVoz=Math.max(0,config.volumenVoz-10); guardarDatos(); hablar('Volumen al '+config.volumenVoz); ok = true; }
        } else if (comando.includes('vibracion')||comando.includes('vibración')) {
            if (comando.includes('activar')||comando.includes('encender')) { config.vibracionActiva=true; guardarDatos(); renderScreen(); hablar('Vibración activada'); ok = true; }
            else if (comando.includes('desactivar')||comando.includes('apagar')) { config.vibracionActiva=false; guardarDatos(); renderScreen(); hablar('Vibración desactivada'); ok = true; }
            else { config.vibracionActiva=!config.vibracionActiva; guardarDatos(); renderScreen(); hablar(config.vibracionActiva?'Vibración activada':'Vibración desactivada'); ok = true; }
        } else if (comando.includes('alertas luminosas')||comando.includes('luces de alerta')) {
            if (comando.includes('activar')||comando.includes('encender')) { config.alertasLuminosas=true; guardarDatos(); renderScreen(); hablar('Alertas luminosas activadas'); ok = true; }
            else if (comando.includes('desactivar')||comando.includes('apagar')) { config.alertasLuminosas=false; guardarDatos(); renderScreen(); hablar('Alertas luminosas desactivadas'); ok = true; }
            else { config.alertasLuminosas=!config.alertasLuminosas; guardarDatos(); renderScreen(); hablar(config.alertasLuminosas?'Alertas luminosas activadas':'Alertas luminosas desactivadas'); ok = true; }
        } else if (comando.includes('contraste alto')||comando.includes('alto contraste')) {
            if (comando.includes('activar')||comando.includes('encender')) { config.contrasteAlto=true; }
            else if (comando.includes('desactivar')||comando.includes('apagar')) { config.contrasteAlto=false; }
            else { config.contrasteAlto=!config.contrasteAlto; }
            aplicarPerfiles(); renderScreen(); guardarDatos(); hablar(config.contrasteAlto?'Contraste alto activado':'Contraste alto desactivado'); ok = true;
        } else if (comando.includes('texto normal')||comando.includes('tamaño normal')) {
            config.tamanoTexto='normal'; aplicarPerfiles(); renderScreen(); guardarDatos(); hablar('Texto normal'); ok = true;
        } else if (comando.includes('texto grande')||comando.includes('tamaño grande')) {
            config.tamanoTexto='grande'; aplicarPerfiles(); renderScreen(); guardarDatos(); hablar('Texto grande'); ok = true;
        } else if (comando.includes('texto muy grande')||comando.includes('tamaño muy grande')) {
            config.tamanoTexto='muy-grande'; aplicarPerfiles(); renderScreen(); guardarDatos(); hablar('Texto muy grande'); ok = true;
        } else if (comando.includes('modo continuo')||comando.includes('escucha continua')) {
            if (!modoEscuchaContinua) toggleModoEscuchaContinua(); else { hablar('Ya está en modo continuo'); } ok = true;
        } else if (comando.includes('modo unico')||comando.includes('escucha unica')) {
            if (modoEscuchaContinua) toggleModoEscuchaContinua(); else { hablar('Ya está en modo único'); } ok = true;
        }
    }

    // GENERALES
    if (!ok) {
        if (comando.includes('estado') || comando.includes('como esta') || comando.includes('situacion')) {
            describirEstadoGeneral(); ok = true;
        } else if (comando.includes('apagar todo') || comando.includes('todo apagado')) {
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k.startsWith('custom_') || k === 'tv_sala' || k === 'tv_dormitorio' || k === 'aire_sala' || k === 'aire_dormitorio' || k === 'ventilador_sala' || k === 'ventilador_dormitorio') deviceStates[k] = false;
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true;
            renderScreen(); guardarDatos(); hablar('Todo apagado y casa asegurada'); ok = true;
        } else if (comando.includes('encender todo') || comando.includes('todo encendido')) {
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k.startsWith('custom_')) deviceStates[k] = true;
            });
            deviceStates.puerta = true; deviceStates.puerta_traba = false;
            renderScreen(); guardarDatos(); hablar('Todo encendido'); ok = true;
        } else if (comando.includes('gracias') || comando.includes('perfecto') || comando.includes('excelente')) {
            hablar('De nada, estoy aquí para ayudarte'); ok = true;
        } else if (comando.includes('hola') || comando.includes('buenas')) {
            hablar('Hola, ¿en qué puedo ayudarte?'); ok = true;
        } else if (comando.includes('cancelar') || comando.includes('detener') || comando.includes('parar')) {
            esperandoRespuesta = false; contextoVoz = null; bufferComandoVoz = {};
            hablar('Cancelado'); ok = true;
        }
    }

    if (!ok) {
        hablar('No entendí. Di ayuda para escuchar comandos disponibles');
        mostrarNotificacion('Comando no reconocido', 'warning');
    }
}

// ================== MODO CONVERSACIONAL POR VOZ ==================
function iniciarAgregarMedicamentoVoz() {
    esperandoRespuesta = true; contextoVoz = 'agregar_medicamento_paso1';
    bufferComandoVoz = {};
    hablar('Modo agregar medicamento. Di el nombre del medicamento.');
}
function iniciarAgregarContactoVoz() {
    esperandoRespuesta = true; contextoVoz = 'agregar_contacto_paso1';
    bufferComandoVoz = {};
    hablar('Modo agregar contacto. Di el nombre del contacto.');
}
function iniciarAgregarDispositivoVoz() {
    esperandoRespuesta = true; contextoVoz = 'agregar_dispositivo_paso1';
    bufferComandoVoz = {};
    hablar('Modo agregar dispositivo. Di el nombre del dispositivo.');
}

function procesarContextoConversacional(comando) {
    var ok = true;
    switch(contextoVoz) {
        case 'agregar_medicamento_paso1':
            bufferComandoVoz.nombre = comando;
            contextoVoz = 'agregar_medicamento_paso2';
            hablar('Nombre: ' + comando + '. Ahora di la dosis, por ejemplo: una pastilla, o 500 miligramos.');
            break;
        case 'agregar_medicamento_paso2':
            bufferComandoVoz.dosis = comando;
            contextoVoz = 'agregar_medicamento_paso3';
            hablar('Dosis: ' + comando + '. Ahora di la hora en formato 24 horas, por ejemplo: 8, o 14.');
            break;
        case 'agregar_medicamento_paso3':
            var hm = comando.match(/(\d+)/);
            if (hm) { bufferComandoVoz.hora = parseInt(hm[0]); }
            else { bufferComandoVoz.hora = 8; }
            contextoVoz = 'agregar_medicamento_paso4';
            hablar('Hora: ' + bufferComandoVoz.hora + '. Ahora di los minutos, por ejemplo: 0, o 30.');
            break;
        case 'agregar_medicamento_paso4':
            var mm = comando.match(/(\d+)/);
            bufferComandoVoz.minutos = mm ? parseInt(mm[0]) : 0;
            var horario = bufferComandoVoz.hora.toString().padStart(2,'0') + ':' + bufferComandoVoz.minutos.toString().padStart(2,'0');
            medicamentos.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2,4),
                nombre: bufferComandoVoz.nombre, dosis: bufferComandoVoz.dosis,
                horario: horario, frecuencia: 'diario', activo: true, ultimaToma: null, historial: [], creado: new Date().toISOString()
            });
            guardarDatos(); renderScreen();
            hablar('Medicamento ' + bufferComandoVoz.nombre + ' agregado para las ' + horario);
            esperandoRespuesta = false; contextoVoz = null;
            break;

        case 'agregar_contacto_paso1':
            bufferComandoVoz.nombre = comando;
            contextoVoz = 'agregar_contacto_paso2';
            hablar('Nombre: ' + comando + '. Ahora di el número de teléfono.');
            break;
        case 'agregar_contacto_paso2':
            var tel = comando.replace(/\s/g, '').replace(/[^\d]/g, '');
            if (tel.length < 5) { hablar('No entendí el teléfono. Repítelo por favor.'); break; }
            bufferComandoVoz.telefono = tel;
            contextoVoz = 'agregar_contacto_paso3';
            hablar('Teléfono: ' + tel + '. Ahora di la relación: hijo, esposo, cuidador, médico, familiar, amigo, o emergencias.');
            break;
        case 'agregar_contacto_paso3':
            var rel = 'Familiar';
            if (comando.includes('hijo')) rel = 'Hijo/a';
            else if (comando.includes('espos')) rel = 'Esposo/a';
            else if (comando.includes('cuidador')) rel = 'Cuidador';
            else if (comando.includes('medico')) rel = 'Médico';
            else if (comando.includes('amigo')) rel = 'Amigo';
            else if (comando.includes('emergencia')) rel = 'Emergencias';
            contactosEmergencia.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2,4),
                nombre: bufferComandoVoz.nombre, telefono: bufferComandoVoz.telefono, relacion: rel, fecha: new Date().toISOString()
            });
            guardarDatos(); renderScreen();
            hablar('Contacto ' + bufferComandoVoz.nombre + ' agregado como ' + rel);
            esperandoRespuesta = false; contextoVoz = null;
            break;

        case 'agregar_dispositivo_paso1':
            bufferComandoVoz.nombre = comando;
            contextoVoz = 'agregar_dispositivo_paso2';
            hablar('Dispositivo: ' + comando + '. Ahora di la zona. Opciones: sala, cocina, dormitorio 1, dormitorio 2, dormitorio 3, patio, pasillo, baño, comedor, o estudio.');
            break;
        case 'agregar_dispositivo_paso2':
            var zona = 'Sala';
            if (comando.includes('cocina')) zona = 'Cocina';
            else if (comando.includes('dormitorio 2')||comando.includes('habitacion 2')) zona = 'Dormitorio 2';
            else if (comando.includes('dormitorio 3')||comando.includes('habitacion 3')) zona = 'Dormitorio 3';
            else if (comando.includes('dormitorio')||comando.includes('habitacion')) zona = 'Dormitorio 1';
            else if (comando.includes('patio')) zona = 'Patio';
            else if (comando.includes('pasillo')) zona = 'Pasillo';
            else if (comando.includes('bano')||comando.includes('baño')) zona = 'Baño';
            else if (comando.includes('comedor')) zona = 'Comedor';
            else if (comando.includes('estudio')) zona = 'Estudio';
            var id = Date.now().toString(36) + Math.random().toString(36).substr(2,4);
            dispositivosPersonalizados.push({ id: id, nombre: bufferComandoVoz.nombre, zona: zona, icono: '🔌', fecha: new Date().toISOString() });
            deviceStates['custom_' + id] = false;
            guardarDatos(); renderScreen();
            hablar('Dispositivo ' + bufferComandoVoz.nombre + ' agregado en ' + zona);
            esperandoRespuesta = false; contextoVoz = null;
            break;

        case 'eliminar_medicamento':
            var med = buscarMedicamentoPorNombre(comando);
            if (med) { eliminarMedicamento(med.id); esperandoRespuesta = false; contextoVoz = null; }
            else { hablar('No encontré ese medicamento. Di cancelar para salir.'); }
            break;
        case 'eliminar_contacto':
            var con = buscarContactoPorNombre(comando);
            if (con) { eliminarContacto(con.id); esperandoRespuesta = false; contextoVoz = null; }
            else { hablar('No encontré ese contacto. Di cancelar para salir.'); }
            break;
        case 'eliminar_dispositivo':
            var dis = buscarDispositivoPorNombre(comando);
            if (dis) { eliminarPersonalizado(dis.id); esperandoRespuesta = false; contextoVoz = null; }
            else { hablar('No encontré ese dispositivo. Di cancelar para salir.'); }
            break;
        case 'llamar_contacto':
            var con2 = buscarContactoPorNombre(comando);
            if (con2) { llamarContacto(con2.id); esperandoRespuesta = false; contextoVoz = null; }
            else { hablar('No encontré ese contacto. Di cancelar para salir.'); }
            break;
        case 'toggle_dispositivo':
            var dis2 = buscarDispositivoPorNombre(comando);
            if (dis2) { togglePersonalizado(dis2.id); esperandoRespuesta = false; contextoVoz = null; }
            else { hablar('No encontré ese dispositivo. Di cancelar para salir.'); }
            break;
        default:
            ok = false;
    }
    return ok;
}

function iniciarEliminarMedicamentoVoz(comando) {
    var nombre = comando.replace('eliminar medicamento', '').replace('borrar medicamento', '').trim();
    if (nombre) {
        var med = buscarMedicamentoPorNombre(nombre);
        if (med) { eliminarMedicamento(med.id); }
        else { hablar('No encontré el medicamento ' + nombre); }
    } else {
        esperandoRespuesta = true; contextoVoz = 'eliminar_medicamento';
        hablar('Di el nombre del medicamento que quieres eliminar.');
    }
}

function iniciarLlamarContactoVoz(comando) {

        else { hablar('No encontré el contacto ' + nombre); }
    } else {
        esperandoRespuesta = true; contextoVoz = 'llamar_contacto';
        hablar('Di el nombre del contacto al que quieres llamar.');
    }
}
function iniciarToggleDispositivoVoz(comando) {
    var encender = comando.includes('encender');
    var nombre = comando.replace('encender dispositivo', '').replace('apagar dispositivo', '').trim();
    if (nombre) {
        var dis = buscarDispositivoPorNombre(nombre);
        if (dis) {
            var key = 'custom_' + dis.id;
            deviceStates[key] = encender;
            renderScreen(); guardarDatos();
            hablar(dis.nombre + ' ' + (encender?'encendido':'apagado'));
        } else { hablar('No encontré el dispositivo ' + nombre); }
    } else {
        esperandoRespuesta = true; contextoVoz = 'toggle_dispositivo';
        hablar('Di el nombre del dispositivo.');
    }
}

function buscarMedicamentoPorNombre(nombre) {
    var n = nombre.toLowerCase().trim();
    return medicamentos.find(function(m) { return m.nombre.toLowerCase().includes(n) || n.includes(m.nombre.toLowerCase()); });
}
function buscarContactoPorNombre(nombre) {
    var n = nombre.toLowerCase().trim();
    return contactosEmergencia.find(function(c) { return c.nombre.toLowerCase().includes(n) || n.includes(c.nombre.toLowerCase()); });
}
function buscarDispositivoPorNombre(nombre) {
    var n = nombre.toLowerCase().trim();
    return dispositivosPersonalizados.find(function(d) { return d.nombre.toLowerCase().includes(n) || n.includes(d.nombre.toLowerCase()); });
}

// ================== DESCRIPCIONES DE PANTALLA (ACCESIBILIDAD VISUAL) ==================
function getNombrePantalla(screen) {
    var nombres = { home: 'inicio', devices: 'dispositivos', routines: 'rutinas', medicamentos: 'medicamentos', emergency: 'emergencia', settings: 'configuración' };
    return nombres[screen] || screen;
}
function describirPantallaActual() {
    var texto = '';
    switch(currentScreen) {
        case 'home':
            texto = 'Pantalla de inicio. ';
            var encendidos = [];
            if (deviceStates.luz_sala) encendidos.push('luz de la sala');
            if (deviceStates.luz_cocina) encendidos.push('luz de la cocina');
            if (deviceStates.puerta) encendidos.push('puerta abierta');
            if (deviceStates.aire_sala) encendidos.push('aire acondicionado');
            texto += encendidos.length > 0 ? 'Dispositivos activos: ' + encendidos.join(', ') + '. ' : 'No hay dispositivos activos. ';
            texto += 'Temperatura: ' + deviceStates.termostato + ' grados. ';

// ================== CARGA Y GUARDADO ==================
function cargarDatos() {
    try {
        var perfiles = localStorage.getItem('perfilesActivos');
        if (perfiles) { var arr = JSON.parse(perfiles); if (arr.length > 0) perfilesActivos = new Set(arr); }
        var personalizados = localStorage.getItem('dispositivosPersonalizados');
        if (personalizados) dispositivosPersonalizados = JSON.parse(personalizados);
        var meds = localStorage.getItem('medicamentos');
        if (meds) medicamentos = JSON.parse(meds);
        var contactos = localStorage.getItem('contactosEmergencia');
        if (contactos) contactosEmergencia = JSON.parse(contactos);
        var estados = localStorage.getItem('deviceStates');
        if (estados) { var parsed = JSON.parse(estados); deviceStates = { ...deviceStates, ...parsed }; }
        var cfg = localStorage.getItem('configCasaConecta');
        if (cfg) { var parsedCfg = JSON.parse(cfg); config = { ...config, ...parsedCfg }; }
    } catch(e) { console.error('Error cargando datos:', e); }
}
function guardarDatos() {
    localStorage.setItem('perfilesActivos', JSON.stringify([...perfilesActivos]));
    localStorage.setItem('dispositivosPersonalizados', JSON.stringify(dispositivosPersonalizados));
    localStorage.setItem('medicamentos', JSON.stringify(medicamentos));
    localStorage.setItem('contactosEmergencia', JSON.stringify(contactosEmergencia));
    localStorage.setItem('deviceStates', JSON.stringify(deviceStates));
    localStorage.setItem('configCasaConecta', JSON.stringify(config));
}

// ================== PERFILES ==================
function togglePerfil(perfil) {
    if (perfilesActivos.has(perfil)) {
        perfilesActivos.delete(perfil);
        if (perfilesActivos.size === 0) perfilesActivos.add('motriz');
    } else { perfilesActivos.add(perfil); }
    aplicarPerfiles(); renderScreen(); guardarDatos();
}
function setPerfilUnico(perfil) {
    perfilesActivos = new Set([perfil]);
    aplicarPerfiles(); renderScreen(); guardarDatos();
    var nombres = { motriz: 'motriz', auditiva: 'auditiva', visual: 'visual', mental: 'cognitiva' };
    hablar('Perfil ' + (nombres[perfil] || perfil) + ' activado');
}
function aplicarPerfiles() {
    document.body.className = '';
    document.body.classList.add('texto-' + config.tamanoTexto);
    if (config.contrasteAlto) document.body.classList.add('contraste-alto');
    perfilesActivos.forEach(function(p) { document.body.classList.add('perfil-' + p); });
    document.querySelectorAll('.profile-btn').forEach(function(btn) {
        var p = btn.dataset.perfil;
        var activo = perfilesActivos.has(p);
        btn.classList.toggle('active', activo);
        btn.setAttribute('aria-pressed', activo ? 'true' : 'false');
    });
}
function tienePerfil(p) { return perfilesActivos.has(p); }

function navTo(screen) {

    var idx = dispositivosPersonalizados.findIndex(function(d) { return d.id === id; });

        deviceStates[key] = !deviceStates[key];

function eliminarPersonalizado(id) {

        if (idx !== -1) {
            var key = 'custom_' + id;
            delete deviceStates[key];
            dispositivosPersonalizados.splice(idx, 1);

function agregarDispositivo() {
    var nombre = document.getElementById('input-nombre')?.value.trim();
    var zona = document.getElementById('input-zona')?.value;

function adjustTemp(delta) {

    renderScreen(); guardarDatos();
    hablar('Temperatura ajustada a ' + deviceStates.termostato + ' grados');
}
function adjustCortinas(delta) {
    deviceStates.cortinas = Math.max(0, Math.min(100, deviceStates.cortinas + delta));
    renderScreen(); guardarDatos();
    hablar('Cortinas al ' + deviceStates.cortinas + ' por ciento');
}

// ================== MEDICAMENTOS ==================
function agregarMedicamento() {
    var nombre = document.getElementById('med-nombre')?.value.trim();
    var dosis = document.getElementById('med-dosis')?.value.trim();
    var hora = document.getElementById('med-hora')?.value;
    var minutos = document.getElementById('med-minutos')?.value;
    var frecuencia = document.getElementById('med-frecuencia')?.value;
    if (!nombre || !dosis || hora === '' || minutos === '') { hablar('Por favor completa todos los campos'); return; }
    var horario = parseInt(hora).toString().padStart(2, '0') + ':' + parseInt(minutos).toString().padStart(2, '0');
    medicamentos.push({
        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
        nombre: nombre, dosis: dosis, horario: horario, frecuencia: frecuencia || 'diario',
        activo: true, ultimaToma: null, historial: [], creado: new Date().toISOString()
    });
    guardarDatos(); renderScreen();
    hablar('Medicamento ' + nombre + ' agregado para las ' + horario);
    if (document.getElementById('med-nombre')) { document.getElementById('med-nombre').value = ''; document.getElementById('med-dosis').value = ''; }
}
function eliminarMedicamento(id) {
    if (confirm('¿Eliminar este medicamento?')) {
        medicamentos = medicamentos.filter(function(m) { return m.id !== id; });
        guardarDatos(); renderScreen();
        hablar('Medicamento eliminado');
    }
}
function tomarMedicamento(id) {
    var med = medicamentos.find(function(m) { return m.id === id; });
    if (!med) return;
    var ahora = new Date();
    med.historial.push({ fecha: ahora.toISOString(), hora: ahora.toLocaleTimeString(), tomado: true });
    med.ultimaToma = ahora.toISOString();
    guardarDatos(); renderScreen();
    hablar('Has tomado ' + med.nombre);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
}
function verificarMedicamentosPendientes() {
    var ahora = new Date();
    var tiempoActual = ahora.getHours() * 60 + ahora.getMinutes();
    for (var i = 0; i < medicamentos.length; i++) {
        var med = medicamentos[i];
        if (!med.activo) continue;
        var partes = med.horario.split(':');
        var h = parseInt(partes[0]), m = parseInt(partes[1]);
        var tiempoMed = h * 60 + m;
        var diff = tiempoActual - tiempoMed;
        if (diff >= 0 && diff <= 5) {
            var ultima = med.ultimaToma ? new Date(med.ultimaToma) : null;
            if (!ultima || ultima.getDate() !== ahora.getDate()) mostrarRecordatorioMedicamento(med);
        }
    }
}
function mostrarRecordatorioMedicamento(med) {
    if (document.querySelector('.recordatorio-overlay[data-med-id="' + med.id + '"]')) return;
    var overlay = document.createElement('div');
    overlay.className = 'recordatorio-overlay';
    overlay.dataset.medId = med.id;
    overlay.setAttribute('role', 'alertdialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'Recordatorio de medicamento');
    overlay.innerHTML = '<div class="recordatorio-card" style="border-color:#8b5cf6;"><div class="icono">💊</div><div class="titulo">⏰ Hora de tomar ' + med.nombre + '</div><div class="mensaje"><strong>Dosis:</strong> ' + med.dosis + '<br><strong>Horario:</strong> ' + med.horario + '</div><div class="acciones"><button class="accion-btn hecho" onclick="tomarMedicamento('' + med.id + ''); this.closest('.recordatorio-overlay').remove();">✅ Ya lo tomé</button><button class="accion-btn recordar" onclick="this.closest('.recordatorio-overlay').remove(); setTimeout(function() { mostrarRecordatorioMedicamento(medicamentos.find(function(m) { return m.id === '' + med.id + ''; })); }, 10 * 60 * 1000);">⏰ Recordar después</button></div><div class="timer">⏰ Recordatorio de medicación</div></div>';
    document.body.appendChild(overlay);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
    if (config.alertasLuminosas) overlay.style.animation = 'alertPulse 1s infinite';
    hablar('Hora de tomar ' + med.nombre + '. Dosis: ' + med.dosis);
}
setInterval(verificarMedicamentosPendientes, 60000);

// ================== BATERÍA ==================
var alertaBateriaMostrada = false;
function verificarBateria() {
    if ('getBattery' in navigator) {
        navigator.getBattery().then(function(battery) {
            var nivel = battery.level * 100;
            var cargando = battery.charging;
            if (nivel <= 15 && !cargando && !alertaBateriaMostrada) mostrarAlertaBateria(nivel);
            else if (cargando || nivel > 15) ocultarAlertaBateria();
            battery.onlevelchange = function() {
                var nuevoNivel = battery.level * 100;
                if (nuevoNivel <= 15 && !battery.charging && !alertaBateriaMostrada) mostrarAlertaBateria(nuevoNivel);
                else if (battery.charging || nuevoNivel > 15) ocultarAlertaBateria();
            };
            battery.onchargingchange = function() {
                if (battery.charging) ocultarAlertaBateria();
                else if (battery.level * 100 <= 15) mostrarAlertaBateria(battery.level * 100);
            };
        }).catch(function() {});
    }
}
function mostrarAlertaBateria(nivel) {
    alertaBateriaMostrada = true;
    ocultarAlertaBateria();
    var alerta = document.createElement('div');
    alerta.className = 'bateria-alerta';
    alerta.id = 'alerta-bateria';
    alerta.setAttribute('role', 'alert');
    alerta.setAttribute('aria-live', 'assertive');
    alerta.innerHTML = '<span class="icono">🔋</span><span>⚠️ Batería baja: ' + Math.round(nivel) + '% - Conecta el cargador</span><button class="cerrar" onclick="ocultarAlertaBateria()" aria-label="Cerrar alerta de batería">✕</button>';
    document.body.prepend(alerta);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
    hablar('Alerta de batería baja. Nivel: ' + Math.round(nivel) + ' por ciento. Conecta el cargador.');
}
function ocultarAlertaBateria() {
    alertaBateriaMostrada = false;
    var alerta = document.getElementById('alerta-bateria');
    if (alerta) alerta.remove();
}

// ================== RENDERIZADO ==================
function renderScreen() {
    var container = document.getElementById('screen-content');
    var html = '<div class="fade-in">';
    if (currentScreen === 'home') html += renderHome();
    else if (currentScreen === 'devices') html += renderDevices();
    else if (currentScreen === 'routines') html += renderRoutines();
    else if (currentScreen === 'medicamentos') html += renderMedicamentos();
    else if (currentScreen === 'emergency') html += renderEmergency();
    else if (currentScreen === 'settings') html += renderSettings();
    html += '</div>';
    container.innerHTML = html;
    if (modoScanningActivo) setTimeout(iniciarScanning, 300);
}
function getPerfilInfo() {
    var p = [...perfilesActivos][0] || 'motriz';

        for (var i = 0; i < medicamentos.length; i++) {
            var med = medicamentos[i];
            var ahora = new Date();
            var ultima = med.ultimaToma ? new Date(med.ultimaToma) : null;
            var tomadoHoy = ultima && ultima.getDate() === ahora.getDate();
            var partes = med.horario.split(':');
            var h = parseInt(partes[0]), m = parseInt(partes[1]);
            var horaMed = h * 60 + m;
            var horaAct = ahora.getHours() * 60 + ahora.getMinutes();
            var pendiente = !tomadoHoy && horaAct >= horaMed;
            var estado = tomadoHoy ? 'tomado' : (pendiente ? 'pendiente' : 'esperando');
            var estadoLabel = tomadoHoy ? '✅ Tomado' : (pendiente ? '⏰ Pendiente' : '⏳ Esperando');
            var estadoClass = tomadoHoy ? 'tomado' : (pendiente ? 'pendiente' : '');

        }
    }
    html += '<div class="add-med-area"><div class="title">💊 Agregar nuevo medicamento</div><div class="add-med-row"><input type="text" id="med-nombre" placeholder="Nombre" style="flex:2;" aria-label="Nombre del medicamento"><input type="text" id="med-dosis" placeholder="Dosis" style="flex:1;" aria-label="Dosis del medicamento"><select id="med-hora" style="flex:0.8;" aria-label="Hora">';

    return html;

function cambiarConfig(clave, valor) {
    config[clave] = valor;

    hablar(clave === 'volumenVoz' ? 'Volumen al ' + valor + ' por ciento' : clave.replace(/([A-Z])/g, ' $1').toLowerCase() + ' ' + (typeof valor === 'boolean' ? (valor ? 'activado' : 'desactivado') : valor));

// ================== SCANNING ==================
function toggleScanning() {
    modoScanningActivo = !modoScanningActivo;
    if (modoScanningActivo) iniciarScanning();
    else detenerScanning();
    renderScreen();
}
function iniciarScanning() {
    detenerScanning();
    if (!modoScanningActivo) return;
    scanningElementos = document.querySelectorAll('.device-card, .routine-btn, .emergency-btn, .toggle, .tomar-btn, .eliminar-btn, .llamar-btn, .panel-cuidador-btn, .temp-btn');
    if (scanningElementos.length === 0) { setTimeout(iniciarScanning, 500); return; }
    scanningIndice = 0;
    avanzarScanning();
    scanningTimer = setInterval(avanzarScanning, velocidadScanning);
}
function detenerScanning() {
    if (scanningTimer) { clearInterval(scanningTimer); scanningTimer = null; }
    document.querySelectorAll('.scanning-active').forEach(function(el) { el.classList.remove('scanning-active'); });
}
function avanzarScanning() {
    document.querySelectorAll('.scanning-active').forEach(function(el) { el.classList.remove('scanning-active'); });
    if (scanningElementos.length === 0) return;
    var encontrado = false, intentos = 0;
    while (!encontrado && intentos < scanningElementos.length) {
        var el = scanningElementos[scanningIndice];
        if (el && el.offsetParent !== null && !el.disabled) {
            encontrado = true;
            el.classList.add('scanning-active');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate(10);
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        scanningIndice = (scanningIndice + 1) % scanningElementos.length;
        intentos++;
    }
}
document.addEventListener('click', function(e) {
    if (modoScanningActivo) {
        var el = e.target.closest('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(function() { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});
document.addEventListener('keydown', function(e) {
    if ((e.key === ' ' || e.key === 'Enter') && modoScanningActivo) {
        e.preventDefault();
        var el = document.querySelector('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(function() { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

// ================== RUTINAS ==================
function ejecutarRutina(nombre) {
    var mensaje = '';
    switch(nombre) {
        case 'Llegué a casa':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.luz_dormitorio = true;
            deviceStates.luz_dormitorio2 = true; deviceStates.luz_dormitorio3 = true;
            deviceStates.luz_bano = true; deviceStates.luz_comedor = true; deviceStates.luz_estudio = true;
            deviceStates.luz_pasillo = true; deviceStates.luz_patio = true;
            deviceStates.puerta = true; deviceStates.puerta_traba = false;
            deviceStates.termostato = 22; deviceStates.cortinas = 60;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            for (var r = 0; r < dispositivosPersonalizados.length; r++) deviceStates['custom_' + dispositivosPersonalizados[r].id] = true;
            mensaje = 'Bienvenido. Luces encendidas, puerta abierta';
            break;
        case 'Me voy de casa':
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k.startsWith('custom_') || k === 'tv_sala' || k === 'tv_dormitorio' || k === 'aire_sala' || k === 'aire_dormitorio' || k === 'ventilador_sala' || k === 'ventilador_dormitorio') deviceStates[k] = false;
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Casa asegurada, todo apagado';
            break;
        case 'Buenos Días':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.cortinas = 80; deviceStates.termostato = 22;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Buenos días. Luces y cortinas abiertas';
            break;
        case 'Buenas Noches':
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k === 'tv_sala' || k === 'tv_dormitorio' || k.startsWith('custom_')) deviceStates[k] = false;
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0; deviceStates.alarma = true;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Buenas noches. Casa segura';
            break;
        case 'Modo TV':
            deviceStates.modo_tv = !deviceStates.modo_tv;
            if (deviceStates.modo_tv) {
                deviceStates.tv_sala = true; deviceStates.luz_sala = true; deviceStates.luz_cocina = false; deviceStates.cortinas = 30;
                mensaje = 'Modo TV activado';
            } else {
                deviceStates.tv_sala = false; deviceStates.luz_sala = false; deviceStates.luz_cocina = false; deviceStates.cortinas = 50;
                mensaje = 'Modo TV desactivado';
            }
            break;
        case 'Modo Fresco':
            deviceStates.modo_fresco = !deviceStates.modo_fresco;
            if (deviceStates.modo_fresco) {
                deviceStates.aire_sala = true; deviceStates.ventilador_sala = true; deviceStates.termostato = 18;
                mensaje = 'Modo fresco activado';
            } else {
                deviceStates.aire_sala = false; deviceStates.ventilador_sala = false; deviceStates.termostato = 22;
                mensaje = 'Modo fresco desactivado';
            }
            break;
        case 'Modo Cine':
            deviceStates.modo_cine = !deviceStates.modo_cine;
            if (deviceStates.modo_cine) {
                deviceStates.tv_sala = true; deviceStates.luz_sala = false; deviceStates.luz_cocina = false; deviceStates.cortinas = 0;
                mensaje = 'Modo cine activado';
            } else {
                deviceStates.tv_sala = false; deviceStates.luz_sala = true; deviceStates.luz_cocina = false; deviceStates.cortinas = 50;
                mensaje = 'Modo cine desactivado';
            }
            break;
        default: mensaje = 'Rutina ejecutada: ' + nombre;
    }
    guardarDatos(); renderScreen();
    if (mensaje) hablar(mensaje);
}

function abrirPanelCuidador() {
    var modal = document.createElement('div');

    modal.setAttribute('role', 'dialog');

    document.body.appendChild(modal);
}
function generarPanelEstado() {
    var dispositivos = [
        { key: 'luz_sala', icono: '💡', nombre: 'Luz Sala' },
        { key: 'luz_cocina', icono: '💡', nombre: 'Luz Cocina' },
        { key: 'puerta', icono: '🚪', nombre: 'Puerta' },
        { key: 'puerta_traba', icono: '🔒', nombre: 'Traba' },
        { key: 'tv_sala', icono: '📺', nombre: 'TV Sala' },
        { key: 'aire_sala', icono: '❄️', nombre: 'Aire' },
        { key: 'ventilador_sala', icono: '🌀', nombre: 'Ventilador' },
        { key: 'alarma', icono: '🚨', nombre: 'Alarma' }
    ];
    for (var i = 0; i < dispositivosPersonalizados.length; i++) {
        dispositivos.push({ key: 'custom_' + dispositivosPersonalizados[i].id, icono: dispositivosPersonalizados[i].icono || '🔌', nombre: dispositivosPersonalizados[i].nombre });
    }
    var html = '';
    for (var j = 0; j < dispositivos.length; j++) {
        var estado = deviceStates[dispositivos[j].key] || false;
        html += '<div class="panel-estado-item ' + (estado ? 'on' : 'off') + '"><div class="icono">' + dispositivos[j].icono + '</div><div class="nombre">' + dispositivos[j].nombre + '</div><div class="valor">' + (estado ? '✅' : '❌') + '</div></div>';
    }
    html += '<div class="panel-estado-item ' + (deviceStates.termostato > 20 ? 'on' : 'off') + '"><div class="icono">🌡️</div><div class="nombre">Temp</div><div class="valor">' + deviceStates.termostato + '°</div></div>';
    html += '<div class="panel-estado-item ' + (deviceStates.cortinas > 30 ? 'on' : 'off') + '"><div class="icono">🪟</div><div class="nombre">Cortinas</div><div class="valor">' + deviceStates.cortinas + '%</div></div>';
    return html;
}
function generarHistorialPanel() {
    var historial = JSON.parse(localStorage.getItem('historialCuidador') || '[]');
    if (historial.length === 0) return '<div style="color:#64748b;font-size:13px;padding:4px 0;">No hay actividad</div>';
    var html = '';
    for (var i = historial.length - 1; i >= Math.max(0, historial.length - 5); i--) {
        var h = historial[i];
        html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155;font-size:12px;color:#cbd5e1;"><span>' + (h.titulo || 'Actividad') + '</span><span style="color:#64748b;font-size:10px;">' + new Date(h.timestamp).toLocaleTimeString() + '</span></div>';
    }
    return html;
}
function notificarCuidador(titulo, mensaje) {
    var historial = JSON.parse(localStorage.getItem('historialCuidador') || '[]');
    historial.push({ titulo: titulo, mensaje: mensaje, timestamp: new Date().toISOString() });
    localStorage.setItem('historialCuidador', JSON.stringify(historial));
}
