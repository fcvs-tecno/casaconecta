// 12. RUTINAS
// ============================================================
function ejecutarRutina(nombre) {
    var mensaje = '';
    switch(nombre) {
        case 'Llegué a casa':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.luz_dormitorio = true;
            deviceStates.luz_dormitorio2 = true; deviceStates.luz_dormitorio3 = true;
            deviceStates.luz_bano = true; deviceStates.luz_comedor = true; deviceStates.luz_estudio = true;
            deviceStates.luz_pasillo = true; deviceStates.luz_patio = true;
            deviceStates.puerta = true; deviceStates.puerta_traba = false;
            deviceStates.termostato = 22; deviceStates.cortinas = 60;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            for (var r = 0; r < dispositivosPersonalizados.length; r++) deviceStates['custom_' + dispositivosPersonalizados[r].id] = true;
            mensaje = 'Bienvenido. Luces encendidas, puerta abierta';
            break;
        case 'Me voy de casa':
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k.startsWith('custom_') || k === 'tv_sala' || k === 'tv_dormitorio' || k === 'aire_sala' || k === 'aire_dormitorio' || k === 'ventilador_sala' || k === 'ventilador_dormitorio') {
                    deviceStates[k] = false;
                }
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Casa asegurada, todo apagado';
            break;
        case 'Buenos Días':
            deviceStates.luz_sala = true; deviceStates.luz_cocina = true; deviceStates.cortinas = 80; deviceStates.termostato = 22;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Buenos días. Luces y cortinas abiertas';
            break;
        case 'Buenas Noches':
            Object.keys(deviceStates).forEach(function(k) {
                if (k.startsWith('luz_') || k === 'tv_sala' || k === 'tv_dormitorio' || k.startsWith('custom_')) {
                    deviceStates[k] = false;
                }
            });
            deviceStates.puerta = false; deviceStates.puerta_traba = true; deviceStates.cortinas = 0; deviceStates.alarma = true;
            deviceStates.modo_tv = false; deviceStates.modo_fresco = false; deviceStates.modo_cine = false;
            mensaje = 'Buenas noches. Casa segura';
            break;
        case 'Modo TV':
            deviceStates.modo_tv = !deviceStates.modo_tv;
            if (deviceStates.modo_tv) {
                deviceStates.tv_sala = true;
                deviceStates.luz_sala = true;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 30;
                mensaje = 'Modo TV activado';
            } else {
                deviceStates.tv_sala = false;
                deviceStates.luz_sala = false;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 50;
                mensaje = 'Modo TV desactivado';
            }
            break;
        case 'Modo Fresco':
            deviceStates.modo_fresco = !deviceStates.modo_fresco;
            if (deviceStates.modo_fresco) {
                deviceStates.aire_sala = true;
                deviceStates.ventilador_sala = true;
                deviceStates.termostato = 18;
                mensaje = 'Modo fresco activado';
            } else {
                deviceStates.aire_sala = false;
                deviceStates.ventilador_sala = false;
                deviceStates.termostato = 22;
                mensaje = 'Modo fresco desactivado';
            }
            break;
        case 'Modo Cine':
            deviceStates.modo_cine = !deviceStates.modo_cine;
            if (deviceStates.modo_cine) {
                deviceStates.tv_sala = true;
                deviceStates.luz_sala = false;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 0;
                mensaje = 'Modo cine activado';
            } else {
                deviceStates.tv_sala = false;
                deviceStates.luz_sala = true;
                deviceStates.luz_cocina = false;
                deviceStates.cortinas = 50;
                mensaje = 'Modo cine desactivado';
            }
            break;
        default:
            mensaje = 'Rutina ejecutada: ' + nombre;
    }
    guardarDatos();
    renderScreen();
    if (mensaje) hablar(mensaje);
}

function generarPanelEstado() {
    var dispositivos = [
        { key: 'luz_sala', icono: '💡', nombre: 'Luz Sala' },
        { key: 'luz_cocina', icono: '💡', nombre: 'Luz Cocina' },
        { key: 'puerta', icono: '🚪', nombre: 'Puerta' },
        { key: 'puerta_traba', icono: '🔒', nombre: 'Traba' },
        { key: 'tv_sala', icono: '📺', nombre: 'TV Sala' },
        { key: 'aire_sala', icono: '❄️', nombre: 'Aire' },
        { key: 'ventilador_sala', icono: '🌀', nombre: 'Ventilador' },
        { key: 'alarma', icono: '🚨', nombre: 'Alarma' }
    ];
    for (var i = 0; i < dispositivosPersonalizados.length; i++) {
        dispositivos.push({ key: 'custom_' + dispositivosPersonalizados[i].id, icono: dispositivosPersonalizados[i].icono || '🔌', nombre: dispositivosPersonalizados[i].nombre });
    }
    var html = '';
    for (var j = 0; j < dispositivos.length; j++) {
        var estado = deviceStates[dispositivos[j].key] || false;
        html += '<div class="panel-estado-item ' + (estado ? 'on' : 'off') + '"><div class="icono">' + dispositivos[j].icono + '</div><div class="nombre">' + dispositivos[j].nombre + '</div><div class="valor">' + (estado ? '✅' : '❌') + '</div></div>';
    }
    html += '<div class="panel-estado-item ' + (deviceStates.termostato > 20 ? 'on' : 'off') + '"><div class="icono">🌡️</div><div class="nombre">Temp</div><div class="valor">' + deviceStates.termostato + '°</div></div>';
    html += '<div class="panel-estado-item ' + (deviceStates.cortinas > 30 ? 'on' : 'off') + '"><div class="icono">🪟</div><div class="nombre">Cortinas</div><div class="valor">' + deviceStates.cortinas + '%</div></div>';
    return html;
}

function generarHistorialPanel() {
    var historial = JSON.parse(localStorage.getItem('historialCuidador') || '[]');
    if (historial.length === 0) return '<div style="color:#64748b;font-size:13px;padding:4px 0;">No hay actividad</div>';
    var html = '';
    for (var i = historial.length - 1; i >= Math.max(0, historial.length - 5); i--) {
        var h = historial[i];
        html += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155;font-size:12px;color:#cbd5e1;"><span>' + (h.titulo || 'Actividad') + '</span><span style="color:#64748b;font-size:10px;">' + new Date(h.timestamp).toLocaleTimeString() + '</span></div>';
    }
    return html;
}

function notificarCuidador(titulo, mensaje) {
    var historial = JSON.parse(localStorage.getItem('historialCuidador') || '[]');
    historial.push({ titulo: titulo, mensaje: mensaje, timestamp: new Date().toISOString() });
    localStorage.setItem('historialCuidador', JSON.stringify(historial));
}
