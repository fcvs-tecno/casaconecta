<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CasaConecta - Accesible</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0b1120; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 10px; }
.phone { width: 100%; max-width: 420px; background: #0f172a; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #1e293b; }
.header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-icon { width: 38px; height: 38px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.header-title { color: white; font-weight: 700; font-size: 16px; }
.header-sub { color: #bfdbfe; font-size: 10px; }
.header-badge { padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; font-size: 11px; font-weight: 600; }
.nav { background: #1e293b; padding: 8px 12px; display: flex; gap: 5px; overflow-x: auto; border-bottom: 1px solid #334155; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn { padding: 6px 12px; border-radius: 8px; border: none; background: #334155; color: #94a3b8; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
.nav-btn.active { background: #3b82f6; color: white; }
.screen { padding: 16px; min-height: 350px; }

.profile-bar { padding: 0 16px 16px; }
.profile-box { background: #1e293b; border-radius: 14px; padding: 12px; }
.profile-label { color: #94a3b8; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.profile-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.profile-btn { flex: 1; min-width: 60px; padding: 8px 6px 8px 28px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #64748b; font-weight: 600; font-size: 11px; cursor: pointer; font-family: inherit; position: relative; transition: all 0.3s; }
.profile-btn .check-indicator { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid #64748b; border-radius: 4px; display: inline-block; transition: all 0.3s; }
.profile-btn.active .check-indicator { background: #3b82f6; border-color: #3b82f6; }
.profile-btn.active .check-indicator::after { content: '✓'; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
.profile-btn.active { border-color: #3b82f6; background: #1e293b; color: white; }

.welcome-card { border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid; }
.welcome-card.motriz { background: #1e1b4b40; border-color: #3949ab60; }
.welcome-card.auditiva { background: #1a2e0a40; border-color: #7cb34260; }
.welcome-card.visual { background: #2a1a0040; border-color: #fb8c0060; }
.welcome-card.mental { background: #2a0a2e40; border-color: #8e24aa60; }
.welcome-title { font-size: 20px; margin-bottom: 4px; }
.welcome-desc { font-size: 13px; opacity: 0.85; }
.welcome-hint { margin-top: 8px; padding: 6px 10px; background: #0f172a; border-radius: 8px; font-size: 11px; color: #94a3b8; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.device-card { border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; border: 2px solid; font-family: inherit; background: transparent; color: inherit; width: 100%; transition: all 0.3s; }
.device-card .emoji { font-size: 32px; margin-bottom: 4px; display: block; }
.device-card .label { font-weight: 700; font-size: 13px; }
.device-card .status { font-size: 10px; margin-top: 3px; }
.device-card .hint { font-size: 9px; margin-top: 3px; color: #64748b; }
.device-card.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.off .status { color: #64748b; }
.device-card.on-motriz { background: #1e1b4b; border-color: #3949ab; color: #818cf8; }
.device-card.on-motriz .status { color: #4ade80; }
.device-card.on-auditiva { background: #1a2e0a; border-color: #7cb342; color: #a5d6a7; }
.device-card.on-auditiva .status { color: #4ade80; }
.device-card.on-visual { background: #2a1a00; border-color: #fb8c00; color: #ffcc80; }
.device-card.on-visual .status { color: #4ade80; }
.device-card.on-mental { background: #2a0a2e; border-color: #8e24aa; color: #ce93d8; }
.device-card.on-mental .status { color: #4ade80; }
.device-card.on-motriz.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.on-auditiva.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.on-visual.off { background: #1e293b; border-color: #334155; color: #94a3b8; }
.device-card.on-mental.off { background: #1e293b; border-color: #334155; color: #94a3b8; }

.temp-controls { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.temp-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; cursor: pointer; font-size: 16px; font-family: inherit; }

.routine-btn { padding: 14px 10px; border-radius: 14px; border: 2px solid; cursor: pointer; text-align: center; font-family: inherit; background: transparent; transition: all 0.3s; }
.routine-btn .emoji { font-size: 28px; margin-bottom: 4px; display: block; }
.routine-btn .name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.routine-btn .desc { font-size: 10px; opacity: 0.8; }

.device-row { background: #1e293b; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.device-row .emoji { font-size: 24px; width: 32px; text-align: center; }
.device-row .info { flex: 1; }
.device-row .name { font-weight: 600; font-size: 14px; }
.device-row .room { font-size: 11px; color: #64748b; }
.device-row .toggle { width: 48px; height: 26px; border-radius: 13px; border: none; cursor: pointer; position: relative; }
.device-row .toggle .knob { width: 22px; height: 22px; border-radius: 50%; background: white; position: absolute; top: 2px; transition: all 0.3s; }
.device-row .toggle.on .knob { right: 2px; }
.device-row .toggle.off .knob { left: 2px; }

.screen-title { color: white; font-size: 16px; font-weight: 700; margin-bottom: 14px; }

.fade-in { animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="phone">
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">🏠</div>
            <div><div class="header-title">CasaConecta</div><div class="header-sub">Accesible</div></div>
        </div>
        <div class="header-badge">🔊</div>
    </div>
    <div class="nav">
        <button class="nav-btn active" onclick="navTo('home')" id="nav-home">🏠 Inicio</button>
        <button class="nav-btn" onclick="navTo('devices')" id="nav-devices">🔌 Disp.</button>
        <button class="nav-btn" onclick="navTo('routines')" id="nav-routines">⚡ Rutinas</button>
        <button class="nav-btn" onclick="navTo('medicamentos')" id="nav-medicamentos">💊 Meds</button>
        <button class="nav-btn" onclick="navTo('emergency')" id="nav-emergency">🆘 SOS</button>
        <button class="nav-btn" onclick="navTo('settings')" id="nav-settings">⚙️</button>
    </div>
    <div class="screen" id="screen-content"></div>
    <div class="profile-bar">
        <div class="profile-box">
            <div class="profile-label">Perfil de Accesibilidad</div>
            <div class="profile-btns">
                <button class="profile-btn active" data-perfil="motriz" onclick="togglePerfil('motriz')">🦽 Motriz <span class="check-indicator"></span></button>
                <button class="profile-btn" data-perfil="auditiva" onclick="togglePerfil('auditiva')">👂 Auditiva <span class="check-indicator"></span></button>
                <button class="profile-btn" data-perfil="visual" onclick="togglePerfil('visual')">👁️ Visual <span class="check-indicator"></span></button>
                <button class="profile-btn" data-perfil="mental" onclick="togglePerfil('mental')">🧠 Cognitiva <span class="check-indicator"></span></button>
            </div>
        </div>
    </div>
</div>

<script>
var deviceStates = { 
    luz_sala: true, luz_cocina: false, luz_dormitorio: true, 
    puerta: false, termostato: 22, puerta_traba: true,
    tv_sala: false, aire_sala: false, ventilador_sala: false
};

var config = {
    volumenVoz: 80,
    vibracionActiva: true
};

var currentScreen = 'home';
var perfilesActivos = new Set(['motriz']);

function hablar(texto) {
    if (!texto || texto.trim() === '') return;
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    setTimeout(function() {
        var utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        utterance.rate = 0.85;
        utterance.volume = config.volumenVoz / 100;
        window.speechSynthesis.speak(utterance);
    }, 100);
}

function navTo(screen) {
    currentScreen = screen;
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
    var btn = document.getElementById('nav-' + screen);
    if (btn) btn.classList.add('active');
    renderScreen();
    hablar('Pantalla ' + screen);
}

function toggleDevice(key) {
    if (key in deviceStates) {
        deviceStates[key] = !deviceStates[key];
        renderScreen();
        var estado = deviceStates[key] ? 'encendido' : 'apagado';
        var nombre = key.replace(/_/g, ' ');
        hablar(estado + ' ' + nombre);
    }
}

function adjustTemp(delta) {
    deviceStates.termostato = Math.max(10, Math.min(35, deviceStates.termostato + delta));
    renderScreen();
    hablar('Temperatura ajustada a ' + deviceStates.termostato + ' grados');
}

function togglePerfil(perfil) {
    if (perfilesActivos.has(perfil)) {
        perfilesActivos.delete(perfil);
        if (perfilesActivos.size === 0) perfilesActivos.add('motriz');
    } else {
        perfilesActivos.add(perfil);
    }
    aplicarPerfiles();
    renderScreen();
}

function aplicarPerfiles() {
    document.querySelectorAll('.profile-btn').forEach(function(btn) {
        var p = btn.dataset.perfil;
        btn.classList.toggle('active', perfilesActivos.has(p));
    });
}

function getPerfilInfo() {
    var p = [...perfilesActivos][0] || 'motriz';
    var profiles = {
        motriz: { color: '#818cf8', border: '#3949ab', label: '🦽 Motriz', desc: 'Botones grandes' },
        auditiva: { color: '#a5d6a7', border: '#7cb342', label: '👂 Auditiva', desc: 'Alertas visuales' },
        visual: { color: '#ffcc80', border: '#fb8c00', label: '👁️ Visual', desc: 'Alto contraste' },
        mental: { color: '#ce93d8', border: '#8e24aa', label: '🧠 Cognitiva', desc: 'Iconos grandes' }
    };
    return profiles[p] || profiles.motriz;
}

function ejecutarRutina(nombre) {
    var mensaje = '';
    if (nombre === 'Llegué a casa') {
        deviceStates.luz_sala = true;
        deviceStates.luz_cocina = true;
        deviceStates.luz_dormitorio = true;
        deviceStates.puerta = true;
        deviceStates.puerta_traba = false;
        mensaje = 'Bienvenido. Luces encendidas, puerta abierta';
    } else if (nombre === 'Me voy de casa') {
        deviceStates.luz_sala = false;
        deviceStates.luz_cocina = false;
        deviceStates.luz_dormitorio = false;
        deviceStates.puerta = false;
        deviceStates.puerta_traba = true;
        mensaje = 'Casa asegurada, todo apagado';
    }
    renderScreen();
    if (mensaje) hablar(mensaje);
}

function renderScreen() {
    var container = document.getElementById('screen-content');
    var html = '<div class="fade-in">';
    if (currentScreen === 'home') html += renderHome();
    else if (currentScreen === 'devices') html += renderDevices();
    else if (currentScreen === 'routines') html += renderRoutines();
    else if (currentScreen === 'medicamentos') html += renderMedicamentos();
    else if (currentScreen === 'emergency') html += renderEmergency();
    else if (currentScreen === 'settings') html += renderSettings();
    html += '</div>';
    container.innerHTML = html;
}

function renderHome() {
    var p = [...perfilesActivos][0] || 'motriz';
    var prof = getPerfilInfo();
    var html = '<div class="welcome-card ' + p + '"><div class="welcome-title">👋 ¡Hola!</div><div class="welcome-desc">' + prof.desc + '</div><div class="welcome-hint">🔊 Toca los botones, la app te responderá con voz</div></div>';
    html += '<div class="grid-2" style="margin-bottom:12px;">';
    html += '<button class="device-card ' + (deviceStates.luz_sala ? 'on-' + p : 'off') + '" onclick="ejecutarRutina(\'Llegué a casa\')" style="border-color:#4ade80;background:#4ade8020;color:#4ade80;"><span class="emoji">🏠</span><div class="label">Llegué a casa</div><div class="status">Encender luces + abrir</div></button>';
    html += '<button class="device-card off" onclick="ejecutarRutina(\'Me voy de casa\')" style="border-color:#ef4444;background:#ef444420;color:#ef4444;"><span class="emoji">🚶</span><div class="label">Me voy de casa</div><div class="status">Apagar todo + cerrar</div></button>';
    html += '</div>';
    html += '<div class="grid-2">';
    var items = [
        { key: 'luz_sala', icon: '💡', label: 'Luz Sala' },
        { key: 'luz_cocina', icon: '🍳', label: 'Luz Cocina' },
        { key: 'puerta', icon: '🚪', label: 'Puerta' },
        { key: 'puerta_traba', icon: '🔒', label: 'Traba Puerta' },
        { key: 'tv_sala', icon: '📺', label: 'TV Sala' },
        { key: 'aire_sala', icon: '❄️', label: 'Aire Sala' },
        { key: 'ventilador_sala', icon: '🌀', label: 'Ventilador' },
        { key: 'termostato', icon: '🌡️', label: 'Temp: ' + deviceStates.termostato + '°C', special: 'temp' }
    ];
    for (var i = 0; i < items.length; i++) {
        var item = items[i];
        if (item.special === 'temp') {
            html += '<div class="device-card off"><span class="emoji">' + item.icon + '</span><div class="label">' + item.label + '</div><div class="temp-controls"><button class="temp-btn" onclick="adjustTemp(-1)">−</button><button class="temp-btn" onclick="adjustTemp(1)">+</button></div></div>';
        } else {
            var isOn = deviceStates[item.key] || false;
            var cls = isOn ? 'on-' + p : 'off';
            var status = isOn ? '● ENCENDIDO' : '○ APAGADO';
            html += '<button class="device-card ' + cls + '" onclick="toggleDevice(\'' + item.key + '\')"><span class="emoji">' + item.icon + '</span><div class="label">' + item.label + '</div><div class="status">' + status + '</div></button>';
        }
    }
    html += '</div>';
    return html;
}

function renderDevices() {
    var p = [...perfilesActivos][0] || 'motriz';
    var prof = getPerfilInfo();
    var html = '<div class="screen-title">🔌 Mis Dispositivos</div>';
    var devices = [
        { key: 'luz_sala', icon: '💡', name: 'Luz Sala', room: 'Sala' },
        { key: 'luz_cocina', icon: '🍳', name: 'Luz Cocina', room: 'Cocina' },
        { key: 'luz_dormitorio', icon: '🛏️', name: 'Luz Dormitorio', room: 'Dormitorio' },
        { key: 'puerta', icon: '🚪', name: 'Puerta', room: 'Entrada' },
        { key: 'puerta_traba', icon: '🔒', name: 'Traba Puerta', room: 'Entrada' },
        { key: 'tv_sala', icon: '📺', name: 'TV Sala', room: 'Sala' },
        { key: 'aire_sala', icon: '❄️', name: 'Aire Acondicionado', room: 'Sala' },
        { key: 'ventilador_sala', icon: '🌀', name: 'Ventilador', room: 'Sala' },
        { key: 'termostato', icon: '🌡️', name: 'Termostato', room: 'General', special: 'temp' }
    ];
    for (var i = 0; i < devices.length; i++) {
        var dev = devices[i];
        var isOn = deviceStates[dev.key] || false;
        var nameColor = isOn ? prof.color : '#94a3b8';
        html += '<div class="device-row"><div class="emoji">' + dev.icon + '</div><div class="info"><div class="name" style="color:' + nameColor + '">' + dev.name + '</div><div class="room">' + dev.room + '</div></div>';
        if (dev.special === 'temp') {
            html += '<div class="temp-controls"><button class="temp-btn" onclick="adjustTemp(-1)">−</button><span style="color:white;font-weight:700;min-width:28px;text-align:center;">' + deviceStates.termostato + '°</span><button class="temp-btn" onclick="adjustTemp(1)">+</button></div>';
        } else {
            var toggleBg = isOn ? prof.border : '#334155';
            html += '<button class="toggle ' + (isOn ? 'on' : 'off') + '" onclick="toggleDevice(\'' + dev.key + '\')" style="background:' + toggleBg + '"><div class="knob"></div></button>';
        }
        html += '</div>';
    }
    return html;
}

function renderRoutines() {
    var p = [...perfilesActivos][0] || 'motriz';
    var html = '<div class="screen-title">⚡ Rutinas y Escenas</div><div class="grid-2">';
    var routines = [
        { icon: '🏠', name: 'Llegué a casa', desc: 'Luces + Abrir puerta', color: '#4ade80' },
        { icon: '🚶', name: 'Me voy de casa', desc: 'Apagar todo + Cerrar', color: '#ef4444' },
        { icon: '☀️', name: 'Buenos Días', desc: 'Luces + Clima', color: '#fbbf24' },
        { icon: '🌙', name: 'Buenas Noches', desc: 'Apagar + Cerrar', color: '#a78bfa' },
        { icon: '📺', name: 'Modo TV', desc: 'TV + Luces tenues', color: '#60a5fa' },
        { icon: '❄️', name: 'Modo Fresco', desc: 'Aire + Ventilador', color: '#38bdf8' },
        { icon: '🎬', name: 'Modo Cine', desc: 'TV + Cortinas', color: '#8b5cf6' },
        { icon: '💊', name: 'Ver Medicamentos', desc: 'Gestionar medicación', color: '#fb923c' }
    ];
    for (var i = 0; i < routines.length; i++) {
        var r = routines[i];
        html += '<button class="routine-btn" style="border-color:' + r.color + '40;background:' + r.color + '15;color:' + r.color + ';" onclick="if(\'' + r.name + '\'===\'Ver Medicamentos\'){navTo(\'medicamentos\');}else{ejecutarRutina(\'' + r.name + '\');}"><span class="emoji">' + r.icon + '</span><div class="name">' + r.name + '</div><div class="desc">' + r.desc + '</div></button>';
    }
    html += '</div>';
    return html;
}

function renderMedicamentos() {
    var html = '<div class="screen-title">💊 Gestión de Medicamentos</div>';
    html += '<div style="background:#1e293b;border-radius:12px;padding:20px;text-align:center;color:#94a3b8;"><div style="font-size:48px;margin-bottom:8px;">💊</div><p>No tienes medicamentos configurados</p></div>';
    return html;
}

function renderEmergency() {
    var html = '<div class="screen-title">🆘 Centro de Emergencia</div>';
    html += '<button class="emergency-btn" onclick="hablar(\'Emergencia activada\')" style="width:100%;padding:20px;border-radius:14px;border:2px solid #ef4444;background:#ef444420;color:#ef4444;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;"><span style="font-size:28px;">🚨</span> BOTÓN DE EMERGENCIA</button>';
    html += '<div style="background:#1e293b;border-radius:12px;padding:16px;text-align:center;color:#94a3b8;"><div style="font-size:32px;margin-bottom:8px;">👤</div><p>No hay contactos de emergencia</p></div>';
    return html;
}

function renderSettings() {
    var prof = getPerfilInfo();
    var html = '<div class="screen-title">⚙️ Configuración</div>';
    html += '<div class="device-row"><div style="font-size:20px;width:28px;text-align:center;">🔊</div><div style="flex:1;color:#e2e8f0;font-weight:500;font-size:13px;">Volumen de Voz</div><div style="color:#818cf8;font-size:12px;font-weight:600;">' + config.volumenVoz + '%</div></div>';
    html += '<div class="device-row"><div style="font-size:20px;width:28px;text-align:center;">📳</div><div style="flex:1;color:#e2e8f0;font-weight:500;font-size:13px;">Vibración</div><div style="color:#818cf8;font-size:12px;font-weight:600;">' + (config.vibracionActiva ? '✅ Activo' : '❌ Inactivo') + '</div></div>';
    return html;
}

aplicarPerfiles();
renderScreen();
console.log('🏠 CasaConecta Accesible cargada');
</script>
</body>
</html>
