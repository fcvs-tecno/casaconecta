<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f97316">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CasaConecta - Accesible</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0c0a09; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 10px; }
.phone { width: 100%; max-width: 420px; background: #1c1917; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #292524; position: relative; }
.header { background: linear-gradient(135deg, #9a3412, #f97316); padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; }
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-icon { width: 38px; height: 38px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.header-title { color: white; font-weight: 700; font-size: 16px; }
.header-sub { color: #bfdbfe; font-size: 10px; }
.header-badge { padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,0.2); color: white; font-size: 11px; font-weight: 600; }
.nav { background: #292524; padding: 8px 12px; display: flex; gap: 5px; overflow-x: auto; border-bottom: 1px solid #44403c; }
.nav::-webkit-scrollbar { display: none; }
.nav-btn { padding: 6px 12px; border-radius: 8px; border: none; background: #44403c; color: #a8a29e; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
.nav-btn.active { background: #3b82f6; color: white; }
#nav-home.active { background: #f97316; }
#nav-salas.active { background: #14b8a6; }
#nav-devices.active { background: #3b82f6; }
#nav-aac.active { background: #ec4899; }
#nav-routines.active { background: #a78bfa; }
#nav-medicamentos.active { background: #22c55e; }
#nav-emergency.active { background: #ef4444; }
#nav-settings.active { background: #78716c; }
.screen { padding: 16px; min-height: 350px; }

.profile-bar { padding: 0 16px 16px; }
.profile-box { background: #292524; border-radius: 14px; padding: 12px; }
.profile-label { color: #a8a29e; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.profile-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.profile-btn { flex: 1; min-width: 60px; padding: 8px 6px 8px 28px; border-radius: 10px; border: 2px solid #44403c; background: #1c1917; color: #78716c; font-weight: 600; font-size: 11px; cursor: pointer; font-family: inherit; position: relative; transition: all 0.3s; }
.profile-btn .check-indicator { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid #78716c; border-radius: 4px; display: inline-block; transition: all 0.3s; }
.profile-btn.active .check-indicator { background: #3b82f6; border-color: #3b82f6; }
.profile-btn.active .check-indicator::after { content: 'âœ“'; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
.profile-btn.active { border-color: #3b82f6; background: #292524; color: white; }

.welcome-card { border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid; }
.welcome-card.motriz { background: #1e1b4b40; border-color: #3949ab60; }
.welcome-card.auditiva { background: #1a2e0a40; border-color: #7cb34260; }
.welcome-card.visual { background: #2a1a0040; border-color: #fb8c0060; }
.welcome-card.mental { background: #2a0a2e40; border-color: #8e24aa60; }
.welcome-title { font-size: 20px; margin-bottom: 4px; }
.welcome-desc { font-size: 13px; opacity: 0.85; }
.welcome-hint { margin-top: 8px; padding: 6px 10px; background: #1c1917; border-radius: 8px; font-size: 11px; color: #a8a29e; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.device-card { border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; border: 2px solid; font-family: inherit; background: transparent; color: inherit; width: 100%; transition: all 0.3s; }
.device-card .emoji { font-size: 32px; margin-bottom: 4px; display: block; }
.device-card .label { font-weight: 700; font-size: 13px; }
.device-card .status { font-size: 10px; margin-top: 3px; }
.device-card .hint { font-size: 9px; margin-top: 3px; color: #78716c; }
.device-card.off { background: #292524; border-color: #44403c; color: #a8a29e; }
.device-card.off .status { color: #78716c; }
.device-card.on-motriz { background: #1e1b4b; border-color: #3949ab; color: #818cf8; }
.device-card.on-motriz .status { color: #4ade80; }
.device-card.on-auditiva { background: #1a2e0a; border-color: #7cb342; color: #a5d6a7; }
.device-card.on-auditiva .status { color: #4ade80; }
.device-card.on-visual { background: #2a1a00; border-color: #fb8c00; color: #ffcc80; }
.device-card.on-visual .status { color: #4ade80; }
.device-card.on-mental { background: #2a0a2e; border-color: #8e24aa; color: #ce93d8; }
.device-card.on-motriz.off { background: #292524; border-color: #44403c; color: #a8a29e; }
.device-card.on-auditiva.off { background: #292524; border-color: #44403c; color: #a8a29e; }
.device-card.on-visual.off { background: #292524; border-color: #44403c; color: #a8a29e; }
.device-card.on-mental.off { background: #292524; border-color: #44403c; color: #a8a29e; }

/* ESTADO ACTIVO PARA MODOS */
.device-card.modo-activo {
    border-color: #4ade80 !important;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
    animation: modoPulse 2s infinite;
}
@keyframes modoPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); }
    50% { box-shadow: 0 0 40px rgba(74, 222, 128, 0.4); }
}

.temp-controls { display: flex; justify-content: center; gap: 12px; margin-top: 6px; }
.temp-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #44403c; background: #1c1917; color: white; cursor: pointer; font-size: 16px; font-family: inherit; }

.routine-btn { padding: 14px 10px; border-radius: 14px; border: 2px solid; cursor: pointer; text-align: center; font-family: inherit; background: transparent; transition: all 0.3s; }
.routine-btn .emoji { font-size: 28px; margin-bottom: 4px; display: block; }
.routine-btn .name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.routine-btn .desc { font-size: 10px; opacity: 0.8; }
.routine-btn.modo-activo {
    border-color: #4ade80 !important;
    background: #4ade8020 !important;
    color: #4ade80 !important;
}

.device-row { background: #292524; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.device-row .emoji { font-size: 24px; width: 32px; text-align: center; }
.device-row .info { flex: 1; }
.device-row .name { font-weight: 600; font-size: 14px; }
.device-row .room { font-size: 11px; color: #78716c; }
.device-row .toggle { width: 48px; height: 26px; border-radius: 13px; border: none; cursor: pointer; position: relative; }
.device-row .toggle .knob { width: 22px; height: 22px; border-radius: 50%; background: white; position: absolute; top: 2px; transition: all 0.3s; }
.device-row .toggle.on .knob { right: 2px; }
.device-row .toggle.off .knob { left: 2px; }
.device-row .delete-btn { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-family: inherit; }
.device-row .delete-btn:hover { background: #ef444420; }

.add-device-area { background: #292524; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #44403c; }
.add-device-area .title { color: #a8a29e; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-device-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-device-row input, .add-device-row select { flex: 1; min-width: 80px; padding: 10px 12px; border-radius: 8px; border: 2px solid #44403c; background: #1c1917; color: white; font-family: inherit; font-size: 13px; }
.add-device-row input:focus, .add-device-row select:focus { border-color: #3b82f6; outline: none; }
.add-device-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-device-row button:hover { background: #2563eb; }

.medicamento-card { background: #292524; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
.medicamento-card .header { display: flex; justify-content: space-between; align-items: center; padding: 0; background: transparent; }
.medicamento-card .nombre { font-size: 16px; font-weight: 700; color: white; }
.medicamento-card .dosis { font-size: 13px; color: #a8a29e; }
.medicamento-card .horario { font-size: 14px; color: #4ade80; font-weight: 600; }
.medicamento-card .estado { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.medicamento-card .estado.pendiente { background: #fbbf2420; color: #fbbf24; }
.medicamento-card .estado.tomado { background: #4ade8020; color: #4ade80; }
.medicamento-card .estado.faltado { background: #ef444420; color: #ef4444; }
.medicamento-card .acciones { display: flex; gap: 12px; margin-top: 8px; }
.medicamento-card .acciones button { padding: 6px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 12px; }
.medicamento-card .acciones .tomar-btn { background: #4ade80; color: #1c1917; }
.medicamento-card .acciones .tomar-btn:hover { background: #22c55e; }
.medicamento-card .acciones .eliminar-btn { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
.medicamento-card .acciones .eliminar-btn:hover { background: #ef444440; }

.add-med-area { background: #292524; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #8b5cf6; }
.add-med-area .title { color: #a8a29e; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-med-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-med-row input, .add-med-row select { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: 8px; border: 2px solid #44403c; background: #1c1917; color: white; font-family: inherit; font-size: 13px; }
.add-med-row input:focus, .add-med-row select:focus { border-color: #8b5cf6; outline: none; }
.add-med-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #8b5cf6; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-med-row button:hover { background: #7c3aed; }

.contacto-card { background: #292524; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #ef4444; }
.contacto-card .header { display: flex; justify-content: space-between; align-items: center; padding: 0; background: transparent; }
.contacto-card .nombre { font-size: 16px; font-weight: 700; color: white; }
.contacto-card .telefono { font-size: 14px; color: #a8a29e; }
.contacto-card .relacion { font-size: 12px; color: #4ade80; }
.contacto-card .acciones { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.contacto-card .acciones button { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; }
.contacto-card .acciones .llamar-btn { background: #22c55e; color: white; }
.contacto-card .acciones .llamar-btn:hover { background: #16a34a; }
.contacto-card .acciones .sms-btn { background: #3b82f6; color: white; }
.contacto-card .acciones .sms-btn:hover { background: #2563eb; }
.contacto-card .acciones .eliminar-btn { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
.contacto-card .acciones .eliminar-btn:hover { background: #ef444440; }

.add-contacto-area { background: #292524; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 2px dashed #ef4444; }
.add-contacto-area .title { color: #a8a29e; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
.add-contacto-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-contacto-row input, .add-contacto-row select { flex: 1; min-width: 70px; padding: 10px 12px; border-radius: 8px; border: 2px solid #44403c; background: #1c1917; color: white; font-family: inherit; font-size: 13px; }
.add-contacto-row input:focus, .add-contacto-row select:focus { border-color: #ef4444; outline: none; }
.add-contacto-row button { padding: 10px 20px; border-radius: 8px; border: none; background: #ef4444; color: white; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 13px; }
.add-contacto-row button:hover { background: #dc2626; }

.emergency-btn { width: 100%; padding: 20px; border-radius: 14px; border: 2px solid #ef4444; background: #ef444420; color: #ef4444; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
.emergency-btn .emoji { font-size: 28px; }

.setting-row { background: #292524; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.setting-row .emoji { font-size: 20px; width: 28px; text-align: center; }
.setting-row .label { flex: 1; color: #e2e8f0; font-weight: 500; font-size: 13px; }
.setting-row .value { color: #818cf8; font-size: 12px; font-weight: 600; }
.setting-toggle { width: 44px; height: 24px; border-radius: 12px; border: none; cursor: pointer; position: relative; }
.setting-toggle .knob { width: 18px; height: 18px; border-radius: 50%; background: white; position: absolute; top: 3px; transition: all 0.3s; }
.setting-toggle.on .knob { right: 3px; }
.setting-toggle.off .knob { left: 3px; }

.screen-title { color: white; font-size: 16px; font-weight: 700; margin-bottom: 14px; padding-left: 10px; border-left: 4px solid #3b82f6; }
body[data-screen="home"] .screen-title { border-left-color: #f97316; }
body[data-screen="salas"] .screen-title { border-left-color: #14b8a6; }
body[data-screen="devices"] .screen-title { border-left-color: #3b82f6; }
body[data-screen="aac"] .screen-title { border-left-color: #ec4899; }
body[data-screen="routines"] .screen-title { border-left-color: #a78bfa; }
body[data-screen="medicamentos"] .screen-title { border-left-color: #22c55e; }
body[data-screen="emergency"] .screen-title { border-left-color: #ef4444; }
body[data-screen="settings"] .screen-title { border-left-color: #78716c; }
.history-box { margin-top: 14px; background: #292524; border-radius: 10px; padding: 14px; }
.history-title { color: #a8a29e; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.history-item { display: flex; justify-content: space-between; color: #cbd5e1; font-size: 12px; padding: 5px 0; border-bottom: 1px solid #44403c; }
.history-item:last-child { border-bottom: none; }
.history-time { color: #78716c; }

.modo-scanning .device-card, .modo-scanning .routine-btn { cursor: pointer; transition: all 0.3s; }
.scanning-active { animation: scanningPulse 0.8s ease-in-out infinite; border-color: #3b82f6 !important; box-shadow: 0 0 30px rgba(59, 130, 246, 0.6) !important; transform: scale(1.05); z-index: 100; position: relative; }
@keyframes scanningPulse { 0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); } 50% { box-shadow: 0 0 60px rgba(59, 130, 246, 0.8); } }
.scanning-confirmado { animation: confirmPulse 0.5s ease; border-color: #4ade80 !important; box-shadow: 0 0 40px rgba(74, 222, 128, 0.6) !important; }
@keyframes confirmPulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
.control-scanning { padding: 12px 16px; background: #292524; border-radius: 12px; margin-bottom: 14px; border: 2px solid #3b82f6; }
.scanning-status { display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 12px; }
.scanning-status.inactivo { background: #7f1d1d; color: #fca5a5; }
.scanning-status.activo { background: #14532d; color: #86efac; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-10px); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes alertPulse { 0%, 100% { background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; } 50% { background-color: rgba(239, 68, 68, 0.6); border-color: #fca5a5; } }
.fade-in { animation: fadeIn 0.25s ease; }

.bateria-alerta { position: fixed; top: 0; left: 0; right: 0; background: #7f1d1d; color: #fca5a5; padding: 12px 16px; text-align: center; font-weight: 700; font-size: 16px; z-index: 99999; animation: alertPulse 1s infinite; border-bottom: 3px solid #ef4444; display: flex; align-items: center; justify-content: center; gap: 12px; }
.bateria-alerta .icono { font-size: 24px; }
.bateria-alerta .cerrar { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px 8px; font-family: inherit; }
.bateria-alerta .cerrar:hover { background: rgba(255,255,255,0.1); border-radius: 4px; }

.recordatorio-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.3s ease; padding: 20px; }
.recordatorio-card { background: #292524; border-radius: 24px; padding: 30px 24px; max-width: 500px; width: 100%; text-align: center; border: 2px solid #3b82f6; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
.recordatorio-card .icono { font-size: 60px; margin-bottom: 12px; }
.recordatorio-card .titulo { color: white; font-size: 24px; margin-bottom: 8px; }
.recordatorio-card .mensaje { color: #cbd5e1; font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
.recordatorio-card .acciones { display: flex; flex-direction: column; gap: 10px; }
.recordatorio-card .accion-btn { padding: 16px 24px; border-radius: 12px; border: 2px solid; background: transparent; color: white; font-size: 20px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-family: inherit; }
.recordatorio-card .accion-btn:hover { opacity: 0.8; transform: scale(1.02); }
.recordatorio-card .accion-btn.hecho { border-color: #4ade80; background: #4ade8020; color: #4ade80; }
.recordatorio-card .accion-btn.recordar { border-color: #fbbf24; background: #fbbf2420; color: #fbbf24; }
.recordatorio-card .timer { color: #78716c; font-size: 14px; margin-top: 12px; }

.notificacion-flotante { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #292524; padding: 12px 24px; border-radius: 12px; border: 2px solid #4ade80; color: white; font-size: 16px; font-weight: 600; z-index: 10000; animation: slideDown 0.5s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.5); pointer-events: none; }
.notificacion-flotante.error { border-color: #ef4444; background: #7f1d1d; }
.notificacion-flotante.warning { border-color: #fbbf24; background: #78350f; }

.panel-cuidador-btn { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #8b5cf6; background: #8b5cf620; color: #c4b5fd; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 12px; transition: all 0.3s; }
.panel-cuidador-btn:hover { background: #8b5cf640; }

.panel-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s ease; }
.panel-modal-content { background: #1c1917; border-radius: 24px; padding: 24px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; border: 2px solid #8b5cf6; }
.panel-modal-content .close-btn { float: right; background: none; border: none; color: #a8a29e; font-size: 24px; cursor: pointer; font-family: inherit; }
.panel-modal-content h2 { color: white; margin-bottom: 12px; font-size: 20px; }
.panel-estado-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.panel-estado-item { background: #292524; padding: 10px; border-radius: 10px; text-align: center; border: 2px solid #44403c; }
.panel-estado-item .icono { font-size: 24px; }
.panel-estado-item .nombre { font-size: 11px; color: #a8a29e; }
.panel-estado-item .valor { font-size: 14px; font-weight: 700; }
.panel-estado-item.on { border-color: #4ade80; }
.panel-estado-item.off { border-color: #ef4444; }

.config-control { display: flex; align-items: center; gap: 10px; }
.config-control input[type="range"] { flex: 1; accent-color: #3b82f6; }
.config-control select { background: #1c1917; color: white; border: 2px solid #44403c; border-radius: 6px; padding: 6px 10px; font-family: inherit; font-size: 13px; }
.config-value { min-width: 45px; text-align: right; color: #818cf8; font-weight: 600; font-size: 13px; }

var subtitulosHistorial = [];
function registrarSubtitulo(texto) {
    var hora = new Date();
    var horaStr = ('0' + hora.getHours()).slice(-2) + ':' + ('0' + hora.getMinutes()).slice(-2);
    subtitulosHistorial.unshift({ texto: texto, hora: horaStr });

    var panel = document.getElementById('subtitulos-panel');

        panel.classList.add('oculto');

    panel.classList.remove('oculto');
    var html = '<div class="subtitulos-panel-header"><span>ðŸ’¬ Lo que dijo la app</span></div>';

function hablar(texto, alTerminar) {
    if (!texto || texto.trim() === '') { if (alTerminar) alTerminar(); return; }
    registrarSubtitulo(texto);
    if (!window.speechSynthesis) { if (alTerminar) alTerminar(); return; }

    window.speechSynthesis.cancel();

    // Si el micrÃ³fono estÃ¡ escuchando, lo pausamos mientras la app habla:

    var debiaEstarEscuchando = (typeof escuchandoVoz !== 'undefined') && escuchandoVoz;

    setTimeout(function() {
        var utterance = new SpeechSynthesisUtterance(texto);

        utterance.volume = config.volumenVoz / 100;

            if (yaResuelto) return;

// FunciÃ³n auxiliar para esperar a que HA se conecte
function esperarConexionHA() {
    return new Promise((resolve, reject) => {
        const maxIntents = 30; // 30 intentos de 100ms = 3 segundos
        let intents = 0;

        const verificar = () => {
            if (window.HAIntegration && window.HAIntegration.isConnected()) {
                resolve();
                return;
            }

            intents++;
            if (intents >= maxIntents) {
                reject(new Error('Timeout esperando conexiÃ³n a Home Assistant'));
                return;
            }

            setTimeout(verificar, 100);
        };

        verificar();
    });
}

// 5b. DESHACER ÃšLTIMA ACCIÃ“N (accesibilidad motriz / destreza)
// ============================================================
// Ofrece deshacer la Ãºltima acciÃ³n durante unos segundos: Ãºtil para quien puede
// tocar sin querer un botÃ³n vecino por un switch, temblor, o falta de precisiÃ³n.
var accionDeshacer = null;
var undoTimeoutId = null;
function ofrecerDeshacer(mensaje, fn) {
    accionDeshacer = fn;
    var toast = document.getElementById('undo-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'undo-toast';
        toast.className = 'undo-toast';
        document.body.appendChild(toast);
    }
    toast.innerHTML = '<span>' + mensaje + '</span><button onclick="ejecutarDeshacer()">â†©ï¸ Deshacer</button>';
    toast.classList.add('visible');
    clearTimeout(undoTimeoutId);
    undoTimeoutId = setTimeout(function() { toast.classList.remove('visible'); accionDeshacer = null; }, 5000);
}
function ejecutarDeshacer() {
    if (accionDeshacer) { var fn = accionDeshacer; accionDeshacer = null; fn(); }
    var toast = document.getElementById('undo-toast');
    if (toast) toast.classList.remove('visible');
    clearTimeout(undoTimeoutId);
}

        var nombre = key.replace(/_/g, ' ');
        hablar(estado + ' ' + nombre);

    }
}

function tomarMedicamento(id) {
    var med = medicamentos.find(function(m) { return m.id === id; });
    if (!med) return;
    var ultimaTomaAnterior = med.ultimaToma;
    var historialAnterior = med.historial.slice();
    var ahora = new Date();
    med.historial.push({ fecha: ahora.toISOString(), hora: ahora.toLocaleTimeString(), tomado: true });
    med.ultimaToma = ahora.toISOString();
    guardarDatos();
    renderScreen();
    hablar('Has tomado ' + med.nombre);
    vibrar('accion');
    ofrecerDeshacer(med.nombre + ' marcado como tomado', function() {
        med.ultimaToma = ultimaTomaAnterior;
        med.historial = historialAnterior;
        guardarDatos();
        renderScreen();
        hablar('Deshecho');
    });
}

function verificarMedicamentosPendientes() {
    var ahora = new Date();
    var tiempoActual = ahora.getHours() * 60 + ahora.getMinutes();
    for (var i = 0; i < medicamentos.length; i++) {
        var med = medicamentos[i];
        if (!med.activo) continue;
        var partes = med.horario.split(':');
        var h = parseInt(partes[0]);
        var m = parseInt(partes[1]);
        var tiempoMed = h * 60 + m;
        var diff = tiempoActual - tiempoMed;
        // Sin lÃ­mite superior: si ya pasÃ³ la hora y no se tomÃ³, sigue avisando
        // (incluye "atrapar" dosis atrasadas al volver a abrir la app despuÃ©s de un rato cerrada).
        if (diff >= 0) {
            var ultima = med.ultimaToma ? new Date(med.ultimaToma) : null;
            if (!ultima || ultima.getDate() !== ahora.getDate()) {
                mostrarRecordatorioMedicamento(med);
            }
        }
    }
}

    document.body.appendChild(overlay);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate(VIBRACION_PATRONES.recordatorio);

function verificarBateria() {
    if ('getBattery' in navigator) {
        navigator.getBattery().then(function(battery) {
            var nivel = battery.level * 100;
            var cargando = battery.charging;
            if (nivel <= 15 && !cargando && !alertaBateriaMostrada) {
                mostrarAlertaBateria(nivel);
            } else if (cargando || nivel > 15) {
                ocultarAlertaBateria();
            }
            battery.onlevelchange = function() {
                var nuevoNivel = battery.level * 100;
                if (nuevoNivel <= 15 && !battery.charging && !alertaBateriaMostrada) {
                    mostrarAlertaBateria(nuevoNivel);
                } else if (battery.charging || nuevoNivel > 15) {
                    ocultarAlertaBateria();
                }
            };
            battery.onchargingchange = function() {
                if (battery.charging) {
                    ocultarAlertaBateria();
                } else if (battery.level * 100 <= 15) {
                    mostrarAlertaBateria(battery.level * 100);
                }
            };
        }).catch(function() {});
    }
}

function mostrarAlertaBateria(nivel) {
    alertaBateriaMostrada = true;
    ocultarAlertaBateria();
    var alerta = document.createElement('div');
    alerta.className = 'bateria-alerta';
    alerta.id = 'alerta-bateria';
    alerta.innerHTML = '<span class="icono">ðŸ”‹</span><span>âš ï¸ BaterÃ­a baja: ' + Math.round(nivel) + '% - Conecta el cargador</span><button class="cerrar" onclick="ocultarAlertaBateria()">âœ•</button>';
    document.body.prepend(alerta);
    if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
    hablar('Alerta de baterÃ­a baja. Nivel: ' + Math.round(nivel) + ' por ciento. Conecta el cargador.');
}

var alertaBateriaMostrada = false;

function ocultarAlertaBateria() {
    alertaBateriaMostrada = false;
    var alerta = document.getElementById('alerta-bateria');
    if (alerta) alerta.remove();
}

function contarDispositivosEnSala(nombreSala) {
    var count = 0;
    for (var i = 0; i < DISPOSITIVOS_CATALOGO.length; i++) {
        var dev = DISPOSITIVOS_CATALOGO[i];
        if (personalizacionDispositivos[dev.key] && personalizacionDispositivos[dev.key].oculto) continue;
        var eff = datosEfectivosDispositivo(dev);
        if (eff.room === nombreSala) count++;

    for (var j = 0; j < dispositivosPersonalizados.length; j++) {
        if (dispositivosPersonalizados[j].zona === nombreSala) count++;

}

function guardarSala(id) {
    var nombre = document.getElementById('sala-nombre')?.value.trim();
    var icono = document.getElementById('sala-icono')?.value;
    if (!nombre) { hablar('PonÃ© un nombre para la sala'); return; }

    if (id === 'nueva') {
        salasPersonalizadas.push({ id: 'sala_' + Date.now().toString(36), nombre: nombre, icono: icono });
        hablar('Sala ' + nombre + ' agregada');
    } else {
        var sala = salasPersonalizadas.find(function(s) { return s.id === id; });
        if (!sala) return;
        var nombreAnterior = sala.nombre;
        sala.nombre = nombre;
        sala.icono = icono;
        if (nombreAnterior !== nombre) renombrarSalaEnDispositivos(nombreAnterior, nombre);
        hablar('Sala actualizada');

// Si se renombra una sala, actualiza automÃ¡ticamente todos los dispositivos
// (de fÃ¡brica y personalizados) que ya la tenÃ­an asignada, para que no queden
// con un nombre de sala que ya no existe.
function renombrarSalaEnDispositivos(nombreAnterior, nombreNuevo) {
    for (var i = 0; i < DISPOSITIVOS_CATALOGO.length; i++) {
        var dev = DISPOSITIVOS_CATALOGO[i];
        var eff = datosEfectivosDispositivo(dev);
        if (eff.room === nombreAnterior) {
            personalizacionDispositivos[dev.key] = Object.assign({}, personalizacionDispositivos[dev.key], { zona: nombreNuevo });
        }
    }
    for (var j = 0; j < dispositivosPersonalizados.length; j++) {
        if (dispositivosPersonalizados[j].zona === nombreAnterior) dispositivosPersonalizados[j].zona = nombreNuevo;
    }
}

function eliminarSala(id) {
    var sala = salasPersonalizadas.find(function(s) { return s.id === id; });
    if (!sala) return;
    var cantidad = contarDispositivosEnSala(sala.nombre);
    var mensaje = cantidad > 0
        ? 'Â¿Eliminar "' + sala.nombre + '"? Tiene ' + cantidad + ' dispositivo(s) asignados â€” van a conservar ese nombre, pero ya no vas a poder elegirlo para dispositivos nuevos.'
        : 'Â¿Eliminar la sala "' + sala.nombre + '"?';
    if (confirm(mensaje)) {
        salasPersonalizadas = salasPersonalizadas.filter(function(s) { return s.id !== id; });
        guardarDatos();
        renderScreen();
        hablar('Sala eliminada');
    }
}

// Corre todas las migraciones de una sola vez, leyendo el estado ORIGINAL de
// localStorage antes de que cualquiera de ellas escriba nada. Si una migraciÃ³n
// llamara a guardarDatos() por separado, esa llamada guarda TODOS los campos
// (incluidos los que otra migraciÃ³n todavÃ­a no revisÃ³), lo que hacÃ­a creer que
// esos campos "ya existÃ­an" cuando en realidad estaban reciÃ©n inicializados en
// vacÃ­o. Por eso todo el chequeo se hace primero, y el guardado al final.
async function ejecutarMigraciones() {
    var necesitaMigrarRutinas = localStorage.getItem('rutinasMigradas') === null;
    var teniaRutinasDeAntes = localStorage.getItem('rutinasPersonalizadas') !== null;
    var necesitaMigrarSalas = localStorage.getItem('salasMigradas') === null;
    var teniaSalasDeAntes = localStorage.getItem('salasPersonalizadas') !== null;

    var huboCambios = false;

    if (necesitaMigrarRutinas) {
        if (!teniaRutinasDeAntes) {
            rutinasPersonalizadas = JSON.parse(JSON.stringify(RUTINAS_SEED_DEFAULT));
            huboCambios = true;
        }
        localStorage.setItem('rutinasMigradas', '1');
    }

    if (necesitaMigrarSalas) {
        if (!teniaSalasDeAntes) {
            var iconosPorZona = { 'Sala': 'ðŸ›‹ï¸', 'Cocina': 'ðŸ³', 'Dormitorio 1': 'ðŸ›ï¸', 'Dormitorio 2': 'ðŸ›ï¸', 'Dormitorio 3': 'ðŸ›ï¸', 'Patio': 'ðŸŒ¿', 'Pasillo': 'ðŸš¶', 'BaÃ±o': 'ðŸš¿', 'Comedor': 'ðŸ½ï¸', 'Estudio': 'ðŸ“š' };
            salasPersonalizadas = zonasDisponibles.map(function(nombre, i) {
                return { id: 'sala_' + i, nombre: nombre, icono: iconosPorZona[nombre] || 'ðŸ ' };
            });
            huboCambios = true;
        }
        localStorage.setItem('salasMigradas', '1');
    }

    if (huboCambios) await guardarDatos();
}

function agregarAccionARutina() {
    var key = document.getElementById('rutina-dispositivo')?.value;
    var valor = document.getElementById('rutina-valor')?.value === 'true';
    if (!key) return;
    accionesTemporalesRutina = accionesTemporalesRutina.filter(function(a) { return a.key !== key; }); // evita duplicados del mismo dispositivo
    accionesTemporalesRutina.push({ key: key, valor: valor });
    var lista = document.getElementById('rutina-acciones-lista');
    if (lista) lista.innerHTML = renderListaAccionesTemporal();
}

function quitarAccionDeRutina(index) {

function guardarRutinaPersonalizada() {
    var nombre = document.getElementById('rutina-nombre')?.value.trim();
    var icono = document.getElementById('rutina-icono')?.value;
    if (!nombre) { hablar('PonÃ© un nombre para la rutina'); return; }
    if (accionesTemporalesRutina.length === 0) { hablar('AgregÃ¡ al menos una acciÃ³n a la rutina'); return; }

    if (rutinaEditandoId === 'nueva') {
        var id = 'rut_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
        rutinasPersonalizadas.push({ id: id, nombre: nombre, icono: icono, color: '#3b82f6', esDefault: false, acciones: accionesTemporalesRutina.slice() });
        hablar('Rutina ' + nombre + ' creada');
    } else {
        var idx = rutinasPersonalizadas.findIndex(function(r) { return r.id === rutinaEditandoId; });
        if (idx !== -1) {
            // conservamos las acciones de termostato/cortinas que traÃ­a si eran de una rutina migrada,
            // y les sumamos las que se editaron en el armador simple
            var especiales = rutinasPersonalizadas[idx].acciones.filter(function(a) { return a.key === 'termostato' || a.key === 'cortinas'; });
            rutinasPersonalizadas[idx].nombre = nombre;
            rutinasPersonalizadas[idx].icono = icono;
            rutinasPersonalizadas[idx].acciones = accionesTemporalesRutina.concat(especiales);
        }
        hablar('Rutina actualizada');
    }
    rutinaEditandoId = null;
    accionesTemporalesRutina = [];
    guardarDatos();
    renderScreen();
}

function toggleScanning() {
    modoScanningActivo = !modoScanningActivo;
    if (modoScanningActivo) iniciarScanning();
    else detenerScanning();
    renderScreen();
}

function iniciarScanning() {
    detenerScanning();
    if (!modoScanningActivo) return;
    scanningElementos = document.querySelectorAll('.device-card, .routine-btn, .emergency-btn, .call-btn, .toggle, .setting-toggle, .tomar-btn, .eliminar-btn, .llamar-btn, .sms-btn, .panel-cuidador-btn, .aac-tile, .voice-fab, .overlay-bienvenida-btn');
    if (scanningElementos.length === 0) { setTimeout(iniciarScanning, 500); return; }
    scanningIndice = 0;
    avanzarScanning();
    scanningTimer = setInterval(avanzarScanning, velocidadScanning);
}

function detenerScanning() {
    if (scanningTimer) { clearInterval(scanningTimer); scanningTimer = null; }
    document.querySelectorAll('.scanning-active').forEach(function(el) { el.classList.remove('scanning-active'); });
}

function avanzarScanning() {
    document.querySelectorAll('.scanning-active').forEach(function(el) { el.classList.remove('scanning-active'); });
    if (scanningElementos.length === 0) return;
    var encontrado = false, intentos = 0;
    while (!encontrado && intentos < scanningElementos.length) {
        var el = scanningElementos[scanningIndice];
        if (el && el.offsetParent !== null && !el.disabled) {
            encontrado = true;
            el.classList.add('scanning-active');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate(10);
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        scanningIndice = (scanningIndice + 1) % scanningElementos.length;
        intentos++;
    }
}

document.addEventListener('click', function(e) {
    if (modoScanningActivo) {
        var el = e.target.closest('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(function() { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

document.addEventListener('keydown', function(e) {
    if ((e.key === ' ' || e.key === 'Enter') && modoScanningActivo) {
        e.preventDefault();
        var el = document.querySelector('.scanning-active');
        if (el) {
            el.classList.remove('scanning-active');
            el.classList.add('scanning-confirmado');
            if (config.vibracionActiva && navigator.vibrate) navigator.vibrate([50, 30, 50]);
            setTimeout(function() { el.click(); el.classList.remove('scanning-confirmado'); }, 200);
            detenerScanning();
            setTimeout(iniciarScanning, 1000);
        }
    }
});

var reconocimientoVoz = null;
var escuchandoVoz = false;
var vozSoportada = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
var contextoSeguro = (window.isSecureContext !== false); // false en la mayorÃ­a de navegadores si se abre como archivo local (file://)
var manosLibres = false; // true = el micrÃ³fono queda escuchando todo el tiempo, sin volver a tocar el botÃ³n
var bloqueadoPorHabla = false; // true mientras la app estÃ¡ hablando, para no captar su propia voz como orden

function normalizarTexto(t) {
    return (t || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[Â¿?Â¡!.,]/g, '')
        .trim();
}

function initReconocimientoVoz() {
    if (!vozSoportada) return;
    try {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconocimientoVoz = new SR();
        reconocimientoVoz.lang = 'es-ES';
        reconocimientoVoz.continuous = true;      // se queda escuchando en vez de cerrarse tras una frase
        reconocimientoVoz.interimResults = false;
        reconocimientoVoz.maxAlternatives = 1;
    } catch (e) {
        console.error('ðŸŽ¤ No se pudo crear el reconocedor de voz:', e);
        reconocimientoVoz = null;
        mostrarTranscript('âš ï¸ No se pudo inicializar el micrÃ³fono (' + (e && e.message ? e.message : 'error desconocido') + ')');
        ocultarTranscriptDelay(4000);
        return;
    }

    reconocimientoVoz.onstart = function() {
        escuchandoVoz = true;
        actualizarUIVoz();
        mostrarTranscript(manosLibres ? 'ðŸŽ¤ Escucha continua activada. Decime una orden.' : 'ðŸŽ¤ Escuchando...');
        ocultarTranscriptDelay(2500);
    };

    reconocimientoVoz.onresult = function(event) {
        // en modo continuo pueden llegar varios resultados; procesamos solo los nuevos
        for (var i = event.resultIndex; i < event.results.length; i++) {
            if (!event.results[i].isFinal) continue;
            var texto = event.results[i][0].transcript;
            mostrarTranscript('ðŸ—£ï¸ "' + texto + '"');
            procesarComandoVoz(texto);
        }
    };

    reconocimientoVoz.onerror = function(event) {
        escuchandoVoz = false;
        actualizarUIVoz();
        console.error('ðŸŽ¤ Error de reconocimiento de voz:', event.error);
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            manosLibres = false;
            cambiarConfig('manosLibres', false);
            if (!contextoSeguro) {
                mostrarTranscript('âš ï¸ El micrÃ³fono estÃ¡ bloqueado porque la app se abriÃ³ como archivo local. NecesitÃ¡s abrirla desde una direcciÃ³n https:// (ver instrucciones en ConfiguraciÃ³n).');
                ocultarTranscriptDelay(6000);
            } else {
                hablar('No tengo permiso para usar el micrÃ³fono');
                mostrarTranscript('âš ï¸ Permiso de micrÃ³fono denegado. Habilitalo en los ajustes del navegador para este sitio.');
                ocultarTranscriptDelay(4500);
            }
        } else if (event.error === 'network') {
            mostrarTranscript('âš ï¸ Sin conexiÃ³n al servicio de voz. El reconocimiento necesita internet.');
            ocultarTranscriptDelay(3500);
        } else if (event.error === 'no-speech') {
            // normal en escucha continua: simplemente no se dijo nada, se reintenta solo
            ocultarTranscriptDelay(800);
        } else if (event.error !== 'aborted') {
            mostrarTranscript('âš ï¸ Error de voz: ' + event.error);
            ocultarTranscriptDelay(3000);
        } else {
            ocultarTranscriptDelay(800);
        }
    };

    reconocimientoVoz.onend = function() {
        escuchandoVoz = false;
        actualizarUIVoz();
        // en escucha continua, el navegador puede cortar el reconocimiento solo (silencio largo, lÃ­mite de tiempo, etc.)
        // lo reiniciamos automÃ¡ticamente mientras el modo manos libres siga activo,
        // salvo que lo hayamos parado nosotros para hablar (en ese caso reanuda hablar() al terminar)
        if (manosLibres && !bloqueadoPorHabla) {
            setTimeout(function() { if (manosLibres && !bloqueadoPorHabla) iniciarEscuchaVoz(); }, 400);
        }
    };
}

function buscarDispositivoPorTexto(texto) {
    for (var i = 0; i < dispositivosPersonalizados.length; i++) {
        var nombreNorm = normalizarTexto(dispositivosPersonalizados[i].nombre);
        if (nombreNorm && texto.indexOf(nombreNorm) !== -1) {
            return 'custom_' + dispositivosPersonalizados[i].id;
        }
    }
    var candidatos = [];
    for (var j = 0; j < VOICE_DEVICES.length; j++) {
        var dev = VOICE_DEVICES[j];
        for (var k = 0; k < dev.frases.length; k++) {
            var frase = normalizarTexto(dev.frases[k]);
            if (texto.indexOf(frase) !== -1) {
                candidatos.push({ key: dev.key, largo: frase.length });
            }
        }
    }
    if (candidatos.length === 0) return null;
    candidatos.sort(function(a, b) { return b.largo - a.largo; });
    return candidatos[0].key;
}

function nombreLegibleDispositivo(key) {
    var idx = dispositivosPersonalizados.findIndex(function(d) { return 'custom_' + d.id === key; });
    if (idx !== -1) return dispositivosPersonalizados[idx].nombre;
    return NOMBRES_LEGIBLES[key] || key.replace(/_/g, ' ');
}

function establecerDispositivo(key, estado) {
    var estadoAnterior = deviceStates[key];
    deviceStates[key] = estado;
    renderScreen();
    guardarDatos();
    hablar((estado ? 'Encendido ' : 'Apagado ') + nombreLegibleDispositivo(key));
    ofrecerDeshacer(nombreLegibleDispositivo(key) + ' ' + (estado ? 'encendido' : 'apagado'), function() { deviceStates[key] = estadoAnterior; renderScreen(); guardarDatos(); hablar('Deshecho'); });
}

function alternarDispositivoVoz(key) {
    establecerDispositivo(key, !deviceStates[key]);
}

function procesarComandoVoz(textoOriginal) {
    var texto = normalizarTexto(textoOriginal);
    if (!texto) return;

    // --- Detener la escucha continua con la voz misma ---
    if (/^(silencio|dejar de escuchar|para de escuchar|apagate|dejÃ¡ de escuchar|pausa)$/.test(texto)) {
        if (manosLibres) { detenerEscuchaVoz(); } else { hablar('Listo'); }
        return;
    }

    if (/^(cancelar|nada|olvidalo|listo|ok)$/.test(texto)) {
        return; // no hace ni dice nada, evita ruido en escucha continua
    }

    // --- Describir la pantalla actual (accesibilidad visual) ---
    if (/que hay (en esta pantalla|aca)|donde estoy|describime la pantalla|describi la pantalla|que puedo hacer (aca|aqui)/.test(texto)) {
        leerPantallaActual();
        return;
    }

    // --- Emergencia (palabra suelta, la mÃ¡s corta de todas) ---
    if (/\b(emergencia|socorro|auxilio|necesito ayuda|ayuda)\b/.test(texto)) {
        activarEmergencia(true);
        return;
    }

    // --- Rutinas: alias cortos de una sola palabra + frases completas ---
    if (/\b(casa|llegue|lleguÃ©|llegada)\b/.test(texto) || /lleg(u|ue)e? a casa|llegando a casa/.test(texto)) { ejecutarRutina('LleguÃ© a casa'); return; }
    if (/\b(afuera|salgo|salida)\b/.test(texto) || /me voy( de casa)?|salgo de casa/.test(texto)) { ejecutarRutina('Me voy de casa'); return; }
    if (/\b(dia|buendia)\b/.test(texto) || /buenos dias/.test(texto)) { ejecutarRutina('Buenos DÃ­as'); return; }
    if (/\b(noche|buenanoche)\b/.test(texto) || /buenas noches/.test(texto)) { ejecutarRutina('Buenas Noches'); return; }
    if (/modo tv|modo television/.test(texto)) { ejecutarRutina('Modo TV'); return; }
    if (/modo fresco/.test(texto)) { ejecutarRutina('Modo Fresco'); return; }
    if (/modo cine/.test(texto)) { ejecutarRutina('Modo Cine'); return; }

    // --- NavegaciÃ³n (alias cortos) ---
    if (/^inicio$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (el )?inicio/.test(texto)) { navTo('home'); return; }
    if (/^salas$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (las )?salas/.test(texto)) { navTo('salas'); return; }
    if (/^dispositivos$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (los |mis )?dispositivos/.test(texto)) { navTo('devices'); return; }
    if (/^(comunicar|comunicacion|pictogramas|tablero)$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (el )?(tablero|comunicacion)/.test(texto)) { navTo('aac'); return; }
    if (/^rutinas$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (las )?rutinas/.test(texto)) { navTo('routines'); return; }
    if (/^medicamentos$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (los |mis )?medicamentos/.test(texto)) { navTo('medicamentos'); return; }
    if (/^contactos$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (los )?contactos/.test(texto) || /(ir a|ve a) emergencia/.test(texto)) { navTo('emergency'); return; }
    if (/^(configuracion|ajustes)$/.test(texto) || /(ir a|ve a|mostrar|muestrame|abrir) (la )?configuracion/.test(texto)) { navTo('settings'); return; }
    if (/panel del cuidador|panel cuidador/.test(texto)) { abrirPanelCuidador(); return; }

    var matchTemp = texto.match(/(sube|subir|aumenta|aumentar|baja|bajar|disminuye|disminuir) (la )?temperatura( (\d+) grados?)?/);
    if (matchTemp) {
        var subir = /sube|subir|aumenta|aumentar/.test(matchTemp[1]);
        var grados = matchTemp[4] ? parseInt(matchTemp[4], 10) : 1;
        adjustTemp(subir ? grados : -grados);
        return;
    }
    if (/mas calor|mas caliente/.test(texto)) { adjustTemp(1); return; }
    if (/mas frio|mas fresco/.test(texto)) { adjustTemp(-1); return; }

    if (/(abre|abrir|sube|subir) (las )?cortinas/.test(texto)) { adjustCortinas(25); return; }
    if (/(cierra|cerrar|baja|bajar) (las )?cortinas/.test(texto)) { adjustCortinas(-25); return; }

    if (/(abre|abrir) la puerta/.test(texto)) { establecerDispositivo('puerta', true); return; }
    if (/(cierra|cerrar) la puerta/.test(texto)) { establecerDispositivo('puerta', false); return; }
    if (/(traba|cierra con llave|asegura) la puerta/.test(texto)) { establecerDispositivo('puerta_traba', true); return; }
    if (/(destraba|abre la traba|quita el seguro)/.test(texto)) { establecerDispositivo('puerta_traba', false); return; }

    var matchLlamar = texto.match(/llama(r)? a (.+)/);
    if (matchLlamar) {
        var nombreBuscado = matchLlamar[2].trim();
        var contacto = contactosEmergencia.find(function(c) { return normalizarTexto(c.nombre).indexOf(nombreBuscado) !== -1 || nombreBuscado.indexOf(normalizarTexto(c.nombre)) !== -1; });
        if (contacto) { llamarContacto(contacto.id); }
        else { hablar('No encontrÃ© un contacto llamado ' + nombreBuscado); }
        return;
    }

    var matchMed = texto.match(/(ya )?tom[Ã©e] (el |la )?(.+)/);
    if (matchMed) {
        var nombreMed = matchMed[3].trim();
        var med = medicamentos.find(function(m) { return normalizarTexto(m.nombre).indexOf(nombreMed) !== -1 || nombreMed.indexOf(normalizarTexto(m.nombre)) !== -1; });
        if (med) { tomarMedicamento(med.id); }
        else { hablar('No encontrÃ© el medicamento ' + nombreMed); }
        return;
    }

    var esEncender = /^(enciende|prende|activa|conecta)/.test(texto);
    var esApagar = /^(apaga|desactiva|desconecta)/.test(texto);
    if (esEncender || esApagar) {
        var key = buscarDispositivoPorTexto(texto);
        if (key) { establecerDispositivo(key, esEncender); return; }
    }

    var keySolo = buscarDispositivoPorTexto(texto);
    if (keySolo && texto.split(' ').length <= 5) {
        alternarDispositivoVoz(keySolo);
        return;
    }

    // Palabras sueltas muy cortas (ruido de fondo, tos, etc.) no generan ni cartel ni voz
    if (texto.length < 3) return;

    mostrarTranscript('â“ No entendÃ­: "' + textoOriginal + '"');
    ocultarTranscriptDelay(3000);
    // En escucha continua evitamos hablar "no entendÃ­" todo el tiempo (serÃ­a muy molesto);
    // avisamos como mÃ¡ximo una vez cada 12 segundos.
    var ahora = Date.now();
    if (!manosLibres || (ahora - ultimoFallbackHablado > 12000)) {
        ultimoFallbackHablado = ahora;
        hablar(manosLibres ? 'No entendÃ­' : 'No entendÃ­ el comando. TocÃ¡ el signo de pregunta en configuraciÃ³n para ver ejemplos');
    }
}

// ============================================================
// 14b. NOTIFICACIONES REALES DEL SISTEMA (recordatorios en 2Âº plano)
// ============================================================
// Nota importante: esto hace que los recordatorios se vean como notificaciones
// reales del celular (con sonido/vibraciÃ³n y botones), y funcionan mientras la
// app siga corriendo en 2Âº plano (minimizada, pantalla bloqueada). Si el
// navegador o la app estÃ¡n COMPLETAMENTE cerrados (o el celular estuvo apagado),
// ningÃºn navegador puede ejecutar cÃ³digo â€” eso requerirÃ­a notificaciones push
// desde un servidor propio, o convertir la app en una app nativa instalada.
var swRegistration = null;

function registrarServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js').then(function(reg) {
        swRegistration = reg;
        console.log('âœ… Service Worker registrado, notificaciones en 2Âº plano disponibles');
    }).catch(function(e) {
        console.error('No se pudo registrar el Service Worker:', e);
    });

    navigator.serviceWorker.addEventListener('message', function(event) {
        if (!event.data || event.data.tipo !== 'recordatorio-accion') return;
        var med = medicamentos.find(function(m) { return m.id === event.data.medId; });
        if (!med) return;
        if (event.data.accion === 'tomado') {
            tomarMedicamento(med.id);
        } else if (event.data.accion === 'posponer') {
            setTimeout(function() { mostrarRecordatorioMedicamento(med); }, 10 * 60 * 1000);
        }
        var overlay = document.querySelector('.recordatorio-overlay[data-med-id="' + med.id + '"]');
        if (overlay) overlay.remove();
    });
}

function pedirPermisoNotificaciones() {
    if (!('Notification' in window)) {
        mostrarTranscript('âš ï¸ Este navegador no admite notificaciones del sistema');
        ocultarTranscriptDelay(3000);
        return;
    }
    Notification.requestPermission().then(function(permiso) {
        renderScreen();
        if (permiso === 'granted') {
            hablar('Notificaciones activadas');
        } else {
            mostrarTranscript('âš ï¸ No se otorgÃ³ permiso de notificaciones. Los recordatorios solo se van a ver dentro de la app.');
            ocultarTranscriptDelay(4000);
        }
    });
}

function solicitarNotificacionSistema(med) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
        navigator.serviceWorker.ready.then(function(reg) {
            if (reg.active) reg.active.postMessage({ tipo: 'mostrar-recordatorio', medicamento: med });
        }).catch(function() {});
    }
}

// Si la notificaciÃ³n tuvo que abrir la app desde cero (no estaba abierta),
// llega con estos parÃ¡metros en la URL: los procesamos apenas cargan los datos.
function procesarAccionDesdeURL() {
    var params = new URLSearchParams(window.location.search);
    var medId = params.get('recordatorio');
    var accion = params.get('accion');
    if (!medId) return;
    var med = medicamentos.find(function(m) { return m.id === medId; });
    if (med) {
        if (accion === 'tomado') { tomarMedicamento(med.id); }
        else if (accion === 'posponer') { setTimeout(function() { mostrarRecordatorioMedicamento(med); }, 10 * 60 * 1000); }
        else { mostrarRecordatorioMedicamento(med); }
    }
    // limpia la URL para que no se repita la acciÃ³n si se recarga la pÃ¡gina
    window.history.replaceState({}, document.title, window.location.pathname);
}
